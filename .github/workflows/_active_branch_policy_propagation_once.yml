name: One-shot active branch policy propagation note

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and verify edit
        run: |
          python .github/_tmp_active_branch_policy_propagation.py
          rm .github/_tmp_active_branch_policy_propagation.py
          rm .github/workflows/_active_branch_policy_propagation_once.yml
          git diff --check
          git diff -- docs/process/session-reconstitution.md
          git config user.name 'Bob Taylor'
          git config user.email 'bobltaylorjr@gmail.com'
          git add docs/process/session-reconstitution.md .github/_tmp_active_branch_policy_propagation.py .github/workflows/_active_branch_policy_propagation_once.yml
          git commit -m 'docs(process): propagate authority changes to active branches'
          git push
