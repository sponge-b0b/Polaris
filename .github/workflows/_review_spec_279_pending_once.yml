name: One-shot review-spec 279 pending persistence

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_review_spec_279_pending_once.yml

permissions:
  contents: read
  issues: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persist review packet and proof reuse ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/_tmp_review_spec_279_pending.py')
          text = path.read_text(encoding='utf-8')
          old = 'hashlib.sha256(spec["body"].encode("utf-8"))'
          new = 'hashlib.sha256((spec["body"] + "\\n").encode("utf-8"))'
          assert old in text
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python .github/_tmp_review_spec_279_pending.py
