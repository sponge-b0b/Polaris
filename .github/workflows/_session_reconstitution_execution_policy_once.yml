name: One-shot session reconstitution execution policy reconciliation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python .github/_tmp_session_reconstitution_execution_policy.py
