name: One-shot session reconstitution hardening

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and verify edit
        run: |
          python .github/_tmp_session_reconstitution_hardening.py
          rm .github/_tmp_session_reconstitution_hardening.py
          rm .github/workflows/_session_reconstitution_hardening_once.yml
          git diff --check
          git diff -- docs/process/session-reconstitution.md
          git config user.name 'Bob Taylor'
          git config user.email 'bobltaylorjr@gmail.com'
          git add docs/process/session-reconstitution.md .github/_tmp_session_reconstitution_hardening.py .github/workflows/_session_reconstitution_hardening_once.yml
          git commit -m 'docs(process): harden session reconstitution mechanics'
          git push
