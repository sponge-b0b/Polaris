name: One-shot session reconstitution housekeeping hardening

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message == 'chore(process): arm housekeeping hardening workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and verify edit
        run: |
          python .github/_tmp_session_reconstitution_housekeeping.py
          git diff --check
          git diff -- docs/process/session-reconstitution.md
          git config user.name 'Bob Taylor'
          git config user.email 'bobltaylorjr@gmail.com'
          git add docs/process/session-reconstitution.md
          git commit -m 'docs(process): harden authority and branch housekeeping'
          git push
