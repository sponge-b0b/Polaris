name: One-shot verify-spec 279 finalizer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_verify_spec_279_finalize_once.yml

permissions:
  contents: read
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize and persist Spec 279 verification receipt
        env:
          GH_TOKEN: ${{ github.token }}
          POLARIS_DEFAULT_HEAD: ${{ github.sha }}
        run: python .github/_tmp_verify_spec_279_finalize.py
