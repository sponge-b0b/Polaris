name: Apply workflow hardening

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct transport-only preflight
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_workflow_hardening.py')
          text = p.read_text()
          old = '''parent = run("git", "rev-parse", "HEAD^")\nif parent != EXPECTED_PARENT:\n    raise RuntimeError(f"unexpected staging parent: {parent} != {EXPECTED_PARENT}")\n'''
          new = '''subprocess.run(["git", "merge-base", "--is-ancestor", EXPECTED_PARENT, "HEAD"], check=True)\n'''
          if text.count(old) != 1:
              raise SystemExit('transport parent anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''# Net delta from the pre-transport main commit must be exactly the authorized six files.\nchanged = set(run("git", "diff", "--name-only", EXPECTED_PARENT).splitlines())\nif changed != TARGETS:\n    raise RuntimeError(f"unexpected net changed paths: {sorted(changed)}")\n\nsubprocess.run(["git", "diff", "--check", EXPECTED_PARENT], check=True)\n'''
          new = '''# Net persistent-delta validation runs after the transport files are removed.\nsubprocess.run(["git", "diff", "--check"], check=True)\n'''
          if text.count(old) != 1:
              raise SystemExit('transport delta anchor mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Apply bounded workflow patch
        run: python .github/scripts/apply_workflow_hardening.py
      - name: Remove transport files and validate authorized delta
        run: |
          git rm .github/scripts/apply_workflow_hardening.py .github/workflows/apply-workflow-hardening.yml
          test "$(git diff --name-only 793c9e1c046d4b9a6b531b1b645c131af50a7bbb | sort)" = "$(printf '%s\n' \
            .agents/skills/README.md \
            .agents/skills/review-spec-remediation/SKILL.md \
            .agents/skills/review-spec/SKILL.md \
            .agents/skills/to-tickets/SKILL.md \
            .agents/skills/verify-ticket-closure/SKILL.md \
            docs/process/common-sense-invariant-hardening-semantic-domain-finality-addendum.md | sort)"
          git diff --check 793c9e1c046d4b9a6b531b1b645c131af50a7bbb
      - name: Persist workflow hardening
        run: |
          git config user.name "Bob Taylor"
          git config user.email "bobltaylorjr@gmail.com"
          git add -A
          git commit -m "fix(workflow): reconcile certified domain defects"
          git push origin HEAD:main
