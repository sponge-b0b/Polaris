name: chatgpt-cd-consistency-cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/chatgpt-cd-consistency-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align decomposition/finality wording
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          review = ".agents/skills/review-spec/SKILL.md"
          replace(
              review,
              "Domain membership becomes stale only when its recorded governing authority changes or an explicit closure-authority defect is reconciled.",
              "Domain membership becomes stale only when its recorded governing authority changes or exact explicit authority invalidates the prior boundary under the rules below.",
          )
          replace(
              review,
              "* `domain-expansion` and `closure-authority-defect` observations are excluded from active remediation until their own finality disposition authorizes otherwise.",
              "* `domain-expansion` observations are excluded from active remediation under unchanged authority; `decomposition-defect` findings remain Blocking but route to `$to-tickets` rather than ordinary Root Blocker synthesis.",
          )
          replace(
              review,
              "Only finality-surviving findings become current Blocking findings. Preserve rejected domain-expansion/closure-authority-defect observations explicitly; do not silently delete them or move them to another axis.",
              "Only findings that survive the applicable decomposition-integrity and semantic-domain-finality gates become ordinary current Blocking findings. Preserve rejected `domain-expansion` observations explicitly; preserve `decomposition-defect` findings as Blocking routing state until `$to-tickets` reconciles them.",
          )
          replace(
              review,
              "Only after findings survive axis provenance **and Domain Finality Reconciliation** may the parent use them to mutate Root Blocker state.",
              "Only after findings survive axis provenance, decomposition-integrity routing, **and semantic-domain finality** may the parent use ordinary findings to mutate Root Blocker state.",
          )

          remediation = ".agents/skills/review-spec-remediation/SKILL.md"
          replace(
              remediation,
              "A root-definition gap may expand affected semantic surfaces, exit checks, and acceptance obligations while preserving the same stable invariant **only when the Certified Domain Reconciliation Gate above permits that expansion**. A certified frozen domain under unchanged authority may not be enlarged by this clause.\n\nIf the invariant itself would materially broaden, create a new root only when the current accepted finding is not a prohibited domain-expansion/closure-authority-defect under the gate above.",
              "A root-definition gap may expand affected semantic surfaces, exit checks, and acceptance obligations while preserving the same stable invariant **only when the current `$review-spec` semantic-domain-finality disposition permits that expansion**. A certified frozen domain under unchanged authority may not be enlarged by this clause.\n\nIf the invariant itself would materially broaden, create a new root only when the current accepted finding is neither a non-actionable `domain-expansion` nor an unresolved `decomposition-defect` awaiting `$to-tickets` reconciliation.",
          )
          replace(
              remediation,
              "A new sibling manifestation adds/opens the narrow missing cell only when it survived Certified Domain Reconciliation. A domain-expansion observation becomes `domain-excluded`; it does not downgrade unrelated satisfied siblings.",
              "A new sibling manifestation adds/opens the narrow missing cell only when it survived the current `$review-spec` semantic-domain-finality gate. A domain-expansion observation becomes `domain-excluded`; a decomposition defect remains separate routing state until `$to-tickets` reconciles it.",
          )
          replace(
              remediation,
              "4. apply Certified Domain Reconciliation to every finding against a previously satisfied/closed root;",
              "4. consume the current `$review-spec` decomposition-integrity and semantic-domain-finality disposition for every finding against a previously satisfied/closed root;",
          )
          replace(
              remediation,
              "* Domain Finality Reconciliation results;",
              "* decomposition-integrity and semantic-domain-finality results;",
          )
          replace(
              remediation,
              "mean current independently validated Blocking findings that remain active after validated scope corrections **and Certified Domain Reconciliation**.",
              "mean current independently validated ordinary Blocking findings that remain active after validated scope corrections **and semantic-domain finality**; decomposition defects are tracked separately as required above.",
          )
          replace(
              remediation,
              "Do not use Owner Override to repair attribution/domain mistakes that meet Scope Correction or Certified Domain Reconciliation rules.",
              "Do not use Owner Override to repair attribution, decomposition, or semantic-domain-finality mistakes that meet Scope Correction, decomposition-defect, or domain-expansion rules.",
          )
          PY

      - name: Validate
        run: |
          git diff --check
          ! grep -n --fixed-strings 'closure-authority-defect' .agents/skills/review-spec/SKILL.md .agents/skills/review-spec-remediation/SKILL.md
          ! grep -n --fixed-strings 'Certified Domain Reconciliation Gate' .agents/skills/review-spec-remediation/SKILL.md

      - name: Commit and remove transport
        run: |
          rm -f .github/workflows/chatgpt-cd-consistency-cleanup.yml
          git add -A
          git diff --cached --check
          git config user.name "Bob Taylor"
          git config user.email "bobltaylorjr@gmail.com"
          git commit -m "fix(workflow): align decomposition finality wording"
          git push origin HEAD:main
