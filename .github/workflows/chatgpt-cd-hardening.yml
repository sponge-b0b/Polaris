name: chatgpt-cd-hardening

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/chatgpt_cd_hardening.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply decomposition hardening
        run: python .github/scripts/chatgpt_cd_hardening.py

      - name: Validate patch
        run: |
          git diff --check
          grep -R --line-number --fixed-strings '<!-- decomposition-defects:v1 -->' \
            .agents/skills/README.md \
            .agents/skills/to-tickets/SKILL.md \
            .agents/skills/verify-spec/SKILL.md
          ! grep -R --line-number --fixed-strings 'Certified Closure Domain Reconciliation mode' \
            .agents/skills/README.md \
            .agents/skills/review-spec/SKILL.md \
            .agents/skills/review-spec-remediation/SKILL.md \
            .agents/skills/verify-ticket-closure/SKILL.md \
            docs/process/common-sense-invariant-hardening-semantic-domain-finality-addendum.md

      - name: Commit canonical hardening and remove transport
        run: |
          rm -f .github/scripts/chatgpt_cd_hardening.py .github/scripts/chatgpt_cd_hardening.part*
          rm -f .github/workflows/chatgpt-cd-hardening.yml
          git add -A
          git diff --cached --check
          git config user.name "Bob Taylor"
          git config user.email "bobltaylorjr@gmail.com"
          git commit -m "fix(workflow): route decomposition defects through ticketing"
          git push origin HEAD:main
