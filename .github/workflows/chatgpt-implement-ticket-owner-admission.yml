name: ChatGPT apply implement-ticket owner admission fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-implement-ticket-owner-admission.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Apply bounded skill fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import base64
          from pathlib import Path
          path = Path('.agents/skills/implement-ticket/SKILL.md')
          text = path.read_text()
          marker = '### Ticket Baseline Guard\n'
          heading = '### Project-delivery result admission\n'
          if heading in text:
              raise SystemExit('delegated-owner gate already present')
          if text.count(marker) != 1:
              raise SystemExit(f'expected exactly one insertion marker, found {text.count(marker)}')
          section = base64.b64decode('').decode()
          path.write_text(text.replace(marker, section + marker, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = ".agents/skills/implement-ticket/SKILL.md"
          git add .agents/skills/implement-ticket/SKILL.md
          git commit -m "fix(workflow): enforce implement-ticket owner admission"
          git push origin HEAD:main
