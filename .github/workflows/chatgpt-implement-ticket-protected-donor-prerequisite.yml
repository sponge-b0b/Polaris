name: ChatGPT fix implement-ticket protected donor prerequisite

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-implement-ticket-protected-donor-prerequisite.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Apply and propagate bounded fix
        shell: bash
        run: |
          set -euo pipefail
          BASE=e130b77e7ed0314ddb5c5634fb82784465e6596a
          SPEC_HEAD=3961dbdd5f36fbcb4042f716cc44506c643a7f46
          OLD_BLOB=16b54cced91b30ef5ac613645b69266cc4cc9eed
          SKILL=.agents/skills/implement-ticket/SKILL.md
          WORKFLOW=.github/workflows/chatgpt-implement-ticket-protected-donor-prerequisite.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse "$BASE:$SKILL")" = "$OLD_BLOB"
          test "$(git diff --name-only "$BASE"..HEAD)" = "$WORKFLOW"
          git fetch origin spec-357
          test "$(git rev-parse origin/spec-357)" = "$SPEC_HEAD"
          test "$(git rev-parse "origin/spec-357:$SKILL")" = "$OLD_BLOB"

          python - <<'PY'
          import base64
          from pathlib import Path

          path = Path(".agents/skills/implement-ticket/SKILL.md")
          text = path.read_text()
          old = (
              "#### Ordinary baseline path\n\n"
              "When neither destination nor source live-WIP recovery mode applies:\n"
          )
          new = (
              "#### Ordinary baseline path\n\n"
              "When none of destination, source, or protected-donor prerequisite "
              "isolation applies:\n"
          )
          if "#### Protected-donor prerequisite isolation\n" in text:
              raise SystemExit("fix already present")
          if text.count(old) != 1:
              raise SystemExit(f"unexpected ordinary-baseline marker count: {text.count(old)}")
          section = base64.b64decode("").decode()
          path.write_text(text.replace(old, section + new, 1))
          PY

          git diff --check
          test "$(git diff --name-only)" = "$SKILL"
          git add "$SKILL"
          git commit -m "fix(workflow): isolate protected-donor prerequisites"
          FIX_COMMIT=$(git rev-parse HEAD)
          SKILL_BLOB=$(git rev-parse "HEAD:$SKILL")
          git push origin HEAD:main

          TMP=$(mktemp -d)
          git worktree add --detach "$TMP" "$SPEC_HEAD"
          git -C "$TMP" config user.name "github-actions[bot]"
          git -C "$TMP" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show "$FIX_COMMIT:$SKILL" > "$TMP/$SKILL"
          git -C "$TMP" diff --check
          test "$(git -C "$TMP" diff --name-only)" = "$SKILL"
          test "$(git -C "$TMP" hash-object "$SKILL")" = "$SKILL_BLOB"
          git -C "$TMP" add "$SKILL"
          git -C "$TMP" commit -m "fix(workflow): propagate protected-donor prerequisite isolation"
          SPEC_COMMIT=$(git -C "$TMP" rev-parse HEAD)
          git -C "$TMP" push origin HEAD:spec-357
          git fetch origin spec-357
          test "$(git rev-parse "origin/spec-357:$SKILL")" = "$SKILL_BLOB"
          git worktree remove "$TMP"

          git rm "$WORKFLOW"
          git commit -m "chore: remove implement-ticket fix transport"
          FINAL_MAIN=$(git rev-parse HEAD)
          test "$(git rev-parse "HEAD:$SKILL")" = "$SKILL_BLOB"
          git push origin HEAD:main

          echo "FIX_COMMIT=$FIX_COMMIT"
          echo "FINAL_MAIN=$FINAL_MAIN"
          echo "SPEC_COMMIT=$SPEC_COMMIT"
          echo "SKILL_BLOB=$SKILL_BLOB"
