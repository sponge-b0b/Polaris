name: ChatGPT refine terminal donor identity v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chatgpt-implement-ticket-terminal-donor-refine-v2.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Refine and propagate bounded fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          test "$(git rev-parse HEAD^)" = "a32ad2c2a597ab615dd18a19f2c830909a92b558"
          test "$(git rev-parse HEAD^:.agents/skills/implement-ticket/SKILL.md)" = "cdc8859b4f2a6ecb4ec6693d8461b752e0bbc48d"
          git fetch origin spec-357
          test "$(git rev-parse origin/spec-357)" = "88972ac5db1ada7e0365eb7ef891e914fb9d8e08"

          python - <<'PY'
          from pathlib import Path

          path = Path('.agents/skills/implement-ticket/SKILL.md')
          text = path.read_text()

          old3 = """3. the protected caller checkout is on the declared shared branch and its current `HEAD` exactly equals the candidate record's recorded **Reslice branch anchor**; this exact equality is the durable identity that distinguishes the intentionally preserved donor checkout from arbitrary dirty local work;
          """
          new3 = """3. the protected caller checkout is on the declared shared branch and its current `HEAD` either exactly equals the candidate record's recorded **Reslice branch anchor** **or** is a descendant reached solely through commits proven workflow-policy-only or otherwise semantically independent of product/ticket/reslice ownership. Inspect the complete anchor-to-caller commit/path delta; any product, ticket-contract, architecture, or recovery-identity change makes the advancement ineligible. This bounded policy-only ancestry is the durable caller identity; do not infer identity from branch name or dirtiness alone;
          """
          old6 = """6. require complete/untruncated native hierarchy/dependency data. Any contradictory identity, missing completion evidence, non-ancestor completion commit, nonterminal sibling recovery record for the same donor identity, or caller-HEAD mismatch disables this mode and fails closed rather than treating the checkout as protected residual state.
          """
          new6 = """6. require complete/untruncated native hierarchy/dependency data. Any contradictory identity, missing completion evidence, non-ancestor completion commit, nonterminal sibling recovery record for the same donor identity, or caller `HEAD` that is neither the exact anchor nor an admissible policy-only descendant disables this mode and fails closed rather than treating the checkout as protected residual state.
          """

          if text.count(old3) != 1 or text.count(old6) != 1:
              raise SystemExit('unexpected terminal residual identity text')

          path.write_text(text.replace(old3, new3, 1).replace(old6, new6, 1))
          PY

          git diff --check
          test "$(git diff --name-only)" = ".agents/skills/implement-ticket/SKILL.md"
          git add .agents/skills/implement-ticket/SKILL.md
          git commit -m "fix(workflow): admit policy-only donor ancestry"
          FIX_COMMIT=$(git rev-parse HEAD)
          SKILL_BLOB=$(git rev-parse HEAD:.agents/skills/implement-ticket/SKILL.md)
          git push origin HEAD:main

          TMP=$(mktemp -d)
          git worktree add --detach "$TMP" 88972ac5db1ada7e0365eb7ef891e914fb9d8e08
          git -C "$TMP" config user.name "github-actions[bot]"
          git -C "$TMP" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show "$FIX_COMMIT:.agents/skills/implement-ticket/SKILL.md" > "$TMP/.agents/skills/implement-ticket/SKILL.md"
          test "$(git -C "$TMP" diff --name-only)" = ".agents/skills/implement-ticket/SKILL.md"
          test "$(git -C "$TMP" hash-object .agents/skills/implement-ticket/SKILL.md)" = "$SKILL_BLOB"
          git -C "$TMP" add .agents/skills/implement-ticket/SKILL.md
          git -C "$TMP" commit -m "fix(workflow): propagate terminal donor ancestry refinement"
          git -C "$TMP" push origin HEAD:spec-357
          git fetch origin spec-357
          test "$(git rev-parse origin/spec-357:.agents/skills/implement-ticket/SKILL.md)" = "$SKILL_BLOB"
          git worktree remove "$TMP"

          git rm .github/workflows/chatgpt-implement-ticket-terminal-donor-refine-v2.yml
          git commit -m "chore: remove terminal-donor refine transport"
          git push origin HEAD:main

          echo "FIX_COMMIT=$FIX_COMMIT"
          echo "SKILL_BLOB=$SKILL_BLOB"
