name: ChatGPT fix implement-ticket terminal donor residual

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chatgpt-implement-ticket-terminal-donor-residual.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Apply and propagate bounded fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          test "$(git rev-parse HEAD^)" = "1800cd914e50abaaaeff689527a753001cc5c3b5"
          test "$(git rev-parse HEAD^:.agents/skills/implement-ticket/SKILL.md)" = "dfc334f4acdbeba7dc44fde475845339217928bd"
          git fetch origin spec-357
          test "$(git rev-parse origin/spec-357)" = "078e242be40a8db29ccaa37b04226d443f970753"

          echo '' | base64 -d > /tmp/patch-implement-ticket.py
          python /tmp/patch-implement-ticket.py

          git diff --check
          test "$(git diff --name-only)" = ".agents/skills/implement-ticket/SKILL.md"
          git add .agents/skills/implement-ticket/SKILL.md
          git commit -m "fix(workflow): isolate terminal protected donors"
          FIX_COMMIT=$(git rev-parse HEAD)
          SKILL_BLOB=$(git rev-parse HEAD:.agents/skills/implement-ticket/SKILL.md)
          git push origin HEAD:main

          TMP=$(mktemp -d)
          git worktree add --detach "$TMP" 078e242be40a8db29ccaa37b04226d443f970753
          git -C "$TMP" config user.name "github-actions[bot]"
          git -C "$TMP" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show "$FIX_COMMIT:.agents/skills/implement-ticket/SKILL.md" > "$TMP/.agents/skills/implement-ticket/SKILL.md"
          test "$(git -C "$TMP" diff --name-only)" = ".agents/skills/implement-ticket/SKILL.md"
          test "$(git -C "$TMP" hash-object .agents/skills/implement-ticket/SKILL.md)" = "$SKILL_BLOB"
          git -C "$TMP" add .agents/skills/implement-ticket/SKILL.md
          git -C "$TMP" commit -m "fix(workflow): propagate terminal donor residual isolation"
          git -C "$TMP" push origin HEAD:spec-357
          git fetch origin spec-357
          test "$(git rev-parse origin/spec-357:.agents/skills/implement-ticket/SKILL.md)" = "$SKILL_BLOB"
          git worktree remove "$TMP"

          git rm .github/workflows/chatgpt-implement-ticket-terminal-donor-residual.yml
          git commit -m "chore: remove implement-ticket terminal-donor transport"
          git push origin HEAD:main

          echo "FIX_COMMIT=$FIX_COMMIT"
          echo "SKILL_BLOB=$SKILL_BLOB"
