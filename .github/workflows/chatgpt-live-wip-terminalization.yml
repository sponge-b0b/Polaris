name: ChatGPT live-WIP terminalization hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chatgpt-live-wip-terminalization.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch canonical implement-ticket skill
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "92b47efa399e99a2943eab3d194195970a0b1e44"
          test "$(git hash-object .agents/skills/implement-ticket/SKILL.md)" = "ccd9a4725d77eb3dee3bab9d29937ff04ca6a7c1"
          python - <<'PY'
          from pathlib import Path

          path = Path('.agents/skills/implement-ticket/SKILL.md')
          text = path.read_text()

          anchor = """This invariant applies equally to one-to-one and one-to-many reslices and does not depend on ticket numbers, file layout, or which side of the reslice happens to execute first.\n\n#### Destination live-WIP recovery\n"""
          replacement = """This invariant applies equally to one-to-one and one-to-many reslices and does not depend on ticket numbers, file layout, or which side of the reslice happens to execute first.\n\n#### Order-independent recovery terminalization\n\nRecovery completion is monotonic and **closure-order independent**. A valid recovery record has exactly one terminal status: `source-reconciled`. Terminal state means both the Source and Destination tickets are durably closed under their ordinary independently certified lifecycles, both exact pushed completion commits are recorded in the recovery record, and those commits are valid ancestors of the shared branch state used for terminal readback.\n\n`pending-prerequisite` and `prerequisite-complete` are nonterminal:\n\n* `pending-prerequisite` means the destination has not yet completed; the source may still be open or may already be closed;\n* `prerequisite-complete` means the destination completed first and the source has not yet been durably reconciled into the record;\n* `source-reconciled` means both participants completed and the reslice record is terminal.\n\nWhichever participant closes **second** owns terminalization of that recovery record in the same closure invocation. No source-first or destination-first ordering may require a later invocation of a ticket that is already closed merely to advance recovery metadata.\n\nWhen the source closes first, keep a still-pending destination at `Status: pending-prerequisite` but add `Source completion commit: <certified pushed SHA>`. When the destination closes first, write `Status: prerequisite-complete` plus its destination baseline/completion commit. When either participant later observes that the counterpart is already durably complete, require exact counterpart completion evidence and transition directly to `Status: source-reconciled` with **both** completion commits recorded.\n\nCounterpart completion evidence must be fail-closed: require the counterpart issue to be closed, its independently certified closure state to remain valid, its exact pushed completion commit to be recoverable without guesswork, and that commit to be an ancestor of the current frozen shared-branch tip. A missing, contradictory, stale, or non-ancestor completion identity is a Hard Blocker; do not infer a commit from recency, branch position, issue number, or local WIP.\n\nA pre-existing nonterminal recovery record created before this invariant may omit the already-closed source's completion field. On the first later participant closure that can prove the exact certified source completion commit from durable closure evidence, backfill that field and terminalize normally. Do not rewrite any other recovery identity or lineage field.\n\n`source-reconciled` is idempotent terminal state. Re-entry must validate the same source/destination completion commits and lineage; it must never silently replace either completion identity. Reaching terminal state authorizes **retirement evaluation only**. Never automatically delete/reset/clean the protected caller checkout. Retirement still requires every recovery record that depends on that donor checkout to be terminal plus exact proof that no unique owner-local state remains.\n\n#### Destination live-WIP recovery\n"""
          if text.count(anchor) != 1:
              raise SystemExit('protected-donor insertion anchor missing or duplicated')
          text = text.replace(anchor, replacement, 1)

          old_destination = """After the destination ticket is independently certified, committed, pushed to the shared branch, read back at the exact pushed commit, and closed under the ordinary lifecycle, update the same recovery record to:\n\n```text\nStatus: prerequisite-complete\nDestination baseline: <ticket baseline SHA>\nDestination completion commit: <certified pushed SHA>\n```\n\nPreserve all original source/destination/branch/reslice fields.\n"""
          new_destination = """After the destination ticket is independently certified, committed, pushed to the shared branch, read back at the exact pushed commit, and closed under the ordinary lifecycle, reconcile the same recovery record under **Order-independent recovery terminalization**:\n\n* always record `Destination baseline: <ticket baseline SHA>` and `Destination completion commit: <certified pushed SHA>`;\n* if the source ticket is still open, write `Status: prerequisite-complete` and preserve any already-recorded source completion field exactly;\n* if the source ticket is already closed, require or recover its exact certified pushed completion commit under the fail-closed counterpart-evidence rule above, require that commit to be an ancestor of the frozen shared-branch tip, record `Source completion commit: <certified pushed SHA>`, and write `Status: source-reconciled` in this same destination-closure invocation;\n* if the record is already `source-reconciled`, require exact equality of source/destination completion identities and treat the transition as idempotent.\n\nPreserve all original source/destination/branch/reslice fields and read the updated recovery record back exactly. A closed source plus a completed destination must never be left at `prerequisite-complete`.\n"""
          if text.count(old_destination) != 1:
              raise SystemExit('destination terminalization block missing or duplicated')
          text = text.replace(old_destination, new_destination, 1)

          old_source = """After source closure:\n\n* update each associated recovery record already at `Status: prerequisite-complete` to `Status: source-reconciled` with the certified source completion commit;\n* leave each `Status: pending-prerequisite` record unchanged so its destination's isolated-worktree recovery remains activated when that destination later becomes actionable;\n* do not automatically delete/reset/clean or retire the protected caller checkout while any associated recovery record remains nonterminal or while exact proof of no unique owner-local state is absent.\n"""
          new_source = """After source closure, reconcile every associated recovery record under **Order-independent recovery terminalization**:\n\n* record `Source completion commit: <certified pushed SHA>` on every associated nonterminal record, including a `pending-prerequisite` record whose destination executes later;\n* for each record already at `Status: prerequisite-complete`, require the recorded destination completion commit to remain valid and an ancestor of the frozen shared-branch tip, then transition it to `Status: source-reconciled` in this same source-closure invocation;\n* for each record still at `Status: pending-prerequisite`, keep that status so destination isolated-worktree recovery remains activated, but preserve the newly recorded source completion commit so the later destination can terminalize without another source invocation;\n* if any associated record is already `source-reconciled`, require exact equality of the recorded source completion commit and existing destination completion identity and treat it as idempotent;\n* do not automatically delete/reset/clean or retire the protected caller checkout while any associated recovery record remains nonterminal or while exact proof of no unique owner-local state is absent.\n\nThe second-closing participant always owns the `source-reconciled` transition; closure ordering must never strand a completed pair in `prerequisite-complete`.\n"""
          if text.count(old_source) != 1:
              raise SystemExit('source terminalization block missing or duplicated')
          text = text.replace(old_source, new_source, 1)

          inserted = text[text.index('#### Order-independent recovery terminalization'):text.index('#### Ordinary baseline path')]
          for forbidden in ('#378', '#386', '#387'):
              if forbidden in inserted:
                  raise SystemExit(f'ticket-specific hardening leaked into invariant: {forbidden}')

          path.write_text(text)
          PY

          git diff --check
          grep -q '^#### Order-independent recovery terminalization$' .agents/skills/implement-ticket/SKILL.md
          grep -q 'The second-closing participant always owns' .agents/skills/implement-ticket/SKILL.md
          cp .agents/skills/implement-ticket/SKILL.md /tmp/implement-ticket-SKILL.md

      - name: Persist canonical skill and remove transport workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Bob Taylor"
          git config user.email "bobltaylorjr@gmail.com"
          git rm .github/workflows/chatgpt-live-wip-terminalization.yml
          git add .agents/skills/implement-ticket/SKILL.md
          git diff --cached --check
          git commit -m "fix(workflow): terminalize live-WIP reslices"
          MAIN_FINAL=$(git rev-parse HEAD)
          SKILL_BLOB=$(git rev-parse HEAD:.agents/skills/implement-ticket/SKILL.md)
          git push origin HEAD:main
          printf 'main_final=%s\nskill_blob=%s\n' "$MAIN_FINAL" "$SKILL_BLOB"

      - name: Propagate exact canonical skill to spec-357
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin spec-357
          test "$(git rev-parse origin/spec-357)" = "e9f7c1156c85e1880617dc69ed9ca15885f2cd64"
          git worktree add --detach /tmp/polaris-spec-357 origin/spec-357
          test "$(git -C /tmp/polaris-spec-357 hash-object .agents/skills/implement-ticket/SKILL.md)" = "ccd9a4725d77eb3dee3bab9d29937ff04ca6a7c1"
          cp /tmp/implement-ticket-SKILL.md /tmp/polaris-spec-357/.agents/skills/implement-ticket/SKILL.md
          git -C /tmp/polaris-spec-357 config user.name "Bob Taylor"
          git -C /tmp/polaris-spec-357 config user.email "bobltaylorjr@gmail.com"
          git -C /tmp/polaris-spec-357 add .agents/skills/implement-ticket/SKILL.md
          git -C /tmp/polaris-spec-357 diff --cached --check
          git -C /tmp/polaris-spec-357 commit -m "fix(workflow): terminalize live-WIP reslices"
          SPEC_FINAL=$(git -C /tmp/polaris-spec-357 rev-parse HEAD)
          SPEC_SKILL_BLOB=$(git -C /tmp/polaris-spec-357 rev-parse HEAD:.agents/skills/implement-ticket/SKILL.md)
          MAIN_SKILL_BLOB=$(git rev-parse HEAD:.agents/skills/implement-ticket/SKILL.md)
          test "$SPEC_SKILL_BLOB" = "$MAIN_SKILL_BLOB"
          git -C /tmp/polaris-spec-357 push origin HEAD:spec-357
          printf 'spec_final=%s\nspec_skill_blob=%s\n' "$SPEC_FINAL" "$SPEC_SKILL_BLOB"
