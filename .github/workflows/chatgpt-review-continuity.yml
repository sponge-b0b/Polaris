name: chatgpt-review-continuity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chatgpt-review-continuity.yml

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore(workflow): arm review continuity hardening' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply review continuity hardening
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/tmp/review_continuity_patch.b64 | gzip -d > /tmp/review_continuity_patch.py
          python -m py_compile /tmp/review_continuity_patch.py
          python /tmp/review_continuity_patch.py

      - name: Validate review continuity hardening
        shell: bash
        run: |
          set -euo pipefail
          python .agents/skills/review-spec/scripts/review_spec_artifacts.py self-test
          git diff --check
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            '.agents/skills/README.md' \
            '.agents/skills/review-spec-remediation/SKILL.md' \
            '.agents/skills/review-spec/SKILL.md' \
            '.agents/skills/review-spec/scripts/review_spec_artifacts.py' \
            '.agents/skills/spec-merge-cleanup/SKILL.md' \
            'docs/process/common-sense-invariant-hardening.md' | sort)
          test "$actual" = "$expected"

      - name: Commit canonical hardening and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Bob Taylor'
          git config user.email 'bobltaylorjr@gmail.com'
          git rm .github/tmp/review_continuity_patch.b64
          git rm .github/workflows/chatgpt-review-continuity.yml
          git add -A
          actual=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' \
            '.agents/skills/README.md' \
            '.agents/skills/review-spec-remediation/SKILL.md' \
            '.agents/skills/review-spec/SKILL.md' \
            '.agents/skills/review-spec/scripts/review_spec_artifacts.py' \
            '.agents/skills/spec-merge-cleanup/SKILL.md' \
            '.github/tmp/review_continuity_patch.b64' \
            '.github/workflows/chatgpt-review-continuity.yml' \
            'docs/process/common-sense-invariant-hardening.md' | sort)
          test "$actual" = "$expected"
          git commit -m 'fix(workflow): preserve review finding continuity'
          git push origin main
