name: ChatGPT session authorization continuity edit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/chatgpt-session-auth-continuity.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply deterministic edit
        run: python .github/scripts/chatgpt_session_auth_continuity.py
