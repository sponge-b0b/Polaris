name: ChatGPT session reconstitution edit transport

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  edit:
    if: github.event.head_commit.message == 'chore(process): arm verifier-session continuity edit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Apply bounded process edit
        run: python .chatgpt/tmp-session-reconstitution-edit.py

      - name: Remove failed recovery probe branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/chatgpt/recover-dd2-verifier-session" || true
