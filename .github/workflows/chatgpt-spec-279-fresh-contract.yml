name: ChatGPT fresh Spec 279 contract builder

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: read
  copilot-requests: write

jobs:
  build-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec-279
          fetch-depth: 0

      - name: Pin exact candidate
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "spec-279"
          test "$(git rev-parse HEAD)" = "4baa54445e0bcd9f19bb75277a9abc84bea3008c"
          test -z "$(git status --porcelain)"

      - name: Prepare isolated builder inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUILD_ROOT="$RUNNER_TEMP/spec-contract-279-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CONTRACT_HANDOFF="$RUNNER_TEMP/spec-279-contract.json"
          SPEC_BODY="$BUILD_ROOT/spec-body.md"
          SOURCE_UNITS="$BUILD_ROOT/source-units.json"
          MODEL_OUTPUT="$BUILD_ROOT/model-output.json"

          test ! -e "$BUILD_ROOT"
          test ! -e "$CONTRACT_HANDOFF"
          mkdir -p "$BUILD_ROOT"

          printf 'BUILD_ROOT=%s\n' "$BUILD_ROOT" >> "$GITHUB_ENV"
          printf 'CONTRACT_HANDOFF=%s\n' "$CONTRACT_HANDOFF" >> "$GITHUB_ENV"
          printf 'SPEC_BODY=%s\n' "$SPEC_BODY" >> "$GITHUB_ENV"
          printf 'SOURCE_UNITS=%s\n' "$SOURCE_UNITS" >> "$GITHUB_ENV"
          printf 'MODEL_OUTPUT=%s\n' "$MODEL_OUTPUT" >> "$GITHUB_ENV"

          # Read only the current Spec body. Do not read issue comments or prior receipts.
          gh issue view 279 --repo sponge-b0b/Polaris --json body --jq .body > "$SPEC_BODY"

          python - "$SPEC_BODY" "$SOURCE_UNITS" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          body_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          text = body_path.read_text(encoding="utf-8")
          lines = text.splitlines()

          units: list[dict[str, object]] = []
          section = "(preamble)"
          paragraph: list[str] = []
          section_kind_counts: dict[tuple[str, str], int] = {}
          out_of_scope_index = 0

          def normalize(value: str) -> str:
              value = value.replace("\r\n", "\n").replace("\r", "\n")
              return "\n".join(part.rstrip() for part in value.split("\n")).rstrip()

          def next_kind_index(kind: str) -> int:
              key = (section, kind)
              section_kind_counts[key] = section_kind_counts.get(key, 0) + 1
              return section_kind_counts[key]

          def source_identity(kind: str, body: str) -> str:
              nonlocal_out = None
              numbered = re.match(r"^\s*(\d+)\.\s+", body)
              if section in {"User Stories", "Implementation Decisions", "Testing Decisions"} and numbered:
                  return f"{section} {int(numbered.group(1))}"
              if section == "Out of Scope" and kind == "list-item":
                  # The caller assigns the final numbered identity after append.
                  nonlocal_out = "OUT_OF_SCOPE"
              if nonlocal_out:
                  return nonlocal_out
              return f"{section} {kind} {next_kind_index(kind)}"

          def add(kind: str, raw: str) -> None:
              nonlocal out_of_scope_index
              body = normalize(raw)
              if not body:
                  return
              source = source_identity(kind, body)
              if source == "OUT_OF_SCOPE":
                  out_of_scope_index += 1
                  source = f"Out of Scope {out_of_scope_index}"
              units.append(
                  {
                      "source_unit": f"SU-{len(units) + 1:04d}",
                      "source": source,
                      "section": section,
                      "kind": kind,
                      "text_hash": hashlib.sha256(body.encode("utf-8")).hexdigest(),
                      "text": body,
                  }
              )

          def flush_paragraph() -> None:
              if paragraph:
                  add("paragraph", "\n".join(paragraph))
                  paragraph.clear()

          i = 0
          while i < len(lines):
              line = lines[i]
              stripped = line.strip()

              heading = re.match(r"^#{1,6}\s+", stripped)
              if heading:
                  flush_paragraph()
                  section = re.sub(r"^#{1,6}\s+", "", stripped)
                  i += 1
                  continue

              if stripped.startswith("```"):
                  flush_paragraph()
                  block = [line]
                  i += 1
                  while i < len(lines):
                      block.append(lines[i])
                      if lines[i].strip().startswith("```"):
                          i += 1
                          break
                      i += 1
                  add("code", "\n".join(block))
                  continue

              if not stripped:
                  flush_paragraph()
                  i += 1
                  continue

              if stripped.startswith(">"):
                  flush_paragraph()
                  block = [line]
                  i += 1
                  while i < len(lines) and lines[i].strip().startswith(">"):
                      block.append(lines[i])
                      i += 1
                  add("blockquote", "\n".join(block))
                  continue

              if re.match(r"^\s*(?:[-*+]\s+|\d+\.\s+)", line):
                  flush_paragraph()
                  item = [line]
                  i += 1
                  while i < len(lines):
                      nxt = lines[i]
                      if not nxt.strip():
                          break
                      if re.match(r"^\s*(?:[-*+]\s+|\d+\.\s+)", nxt):
                          break
                      if re.match(r"^#{1,6}\s+", nxt.strip()):
                          break
                      if nxt.startswith("  ") or nxt.startswith("\t"):
                          item.append(nxt)
                          i += 1
                          continue
                      break
                  add("list-item", "\n".join(item))
                  continue

              if stripped.startswith("|") and stripped.endswith("|"):
                  flush_paragraph()
                  if not re.fullmatch(r"\|?[\s:|-]+\|?", stripped):
                      add("table-row", line)
                  i += 1
                  continue

              if stripped.startswith("<") and stripped.endswith(">"):
                  flush_paragraph()
                  add("html", line)
                  i += 1
                  continue

              paragraph.append(line)
              i += 1

          flush_paragraph()
          output_path.write_text(
              json.dumps(units, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          print(f"Fresh source units: {len(units)}")
          PY

      - name: Install current Copilot CLI
        run: npm install --global @github/copilot

      - name: Fresh semantic contract classification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AUTO_UPDATE: "false"
          COPILOT_MCP_TOOL_CACHE: "false"
          COPILOT_MODEL: gpt-5.4
        run: |
          set -euo pipefail
          COPILOT_HOME="$BUILD_ROOT/copilot-home"
          export COPILOT_HOME
          mkdir -p "$COPILOT_HOME"

          PROMPT=$(cat <<'EOF'
          You are the genuinely fresh, non-mutating semantic classifier inside a Polaris `$spec-contract` build for Spec #279.

          This invocation is intentionally isolated. You have not been given and must not infer or seek any prior Spec Contract hash, prior manifest, prior source-unit classification, prior receipt, prior proof-reuse state, prior handoff, prior conversation, or scratch contract artifact. Do not use memory. Do not access the network, GitHub issue comments, old receipts, Git history as a contract source, or any state outside the four attached authoritative/current inputs.

          Exact build identity:
          - Spec: #279, Implement Investment Decision application lifecycle and Decision Memory queries
          - Baseline: 4daed9034891600597a47c01b6c39d5ebd9914ca
          - Branch: spec-279
          - HEAD: 4baa54445e0bcd9f19bb75277a9abc84bea3008c
          - Mode: build

          Attached inputs:
          1. current root AGENTS.md;
          2. current `.agents/skills/spec-contract/SKILL.md`;
          3. the current Spec #279 body fetched in this fresh job;
          4. a deterministic, unclassified Source Unit Inventory derived in this fresh job from that body. It contains only source identity, source text, and source text hash. It contains NO semantic classification and NO source-to-cell mapping.

          Follow the attached `$spec-contract` contract exactly for semantic classification and manifest construction. The surrounding fresh builder process will perform deterministic validation, V2 hashing, change-provenance calculation, handoff serialization, and handoff digest calculation after your semantic result returns. You own all semantic judgments: `normative-new`, `normative-represented`, `non-normative`, source-to-cell mapping, whether additional `NORM-*` obligations exist, and faithful human-readable manifest requirements.

          Required result schema — output EXACTLY one JSON object and nothing else:
          {
            "inventory": [
              {
                "source_unit": "SU-0001",
                "classification": "normative-new | normative-represented | non-normative",
                "manifest_cells": ["US-1"] or null,
                "reason": "concise reason" or null
              }
            ],
            "manifest": [
              {
                "cell": "US-1",
                "source": "exact deterministic source identity from the attached inventory",
                "requirement": "concise faithful normative obligation",
                "named_surfaces": "explicit named surface when present" or null
              }
            ]
          }

          Semantic requirements:
          - Return one inventory row for EVERY attached SU-* row, in the same order. Omission is invalid.
          - Every numbered User Story must create/map its stable `US-<n>` cell.
          - Every Implementation Decision item must create/map its stable `ID-<n>` cell.
          - Every Testing Decision item must create/map its stable `TD-<n>` cell.
          - Every Out of Scope item must create/map its stable `OOS-<n>` cell.
          - Materially unique normative obligations elsewhere use stable document-order `NORM-<n>` cells only when they are not already fully represented by US/ID/TD/OOS cells.
          - A source unit containing normative meaning already fully represented elsewhere is `normative-represented`, maps every cell that fully represents it, and has a concise equivalence/reference reason.
          - A `non-normative` source unit has `manifest_cells: null` and a concise reason.
          - A mixed explanatory+normative unit is normative.
          - Do not create obligations from ADRs, architecture documents, implementation, tests, or prior history; the originating Spec is the manifest universe.
          - Do not collapse distinct positive and negative obligations.
          - Preserve MUST/MUST NOT/ONLY/CANNOT/fail-closed semantics in requirement prose where the source establishes them.
          - `source` for each manifest row must use the deterministic source identity from the attached Source Unit Inventory, not a new semantic label.
          - Keep reasons and requirements concise so the complete 143-unit result fits comfortably in one response.

          Before emitting JSON, internally check: every source unit classified; every normative unit mapped; every non-normative unit reasoned; every manifest cell has at least one originating source unit; no missing canonical numbered source item; no duplicate cell; no ambiguous mapping. Do not emit prose, Markdown fences, a hash, expected counts, or any comparison with historical state.
          EOF
          )

          copilot -sp "$PROMPT" \
            --model gpt-5.4 \
            --effort high \
            --no-custom-instructions \
            --disable-builtin-mcps \
            --deny-tool='shell,write,url,memory' \
            --no-ask-user \
            --attachment AGENTS.md \
            --attachment .agents/skills/spec-contract/SKILL.md \
            --attachment "$SPEC_BODY" \
            --attachment "$SOURCE_UNITS" \
            > "$MODEL_OUTPUT"

          python -m json.tool "$MODEL_OUTPUT" >/dev/null
          echo "Fresh semantic classifier returned parseable JSON."

      - name: Resolve change provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python .agents/skills/spec-contract/scripts/classify_ownership.py \
            --baseline 4daed9034891600597a47c01b6c39d5ebd9914ca \
            --branch spec-279 \
            --head 4baa54445e0bcd9f19bb75277a9abc84bea3008c \
            > "$BUILD_ROOT/provenance.json"

      - name: Validate and serialize canonical V2 handoff
        run: |
          set -euo pipefail
          python - "$SPEC_BODY" "$SOURCE_UNITS" "$MODEL_OUTPUT" "$BUILD_ROOT/provenance.json" "$CONTRACT_HANDOFF" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          spec_body_path = Path(sys.argv[1])
          source_units_path = Path(sys.argv[2])
          model_output_path = Path(sys.argv[3])
          provenance_path = Path(sys.argv[4])
          handoff_path = Path(sys.argv[5])

          if handoff_path.exists():
              raise SystemExit("SPEC CONTRACT: INVALID\nReason: handoff path existed before build")

          units = json.loads(source_units_path.read_text(encoding="utf-8"))
          semantic = json.loads(model_output_path.read_text(encoding="utf-8"))
          provenance = json.loads(provenance_path.read_text(encoding="utf-8"))

          if set(semantic) != {"inventory", "manifest"}:
              raise SystemExit("SPEC CONTRACT: INVALID\nReason: semantic result schema mismatch")
          inventory = semantic["inventory"]
          manifest = semantic["manifest"]
          if not isinstance(inventory, list) or not isinstance(manifest, list):
              raise SystemExit("SPEC CONTRACT: INVALID\nReason: inventory/manifest must be arrays")

          expected_ids = [row["source_unit"] for row in units]
          unit_by_id = {row["source_unit"]: row for row in units}
          if [row.get("source_unit") for row in inventory] != expected_ids:
              raise SystemExit("SPEC CONTRACT: INVALID\nReason: semantic inventory does not exactly cover ordered source units")

          family_rank = {"US": 0, "ID": 1, "TD": 2, "OOS": 3, "NORM": 4}
          cell_pattern = re.compile(r"^(US|ID|TD|OOS|NORM)-(\d+)(?:\.(.+))?$")

          def cell_key(cell: str) -> tuple[int, int, int, str]:
              match = cell_pattern.fullmatch(cell)
              if not match or int(match.group(2)) <= 0:
                  raise ValueError(f"invalid cell ID: {cell}")
              suffix = match.group(3)
              return (
                  family_rank[match.group(1)],
                  int(match.group(2)),
                  0 if suffix is None else 1,
                  "" if suffix is None else suffix,
              )

          manifest_by_cell: dict[str, dict[str, object]] = {}
          for row in manifest:
              if not isinstance(row, dict) or set(row) != {"cell", "source", "requirement", "named_surfaces"}:
                  raise SystemExit("SPEC CONTRACT: INVALID\nReason: manifest row schema mismatch")
              cell = row["cell"]
              if not isinstance(cell, str):
                  raise SystemExit("SPEC CONTRACT: INVALID\nReason: manifest cell must be a string")
              try:
                  cell_key(cell)
              except ValueError as exc:
                  raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: {exc}") from exc
              if cell in manifest_by_cell:
                  raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: duplicate manifest cell {cell}")
              if not isinstance(row["source"], str) or not row["source"].strip():
                  raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: empty source for {cell}")
              if not isinstance(row["requirement"], str) or not row["requirement"].strip():
                  raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: empty requirement for {cell}")
              if row["named_surfaces"] is not None and not isinstance(row["named_surfaces"], str):
                  raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: invalid named_surfaces for {cell}")
              manifest_by_cell[cell] = row

          classifications = {"normative-new", "normative-represented", "non-normative"}
          normalized_inventory: list[dict[str, object]] = []
          origins_by_cell: dict[str, list[str]] = {cell: [] for cell in manifest_by_cell}
          new_origins_by_cell: dict[str, list[str]] = {cell: [] for cell in manifest_by_cell}

          for row in inventory:
              if not isinstance(row, dict) or set(row) != {"source_unit", "classification", "manifest_cells", "reason"}:
                  raise SystemExit("SPEC CONTRACT: INVALID\nReason: inventory row schema mismatch")
              source_unit = row["source_unit"]
              classification = row["classification"]
              cells = row["manifest_cells"]
              reason = row["reason"]
              if classification not in classifications:
                  raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: invalid classification for {source_unit}")
              if classification == "non-normative":
                  if cells not in (None, []):
                      raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: non-normative {source_unit} has manifest mapping")
                  if not isinstance(reason, str) or not reason.strip():
                      raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: non-normative {source_unit} lacks reason")
                  normalized_cells = None
              else:
                  if not isinstance(cells, list) or not cells or any(not isinstance(cell, str) for cell in cells):
                      raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: normative {source_unit} lacks manifest mapping")
                  if len(set(cells)) != len(cells):
                      raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: duplicate mapping in {source_unit}")
                  try:
                      normalized_cells = sorted(cells, key=cell_key)
                  except ValueError as exc:
                      raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: {exc}") from exc
                  missing = [cell for cell in normalized_cells if cell not in manifest_by_cell]
                  if missing:
                      raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: {source_unit} maps missing cells {missing}")
                  if classification == "normative-represented" and (not isinstance(reason, str) or not reason.strip()):
                      raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: represented {source_unit} lacks equivalence reason")
                  for cell in normalized_cells:
                      origins_by_cell[cell].append(source_unit)
                      if classification == "normative-new":
                          new_origins_by_cell[cell].append(source_unit)

              normalized_inventory.append(
                  {
                      "source_unit": source_unit,
                      "classification": classification,
                      "manifest_cells": normalized_cells,
                      "reason": reason,
                  }
              )

          for cell, origins in origins_by_cell.items():
              if not origins:
                  raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: manifest cell {cell} has no source unit")
              if not new_origins_by_cell[cell]:
                  raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: manifest cell {cell} has no normative-new origin")

          canonical_sections = {
              "User Stories": "US",
              "Implementation Decisions": "ID",
              "Testing Decisions": "TD",
              "Out of Scope": "OOS",
          }
          canonical_counts: dict[str, int] = {prefix: 0 for prefix in canonical_sections.values()}
          canonical_unit_ids: set[str] = set()

          for unit, inv in zip(units, normalized_inventory, strict=True):
              section = unit["section"]
              if section not in canonical_sections:
                  continue
              prefix = canonical_sections[section]
              source = unit["source"]
              match = re.fullmatch(rf"{re.escape(section)} (\d+)", source)
              if not match:
                  raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: malformed canonical source identity {source}")
              number = int(match.group(1))
              canonical_counts[prefix] += 1
              canonical_unit_ids.add(unit["source_unit"])
              cell = f"{prefix}-{number}"
              if inv["classification"] != "normative-new":
                  raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: canonical source {source} is not normative-new")
              if cell not in (inv["manifest_cells"] or []):
                  raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: canonical source {source} does not map {cell}")
              if cell not in manifest_by_cell:
                  raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: canonical cell {cell} missing")
              if manifest_by_cell[cell]["source"] != source:
                  raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: canonical manifest source mismatch for {cell}")

          for prefix, count in canonical_counts.items():
              base_cells = {
                  cell for cell in manifest_by_cell
                  if re.fullmatch(rf"{prefix}-\d+", cell)
              }
              expected = {f"{prefix}-{number}" for number in range(1, count + 1)}
              if base_cells != expected:
                  raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: {prefix} source coverage mismatch")

          for inv in normalized_inventory:
              if inv["source_unit"] in canonical_unit_ids:
                  continue
              if inv["classification"] == "normative-new":
                  cells = inv["manifest_cells"] or []
                  if any(not cell.startswith("NORM-") for cell in cells):
                      raise SystemExit(
                          f"SPEC CONTRACT: INVALID\nReason: non-canonical normative-new {inv['source_unit']} must create NORM cells"
                      )

          sorted_cells = sorted(manifest_by_cell, key=cell_key)
          manifest_rows = [manifest_by_cell[cell] for cell in sorted_cells]

          identity_source_units = []
          for unit, inv in zip(units, normalized_inventory, strict=True):
              identity_source_units.append(
                  [
                      unit["source_unit"],
                      unit["text_hash"],
                      inv["classification"],
                      inv["manifest_cells"],
                  ]
              )

          identity_manifest = [
              [cell, origins_by_cell[cell]]
              for cell in sorted_cells
          ]

          spec_body_hash = hashlib.sha256(spec_body_path.read_bytes()).hexdigest()
          inventory_json_rows = [
              json.dumps(row, ensure_ascii=False, separators=(",", ":"))
              for row in identity_source_units
          ]
          manifest_json_rows = [
              json.dumps(row, ensure_ascii=False, separators=(",", ":"))
              for row in identity_manifest
          ]
          payload = (
              "SPEC-CONTRACT-V2\n"
              + spec_body_hash
              + "\n--SOURCE-UNITS--\n"
              + "\n".join(inventory_json_rows)
              + "\n--MANIFEST--\n"
              + "\n".join(manifest_json_rows)
              + "\n"
          )
          spec_contract_hash = hashlib.sha256(payload.encode("utf-8")).hexdigest()

          noncanonical_normative_new = sum(
              1
              for unit, inv in zip(units, normalized_inventory, strict=True)
              if unit["source_unit"] not in canonical_unit_ids
              and inv["classification"] == "normative-new"
          )

          source_counts = {
              "user_stories": canonical_counts["US"],
              "implementation_decisions": canonical_counts["ID"],
              "testing_decisions": canonical_counts["TD"],
              "out_of_scope": canonical_counts["OOS"],
              "other_normative": noncanonical_normative_new,
          }

          handoff = {
              "spec_issue": 279,
              "head": "4baa54445e0bcd9f19bb75277a9abc84bea3008c",
              "baseline": "4daed9034891600597a47c01b6c39d5ebd9914ca",
              "branch": "spec-279",
              "spec_body_hash": spec_body_hash,
              "spec_contract_hash": spec_contract_hash,
              "default_branch": provenance["default_branch"],
              "default_head": provenance["default_head"],
              "source_counts": source_counts,
              "manifest": [
                  {
                      "cell": row["cell"],
                      "source": row["source"],
                      "requirement": row["requirement"],
                  }
                  for row in manifest_rows
              ],
              "contract_identity": {
                  "source_units": identity_source_units,
                  "manifest": identity_manifest,
              },
          }

          handoff_bytes = json.dumps(
              handoff,
              ensure_ascii=False,
              separators=(",", ":"),
          ).encode("utf-8")
          handoff_path.write_bytes(handoff_bytes)
          handoff_digest = hashlib.sha256(handoff_bytes).hexdigest()

          classification_counts = {
              value: sum(1 for row in normalized_inventory if row["classification"] == value)
              for value in sorted({"normative-new", "normative-represented", "non-normative"})
          }

          print("SPEC CONTRACT: VALID")
          print("Spec: #279")
          print(f"Spec Body Hash: {spec_body_hash}")
          print(f"Spec Contract Hash: {spec_contract_hash}")
          print(f"Contract handoff digest: {handoff_digest}")
          print("Baseline: 4daed9034891600597a47c01b6c39d5ebd9914ca")
          print("Branch: spec-279")
          print("HEAD: 4baa54445e0bcd9f19bb75277a9abc84bea3008c")
          print(f"Default branch: {provenance['default_branch']}")
          print(f"Default branch ref: {provenance['default_head']}")
          print("Source unit integrity:")
          print(f"- Source units: {len(units)}")
          print(f"- Classified source units: {len(normalized_inventory)}")
          print(f"- Normative-new source units: {classification_counts['normative-new']}")
          print(f"- Normative-represented source units: {classification_counts['normative-represented']}")
          print(f"- Non-normative source units: {classification_counts['non-normative']}")
          print("- Unclassified source units: 0")
          print("- Normative source units without manifest mapping: 0")
          print("- Non-normative source units without reason: 0")
          print("Source counts:")
          print(f"- User Stories: {source_counts['user_stories']}")
          print(f"- Implementation Decisions: {source_counts['implementation_decisions']}")
          print(f"- Testing Decisions: {source_counts['testing_decisions']}")
          print(f"- Out of Scope: {source_counts['out_of_scope']}")
          print(f"- Other normative source items: {source_counts['other_normative']}")
          print(f"Manifest cells: {len(manifest_rows)}")
          print("Unmapped source items: 0")
          print("Duplicate source mappings: 0")
          print("Ambiguous source items: 0")
          print(f"Branch-local commits: {len(provenance['branch_local_commits'])}")
          print(f"Branch-local repository surfaces: {len(provenance['branch_local_surfaces'])}")
          print(f"Mixed-provenance repository surfaces: {len(provenance['mixed_provenance_surfaces'])}")
          print(f"Inherited-only integration surfaces: {len(provenance['inherited_only_surfaces'])}")
          print("Build isolation: PASS")
          print("Prior contract representations supplied or inspected: 0")
          print("Pre-existing scratch contract artifacts inspected: 0")
          print("Handoff path existed before build: no")
          print("Historical hash comparison performed before builder terminal result: no")
          print("Parent-side substitute contract construction: 0")
          PY

      - name: Candidate mutation guard
        run: |
          set -euo pipefail
