name: Ticket 335 candidate verification

on:
  push:
    branches: [chatgpt/ticket-335-candidate]
    paths: [".github/workflows/chatgpt-ticket-335-verify.yml"]

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: polaris
          POSTGRES_PASSWORD: polaris
          POSTGRES_DB: polaris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polaris -d polaris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POLARIS_TEST_DATABASE_URL: postgresql+asyncpg://polaris:polaris@127.0.0.1:5432/polaris_test
      UV_CACHE_DIR: /tmp/uv-cache
      TICKET_BASELINE: 852f74c6d6f6d92fcde677db8781d0a1ad87cda8
      CANDIDATE_COMMIT: b1a1fa018dbe6da6108b4d7b3ccbaf7f038a91fa
      EXPECTED_CANDIDATE_STATE: 8234987cc995817ec0629b170eeb4f44f7dc5f8f2d0dd14926cb8bfc73cc40ab
      TARGET: tests/integration/persistence/postgresql/test_r2_acceptance_renewal.py
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b1a1fa018dbe6da6108b4d7b3ccbaf7f038a91fa
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6

      - name: Install locked qualified environment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          python - <<'PY'
          import sys
          assert sys.version_info >= (3, 14)
          assert getattr(sys, "_is_gil_enabled", lambda: True)()
          print("qualified_python=PASS")
          PY
          uv sync --locked --python "$(which python)"

      - name: Targeted static preflight
        run: |
          set -euo pipefail
          test "$(git diff --name-only "$TICKET_BASELINE"...HEAD -- '*.py')" = "$TARGET"
          git diff --check "$TICKET_BASELINE"
          UV_PYTHON="$(which python)" uv run --locked ruff format --check "$TARGET"
          UV_PYTHON="$(which python)" uv run --locked ruff check "$TARGET"
          UV_PYTHON="$(which python)" uv run --locked mypy --explicit-package-bases "$TARGET"
          echo "ticket_335_static=PASS"

      - name: Candidate Arid
        run: |
          set +e
          UV_PYTHON="$(which python)" uv run --locked arid . --json > /tmp/arid-candidate.json
          status=$?
          set -e
          echo "arid_candidate_status=$status"
          cat /tmp/arid-candidate.json
          test "$status" -le 1

      - name: Baseline Arid
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/polaris-ticket-335-baseline "$TICKET_BASELINE"
          cd /tmp/polaris-ticket-335-baseline
          set +e
          UV_CACHE_DIR=/tmp/uv-cache UV_PYTHON="$(which python)" uv run --locked arid . --json > /tmp/arid-baseline.json
          status=$?
          set -e
          echo "arid_baseline_status=$status"
          cat /tmp/arid-baseline.json
          test "$status" -le 1

      - name: Arid differential and suppression health
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          candidate_suppression_status=0
          UV_PYTHON="$(which python)" uv run --locked arid . --fail-on-stale --suppression-summary > /tmp/arid-candidate-suppression.txt 2>&1 || candidate_suppression_status=$?

          baseline_suppression_status=0
          (
            cd /tmp/polaris-ticket-335-baseline
            UV_CACHE_DIR=/tmp/uv-cache UV_PYTHON="$(which python)" uv run --locked arid . --fail-on-stale --suppression-summary > /tmp/arid-baseline-suppression.txt 2>&1
          ) || baseline_suppression_status=$?

          cat /tmp/arid-candidate-suppression.txt
          cat /tmp/arid-baseline-suppression.txt
          echo "arid_candidate_suppression_status=$candidate_suppression_status"
          echo "arid_baseline_suppression_status=$baseline_suppression_status"

          test "$candidate_suppression_status" -le 1
          test "$baseline_suppression_status" -le 1
          test "$candidate_suppression_status" -eq "$baseline_suppression_status"
          cmp /tmp/arid-candidate-suppression.txt /tmp/arid-baseline-suppression.txt
          test -z "$(git diff --name-only "$TICKET_BASELINE"..."$CANDIDATE_COMMIT" -- pyproject.toml)"
          test -z "$(git diff --unified=0 "$TICKET_BASELINE"..."$CANDIDATE_COMMIT" -- "$TARGET" | grep -E '^[+-].*# (arid:|duplicate-code:)' || true)"

          echo "arid_candidate_introduced=0"
          echo "arid_candidate_expanded=0"
          echo "arid_candidate_attributable_stale_invalid_suppressions=0"
          echo "arid_operational_errors=0"
          echo "arid_ticket_differential=PASS"

      - name: PostgreSQL readiness preflight
        run: |
          set -euo pipefail
          UV_PYTHON="$(which python)" uv run --locked python - <<'PY'
          import asyncio
          import os
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main() -> None:
              engine = create_async_engine(os.environ["POLARIS_TEST_DATABASE_URL"])
              try:
                  async with engine.connect() as connection:
                      assert (await connection.execute(text("select 1"))).scalar_one() == 1
              finally:
                  await engine.dispose()

          asyncio.run(main())
          print("postgres_preflight=PASS")
          PY

      - name: Targeted renewal proof
        run: |
          set -euo pipefail
          UV_PYTHON="$(which python)" uv run --locked pytest -q             "$TARGET"             tests/application/decisions/test_relationships.py::test_renewal_creates_new_need_decision_and_supported_lineage_atomically             tests/integration/persistence/postgresql/test_relationship_store.py::test_renewal_persists_admission_evidence_and_survives_later_endpoint_change
          echo "ticket_335_targeted_postgres=PASS"

      - name: PostgreSQL runtime qualification
        run: |
          set -euo pipefail
          UV_PYTHON="$(which python)" uv run --locked pytest -q tests/runtime/test_postgresql_runtime_qualification.py
          echo "postgres_runtime_qualification=PASS"

      - name: Architecture service preflight
        run: |
          set -euo pipefail
          for path in tests/test_architecture_guard.py tests/test_architecture_guard_identity_aliases.py tests/test_architecture_guard_legacy_loaders.py; do
            test -f "$path"
            if grep -Eq 'postgres_target|POLARIS_TEST_DATABASE_URL|POLARIS_DATABASE_URL|import (httpx|requests|socket)|docker' "$path"; then
              echo "unexpected_external_service_prerequisite=$path"
              exit 1
            fi
          done
          echo "architecture_service_preflight=PASS"

      - name: Complete architecture suite
        run: |
          set -euo pipefail
          POLARIS_BROAD_VERIFY_AUTHORIZED=verify-architecture UV_PYTHON="$(which python)"             uv run --locked pytest -q             tests/test_architecture_guard.py             tests/test_architecture_guard_identity_aliases.py             tests/test_architecture_guard_legacy_loaders.py
          echo "architecture_invariant=PASS"

      - name: Install JSCPD
        run: npm install --global jscpd@4.0.5

      - name: Candidate JSCPD
        run: |
          set +e
          jscpd . --reporters json --output /tmp/jscpd-candidate
          status=$?
          set -e
          echo "jscpd_candidate_status=$status"
          test -f /tmp/jscpd-candidate/jscpd-report.json
          cat /tmp/jscpd-candidate/jscpd-report.json
          test "$status" -le 1

      - name: Baseline JSCPD
        run: |
          set +e
          cd /tmp/polaris-ticket-335-baseline
          jscpd . --reporters json --output /tmp/jscpd-baseline
          status=$?
          set -e
          echo "jscpd_baseline_status=$status"
          test -f /tmp/jscpd-baseline/jscpd-report.json
          cat /tmp/jscpd-baseline/jscpd-report.json
          test "$status" -le 1

      - name: JSCPD differential gate
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          jscpd . --reporters json --output /tmp/jscpd-candidate-final
          echo "jscpd_ticket_differential=PASS"

      - name: Compute candidate state
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          TICKET_CLOSURE_STATE=$(
            TICKET_BASELINE="$TICKET_BASELINE" python - <<'PY'
          import hashlib
          import os
          import stat
          import subprocess

          baseline = os.environ["TICKET_BASELINE"]

          def git_paths(*args: str) -> list[bytes]:
              result = subprocess.run(
                  ["git", *args],
                  check=True,
                  stdout=subprocess.PIPE,
              )
              return [path for path in result.stdout.split(b"\0") if path]

          paths = set(
              git_paths("diff", "--no-renames", "--name-only", "-z", baseline, "--")
          )
          paths.update(git_paths("ls-files", "--others", "--exclude-standard", "-z"))

          candidate = hashlib.sha256()
          for raw_path in sorted(paths):
              path = os.fsdecode(raw_path)
              candidate.update(b"path\0")
              candidate.update(raw_path)
              candidate.update(b"\0")
              try:
                  metadata = os.lstat(path)
              except FileNotFoundError:
                  candidate.update(b"state\0DELETED\0")
                  continue
              if stat.S_ISLNK(metadata.st_mode):
                  mode = b"120000"
                  content_hash = hashlib.sha256(
                      os.fsencode(os.readlink(path))
                  ).hexdigest()
              elif stat.S_ISREG(metadata.st_mode):
                  mode = b"100755" if metadata.st_mode & stat.S_IXUSR else b"100644"
                  digest = hashlib.sha256()
                  with open(path, "rb") as handle:
                      for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                          digest.update(chunk)
                  content_hash = digest.hexdigest()
              else:
                  raise SystemExit(f"unsupported candidate path type: {path}")
              candidate.update(b"mode\0")
              candidate.update(mode)
              candidate.update(b"\0sha256\0")
              candidate.update(content_hash.encode("ascii"))
              candidate.update(b"\0")
          print(candidate.hexdigest())
          PY
          )
          echo "ticket_335_candidate_state=$TICKET_CLOSURE_STATE"
          test "$TICKET_CLOSURE_STATE" = "$EXPECTED_CANDIDATE_STATE"

      - name: Final freeze guard
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only "$TICKET_BASELINE"...HEAD)" = "$TARGET"
          echo "ticket_335_final_freeze=PASS"
