name: Ticket 335 focused repair verification

on:
  push:
    branches: [chatgpt/ticket-335-candidate]
    paths: [".github/workflows/chatgpt-ticket-335-verify.yml"]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_CACHE_DIR: /tmp/uv-cache
      TICKET_BASELINE: 852f74c6d6f6d92fcde677db8781d0a1ad87cda8
      CANDIDATE_COMMIT: 6113af363ef7fc36d732fd938b8e075f00a91642
      TARGET: tests/integration/persistence/postgresql/test_r2_acceptance_renewal.py
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6113af363ef7fc36d732fd938b8e075f00a91642
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6

      - name: Install locked environment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          uv sync --locked --python "$(which python)"

      - name: Static preflight
        run: |
          set -euo pipefail
          test "$(git diff --name-only "$TICKET_BASELINE"...HEAD -- '*.py')" = "$TARGET"
          git diff --check "$TICKET_BASELINE"
          UV_PYTHON="$(which python)" uv run --locked ruff format --check "$TARGET"
          UV_PYTHON="$(which python)" uv run --locked ruff check "$TARGET"
          UV_PYTHON="$(which python)" uv run --locked mypy --explicit-package-bases "$TARGET"
          echo "ticket_335_static=PASS"

      - name: Candidate Arid suppression health
        run: |
          set -euo pipefail
          UV_PYTHON="$(which python)" uv run --locked arid . --json > /tmp/arid-candidate.json
          UV_PYTHON="$(which python)" uv run --locked arid . --fail-on-stale --suppression-summary
          python - <<'PY'
          import json
          with open("/tmp/arid-candidate.json", encoding="utf-8") as handle:
              result = json.load(handle)
          assert result["duplicate_groups"] == 0
          assert result["errors"] == []
          print("arid_candidate_introduced=0")
          print("arid_candidate_expanded=0")
          print("arid_candidate_attributable_stale_invalid_suppressions=0")
          print("arid_operational_errors=0")
          PY

      - name: Baseline Arid
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/polaris-ticket-335-baseline "$TICKET_BASELINE"
          cd /tmp/polaris-ticket-335-baseline
          UV_CACHE_DIR=/tmp/uv-cache UV_PYTHON="$(which python)" uv run --locked arid . --json > /tmp/arid-baseline.json
          UV_CACHE_DIR=/tmp/uv-cache UV_PYTHON="$(which python)" uv run --locked arid . --fail-on-stale --suppression-summary
          python - <<'PY'
          import json
          with open("/tmp/arid-baseline.json", encoding="utf-8") as handle:
              result = json.load(handle)
          assert result["duplicate_groups"] == 0
          assert result["errors"] == []
          PY
          echo "arid_ticket_differential=PASS"

      - name: Compute candidate state
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          TICKET_CLOSURE_STATE=$(
            TICKET_BASELINE="$TICKET_BASELINE" python - <<'PY'
          import hashlib
          import os
          import stat
          import subprocess

          baseline = os.environ["TICKET_BASELINE"]

          def git_paths(*args: str) -> list[bytes]:
              result = subprocess.run(
                  ["git", *args],
                  check=True,
                  stdout=subprocess.PIPE,
              )
              return [path for path in result.stdout.split(b"\0") if path]

          paths = set(
              git_paths("diff", "--no-renames", "--name-only", "-z", baseline, "--")
          )
          paths.update(git_paths("ls-files", "--others", "--exclude-standard", "-z"))

          candidate = hashlib.sha256()
          for raw_path in sorted(paths):
              path = os.fsdecode(raw_path)
              candidate.update(b"path\0")
              candidate.update(raw_path)
              candidate.update(b"\0")
              try:
                  metadata = os.lstat(path)
              except FileNotFoundError:
                  candidate.update(b"state\0DELETED\0")
                  continue
              if stat.S_ISLNK(metadata.st_mode):
                  mode = b"120000"
                  content_hash = hashlib.sha256(
                      os.fsencode(os.readlink(path))
                  ).hexdigest()
              elif stat.S_ISREG(metadata.st_mode):
                  mode = b"100755" if metadata.st_mode & stat.S_IXUSR else b"100644"
                  digest = hashlib.sha256()
                  with open(path, "rb") as handle:
                      for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                          digest.update(chunk)
                  content_hash = digest.hexdigest()
              else:
                  raise SystemExit(f"unsupported candidate path type: {path}")
              candidate.update(b"mode\0")
              candidate.update(mode)
              candidate.update(b"\0sha256\0")
              candidate.update(content_hash.encode("ascii"))
              candidate.update(b"\0")
          print(candidate.hexdigest())
          PY
          )
          echo "ticket_335_candidate_state=$TICKET_CLOSURE_STATE"

      - name: Freeze guard
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only "$TICKET_BASELINE"...HEAD)" = "$TARGET"
          echo "ticket_335_focused_freeze=PASS"
