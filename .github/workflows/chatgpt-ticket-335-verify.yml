name: Ticket 335 fresh verifier capability

on:
  push:
    branches: [chatgpt/ticket-335-candidate]
    paths: [".github/workflows/chatgpt-ticket-335-verify.yml"]

permissions:
  contents: read
  copilot-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COPILOT_AUTO_UPDATE: "false"
      COPILOT_MCP_TOOL_CACHE: "false"
    steps:
      - name: Install current Copilot CLI
        run: npm install --global @github/copilot

      - name: Probe fresh model availability
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' 'Reply exactly: COPILOT_READY' \
            | copilot -s \
                --no-custom-instructions \
                --disable-builtin-mcps \
                --deny-tool=shell,write,url,memory \
                --no-ask-user \
                --no-remote \
                --no-remote-export \
            | tee "$RUNNER_TEMP/copilot-probe.txt"
          grep -Fxq 'COPILOT_READY' "$RUNNER_TEMP/copilot-probe.txt"
          echo "fresh_verifier_substrate=AVAILABLE"
