name: ChatGPT ticket publication transport

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chatgpt-ticket-publication.yml"

permissions:
  contents: read
  issues: write

jobs:
  relationships:
    runs-on: ubuntu-latest
    steps:
      - name: Establish native ticket relationships
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: sponge-b0b/Polaris
        shell: bash
        run: |
          set -euo pipefail
          gh --version
          version="$(gh --version | awk 'NR == 1 {print $3}')"
          if [ "$(printf '%s\n' "2.94.0" "$version" | sort -V | head -n1)" != "2.94.0" ]; then
            echo "gh_version_too_old=$version; required=2.94.0"
            exit 1
          fi
          for issue in 336 337 338 339 340 341 342 343 344 345; do
            gh issue edit "$issue" --repo "$GH_REPO" --parent 281 --add-blocked-by 333
          done
          echo "native_relationship_mutation=PASS"
