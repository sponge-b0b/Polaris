name: ChatGPT apply to-tickets owner admission fix v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-to-tickets-owner-admission-v2.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Apply bounded skill fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import base64
          from pathlib import Path
          path = Path('.agents/skills/to-tickets/SKILL.md')
          text = path.read_text()
          marker = '## Execution Budget and Independence Boundary\n'
          heading = '## Delegated Owner Result Admission Gate\n'
          if heading in text:
              raise SystemExit('delegated-owner gate already present')
          if text.count(marker) != 1:
              raise SystemExit(f'expected exactly one insertion marker, found {text.count(marker)}')
          section = base64.b64decode('').decode()
          path.write_text(text.replace(marker, section + marker, 1))
          PY
          test "$(git status --short | wc -l)" -eq 1
          git status --short | grep -F ' M .agents/skills/to-tickets/SKILL.md'
          git add .agents/skills/to-tickets/SKILL.md
          git commit -m "fix(workflow): enforce delegated owner admission"
          git push origin HEAD:main
