Manual delegated-owner simulation used as substitute: no
```

If either line cannot be proven from actual returned child payloads in the current invocation, proposal readiness is unreachable. Human approval cannot waive this gate.

'''
          path.write_text(text.replace(marker, section + marker, 1))
          PY

          test "$(git status --short | wc -l)" -eq 1
          git status --short | grep -F ' M .agents/skills/to-tickets/SKILL.md'

          SPEC_SKILL_BLOB=$(git hash-object .agents/skills/to-tickets/SKILL.md)
          test "$SPEC_SKILL_BLOB" = "$MAIN_SKILL_BLOB"

          git add .agents/skills/to-tickets/SKILL.md
          git commit -m "fix(workflow): enforce delegated owner admission"
          git push origin HEAD:spec-357

      - name: Verify exact propagation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main spec-357
          MAIN_BLOB=$(git rev-parse origin/main:.agents/skills/to-tickets/SKILL.md)
          SPEC_BLOB=$(git rev-parse origin/spec-357:.agents/skills/to-tickets/SKILL.md)
          test "$MAIN_BLOB" = "$SPEC_BLOB"
          if git ls-tree -r --name-only origin/main | grep -Fx '.github/workflows/chatgpt-to-tickets-owner-admission.yml'; then
            echo 'temporary workflow still present on main' >&2
            exit 1
          fi
          echo "main_skill_blob=$MAIN_BLOB"
          echo "spec_skill_blob=$SPEC_BLOB"
