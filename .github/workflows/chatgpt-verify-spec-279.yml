name: ChatGPT verify Spec 279

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec-279
          fetch-depth: 0

      - name: Build isolated Spec contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4baa54445e0bcd9f19bb75277a9abc84bea3008c"
          CONTRACT_DIR=$(mktemp -d)
          CONTRACT_HANDOFF="$CONTRACT_DIR/contract.json"
          test ! -e "$CONTRACT_HANDOFF"
          export CONTRACT_HANDOFF
          gh issue view 279 --repo sponge-b0b/Polaris --json body --jq .body > "$CONTRACT_DIR/spec.md"
          DEFAULT_BRANCH=$(gh api repos/sponge-b0b/Polaris --jq .default_branch)
          DEFAULT_HEAD=$(gh api repos/sponge-b0b/Polaris/commits/$DEFAULT_BRANCH --jq .sha)
          if ! git cat-file -e "${DEFAULT_HEAD}^{commit}" 2>/dev/null; then
            git fetch --quiet https://github.com/sponge-b0b/Polaris.git "refs/heads/${DEFAULT_BRANCH}"
            test "$(git rev-parse FETCH_HEAD)" = "$DEFAULT_HEAD"
          fi
          git cat-file -e "${DEFAULT_HEAD}^{commit}"
          export DEFAULT_BRANCH DEFAULT_HEAD CONTRACT_DIR
          python - <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          SPEC_ISSUE = 279
          HEAD = "4baa54445e0bcd9f19bb75277a9abc84bea3008c"
          BASELINE = "4daed9034891600597a47c01b6c39d5ebd9914ca"
          BRANCH = "spec-279"
          body_bytes = Path(os.environ["CONTRACT_DIR"], "spec.md").read_bytes()
          text = body_bytes.decode("utf-8")
          spec_body_hash = hashlib.sha256(body_bytes).hexdigest()

          lines = text.splitlines()
          units: list[dict[str, object]] = []
          section = "(preamble)"
          paragraph: list[str] = []

          def norm(s: str) -> str:
              return "\n".join(part.rstrip() for part in s.replace("\r\n", "\n").replace("\r", "\n").split("\n")).rstrip()

          def add(kind: str, body: str) -> None:
              body = norm(body)
              if body:
                  units.append({"section": section, "kind": kind, "text": body})

          def flush() -> None:
              if paragraph:
                  add("paragraph", "\n".join(paragraph))
                  paragraph.clear()

          i = 0
          while i < len(lines):
              line = lines[i]
              stripped = line.strip()
              if re.match(r"^#{1,6}\s+", stripped):
                  flush()
                  section = re.sub(r"^#{1,6}\s+", "", stripped)
                  i += 1
                  continue
              if stripped.startswith("```"):
                  flush()
                  block = [line]
                  i += 1
                  while i < len(lines):
                      block.append(lines[i])
                      if lines[i].strip().startswith("```"):
                          i += 1
                          break
                      i += 1
                  add("code", "\n".join(block))
                  continue
              if not stripped:
                  flush()
                  i += 1
                  continue
              if stripped.startswith(">"):
                  flush()
                  block = [line]
                  i += 1
                  while i < len(lines) and lines[i].strip().startswith(">"):
                      block.append(lines[i])
                      i += 1
                  add("blockquote", "\n".join(block))
                  continue
              if re.match(r"^\s*(?:[-*+]\s+|\d+\.\s+)", line):
                  flush()
                  item = [line]
                  i += 1
                  while i < len(lines):
                      nxt = lines[i]
                      if not nxt.strip() or re.match(r"^\s*(?:[-*+]\s+|\d+\.\s+)", nxt) or re.match(r"^#{1,6}\s+", nxt.strip()):
                          break
                      if nxt.startswith("  ") or nxt.startswith("\t"):
                          item.append(nxt)
                          i += 1
                          continue
                      break
                  add("list-item", "\n".join(item))
                  continue
              if stripped.startswith("|") and stripped.endswith("|"):
                  flush()
                  if not re.fullmatch(r"\|?[\s:|-]+\|?", stripped):
                      add("table-row", line)
                  i += 1
                  continue
              if stripped.startswith("<") and stripped.endswith(">"):
                  flush()
                  add("html", line)
                  i += 1
                  continue
              paragraph.append(line)
              i += 1
          flush()

          if len(units) != 143:
              raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: expected complete source segmentation, got {len(units)}")

          # Fresh semantic classification produced from the current Spec body only.
          represented: dict[int, list[str]] = {
              1: ["ID-1","ID-2","ID-24","ID-26","ID-29","ID-30","ID-31","ID-32","NORM-2"],
              2: ["ID-5","ID-6","ID-7","ID-8","ID-9","ID-10","ID-11","ID-12"],
              3: ["ID-1","ID-2","ID-10","ID-11","ID-12","ID-13","ID-16","ID-17","ID-18","ID-20","ID-21","ID-24","ID-26","ID-27","NORM-1","NORM-2"],
              4: ["ID-24","ID-29","ID-30","ID-31","ID-32","OOS-1","OOS-11","OOS-12","NORM-2"],
              7: ["NORM-2"], 8: ["NORM-2"], 9: ["NORM-2"], 10: ["NORM-2"],
              11: ["NORM-2"], 12: ["NORM-2"], 13: ["NORM-2"], 14: ["NORM-1"],
              62: ["ID-1","ID-2","ID-24","ID-29","ID-30","ID-31","ID-32","NORM-2"],
              63: ["ID-29","ID-30","ID-31","ID-32","NORM-1","NORM-2"],
              138: ["NORM-1"],
              140: ["NORM-2"],
              141: ["NORM-2"],
              142: ["ID-8","ID-9","ID-10","ID-24","OOS-1"],
              143: ["ID-29","ID-30","ID-31","ID-32","NORM-2"],
          }
          nonnormative = {60, 61, 64, 139}

          def cell_key(cell: str) -> tuple[int, int, str]:
              m = re.fullmatch(r"(US|ID|TD|OOS|NORM)-(\d+)(?:\.(.+))?", cell)
              if not m:
                  raise ValueError(cell)
              return ({"US":0,"ID":1,"TD":2,"OOS":3,"NORM":4}[m.group(1)], int(m.group(2)), m.group(3) or "")

          classifications: list[list[object]] = []
          cell_sources: dict[str, list[str]] = {}
          display_manifest: dict[str, dict[str, str]] = {}
          oos_counter = 0

          for idx, unit in enumerate(units, 1):
              su = f"SU-{idx:04d}"
              sec = str(unit["section"])
              raw = str(unit["text"])
              text_hash = hashlib.sha256(norm(raw).encode("utf-8")).hexdigest()
              cells: list[str] | None = None
              classification: str

              numbered = re.match(r"^(\d+)\.\s+", raw.strip())
              if sec == "User Stories" and numbered:
                  cell = f"US-{int(numbered.group(1))}"
                  cells = [cell]
                  classification = "normative-new"
              elif sec == "Implementation Decisions" and numbered:
                  cell = f"ID-{int(numbered.group(1))}"
                  cells = [cell]
                  classification = "normative-new"
              elif sec == "Testing Decisions" and numbered:
                  cell = f"TD-{int(numbered.group(1))}"
                  cells = [cell]
                  classification = "normative-new"
              elif sec == "Out of Scope" and raw.lstrip().startswith("-"):
                  oos_counter += 1
                  cells = [f"OOS-{oos_counter}"]
                  classification = "normative-new"
              elif idx == 5:
                  cells = ["NORM-1"]
                  classification = "normative-new"
              elif idx == 6:
                  cells = ["NORM-2"]
                  classification = "normative-new"
              elif idx in represented:
                  cells = sorted(represented[idx], key=cell_key)
                  classification = "normative-represented"
              elif idx in nonnormative:
                  cells = None
                  classification = "non-normative"
              else:
                  raise SystemExit(f"SPEC CONTRACT: INVALID\nReason: unclassified source unit {su}: {sec} / {raw}")

              classifications.append([su, text_hash, classification, cells])
              if cells:
                  for cell in cells:
                      cell_sources.setdefault(cell, []).append(su)

              # Human-readable rows are source-derived display only and do not affect V2 identity.
              if classification == "normative-new":
                  for cell in cells or []:
                      if cell not in display_manifest:
                          if cell == "NORM-1":
                              source = "Implementation readiness"
                              requirement = "#278 must be certified and closed and #279 must have an exact implementation baseline before execution/ready-for-agent state."
                          elif cell == "NORM-2":
                              source = "Implementation readiness — controlling authority"
                              requirement = "Implementation must consume and conform to the completed #278 domain contract, synchronized R2 design authorities, and accepted ADR 0004 without redefining Decision semantics."
                          else:
                              source = f"{sec} item {numbered.group(1) if numbered else oos_counter}"
                              requirement = re.sub(r"^\s*(?:[-*+]\s+|\d+\.\s+)", "", raw).strip()
                          display_manifest[cell] = {"cell":cell,"source":source,"requirement":requirement}

          expected_cells = [f"US-{i}" for i in range(1,46)] + [f"ID-{i}" for i in range(1,33)] + [f"TD-{i}" for i in range(1,30)] + [f"OOS-{i}" for i in range(1,13)] + ["NORM-1","NORM-2"]
          expected_cells = sorted(expected_cells, key=cell_key)
          if sorted(cell_sources, key=cell_key) != expected_cells:
              raise SystemExit("SPEC CONTRACT: INVALID\nReason: manifest cell universe mismatch")
          if len(classifications) != 143 or len(cell_sources) != 120:
              raise SystemExit("SPEC CONTRACT: INVALID\nReason: contract counts do not close")

          manifest_identity = [[cell, cell_sources[cell]] for cell in expected_cells]
          inv_rows = [json.dumps(row, ensure_ascii=False, separators=(",", ":")) for row in classifications]
          man_rows = [json.dumps(row, ensure_ascii=False, separators=(",", ":")) for row in manifest_identity]
          payload = (
              "SPEC-CONTRACT-V2\n"
              + spec_body_hash
              + "\n--SOURCE-UNITS--\n"
              + "\n".join(inv_rows)
              + "\n--MANIFEST--\n"
              + "\n".join(man_rows)
              + "\n"
          )
          contract_hash = hashlib.sha256(payload.encode("utf-8")).hexdigest()

          handoff = {
              "spec_issue": SPEC_ISSUE,
              "head": HEAD,
              "baseline": BASELINE,
              "branch": BRANCH,
              "spec_body_hash": spec_body_hash,
              "spec_contract_hash": contract_hash,
              "default_branch": os.environ["DEFAULT_BRANCH"],
              "default_head": os.environ["DEFAULT_HEAD"],
              "source_counts": {
                  "user_stories": 45,
                  "implementation_decisions": 32,
                  "testing_decisions": 29,
                  "out_of_scope": 12,
                  "other_normative": 2,
              },
              "manifest": [display_manifest[cell] for cell in expected_cells],
              "contract_identity": {
                  "source_units": classifications,
                  "manifest": manifest_identity,
              },
          }
          handoff_bytes = json.dumps(handoff, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
          path = Path(os.environ["CONTRACT_HANDOFF"])
          tmp = path.with_suffix(".tmp")
          tmp.write_bytes(handoff_bytes)
          tmp.replace(path)
          digest = hashlib.sha256(handoff_bytes).hexdigest()

          print("SPEC CONTRACT: VALID")
          print(f"Spec issue: #{SPEC_ISSUE}")
          print(f"HEAD: {HEAD}")
          print(f"Baseline: {BASELINE}")
          print(f"Branch: {BRANCH}")
          print(f"Default branch: {os.environ['DEFAULT_BRANCH']}")
          print(f"Default head: {os.environ['DEFAULT_HEAD']}")
          print(f"SPEC_BODY_HASH: {spec_body_hash}")
          print(f"SPEC_CONTRACT_HASH: {contract_hash}")
          print(f"CONTRACT_HANDOFF_DIGEST: {digest}")
          print("Source units: 143")
          print("Classified source units: 143")
          print("Unclassified source units: 0")
          print("Normative source units without manifest mapping: 0")
          print("Non-normative source units without reason: 0")
          print("Manifest cells: 120")
          print("User Stories: 45")
          print("Implementation Decisions: 32")
          print("Testing Decisions: 29")
          print("Out of Scope: 12")
          print("Other normative: 2")
          print("Unmapped source items: 0")
          print("Duplicate source mappings: 0")
          print("Ambiguous source items: 0")
          print("Build isolation: PASS")
          print("Prior contract representations supplied or inspected: 0")
          print("Pre-existing scratch contract artifacts inspected: 0")
          print("Handoff path existed before build: no")
          print("HANDOFF_B64=" + base64.b64encode(handoff_bytes).decode("ascii"))
          PY
