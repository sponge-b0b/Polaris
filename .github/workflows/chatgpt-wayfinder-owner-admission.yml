name: ChatGPT apply wayfinder owner admission fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-wayfinder-owner-admission.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Apply bounded skill fix and propagate exact blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SPEC_BEFORE="$(git rev-parse origin/spec-357)"

          python - <<'PY'
          import base64
          from pathlib import Path
          path = Path('.agents/skills/wayfinder/SKILL.md')
          text = path.read_text()
          marker = '### Reconcile After Durable Wayfinder Transitions\n'
          heading = '### Project-delivery result admission\n'
          if heading in text:
              raise SystemExit('delegated-owner gate already present')
          if text.count(marker) != 1:
              raise SystemExit(f'expected exactly one insertion marker, found {text.count(marker)}')
          section = base64.b64decode('').decode()
          path.write_text(text.replace(marker, section + marker, 1))
          PY

          git diff --check
          test "$(git diff --name-only)" = ".agents/skills/wayfinder/SKILL.md"
          git add .agents/skills/wayfinder/SKILL.md
          git commit -m "fix(workflow): enforce wayfinder owner admission"
          MAIN_FIX="$(git rev-parse HEAD)"
          MAIN_BLOB="$(git rev-parse HEAD:.agents/skills/wayfinder/SKILL.md)"
          git push origin HEAD:main

          git fetch origin spec-357
          test "$(git rev-parse origin/spec-357)" = "$SPEC_BEFORE"
          git worktree add --detach /tmp/polaris-spec-357 "$SPEC_BEFORE"
          git show "$MAIN_FIX:.agents/skills/wayfinder/SKILL.md" > /tmp/polaris-spec-357/.agents/skills/wayfinder/SKILL.md
          test "$(git -C /tmp/polaris-spec-357 hash-object .agents/skills/wayfinder/SKILL.md)" = "$MAIN_BLOB"
          test "$(git -C /tmp/polaris-spec-357 diff --name-only)" = ".agents/skills/wayfinder/SKILL.md"
          git -C /tmp/polaris-spec-357 config user.name "github-actions[bot]"
          git -C /tmp/polaris-spec-357 config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/polaris-spec-357 add .agents/skills/wayfinder/SKILL.md
          git -C /tmp/polaris-spec-357 commit -m "fix(workflow): propagate wayfinder owner admission"

          git fetch origin spec-357
          test "$(git rev-parse origin/spec-357)" = "$SPEC_BEFORE"
          git -C /tmp/polaris-spec-357 push origin HEAD:spec-357
          test "$(git -C /tmp/polaris-spec-357 rev-parse HEAD:.agents/skills/wayfinder/SKILL.md)" = "$MAIN_BLOB"
