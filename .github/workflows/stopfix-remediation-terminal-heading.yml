name: stopfix remediation terminal heading

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stopfix-remediation-terminal-heading.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path
          p = Path('.agents/skills/to-remediation-specs/SKILL.md')
          s = p.read_text()
          old = '* exactly one latest terminal resolution anchor can be selected by comment chronology whose first non-empty line is `## Resolution` or `## Final Resolution`;'
          new = '* exactly one latest terminal resolution anchor can be selected by comment chronology whose first non-empty line is `## Resolution` or `## Final Resolution`, optionally followed by an em-dash (` — `) and a non-empty descriptive suffix;'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one terminal-heading rule, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = ".agents/skills/to-remediation-specs/SKILL.md"
          git diff --check
          git add .agents/skills/to-remediation-specs/SKILL.md
          git commit -m "fix(workflow): admit descriptive resolution headings"
          FIX_SHA=$(git rev-parse HEAD)
          git push origin HEAD:main

          git fetch origin spec-357
          git checkout -B spec-357 origin/spec-357
          git cherry-pick "$FIX_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = ".agents/skills/to-remediation-specs/SKILL.md"
          git push origin HEAD:spec-357

          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/stopfix-remediation-terminal-heading.yml
          git commit -m "chore: remove remediation-heading stopfix transport"
          git push origin HEAD:main
