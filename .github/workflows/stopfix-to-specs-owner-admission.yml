name: stopfix to-specs owner admission

on:
  push:
    paths:
      - '.github/workflows/stopfix-to-specs-owner-admission.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Patch canonical skill and propagate
        shell: bash
        run: |
          set -euo pipefail
          expected_main=07929dc6872c04e39abf68cf2daa396c3561c87c
          expected_spec=417662c2c6bd0f9eb1ada5aec0d67b7858bd2088
          test "$(git rev-parse HEAD^)" = "$expected_main"
          test "$(git ls-remote origin refs/heads/spec-357 | cut -f1)" = "$expected_spec"

          python - <<'PY'
          from pathlib import Path
          import base64

          p = Path('.agents/skills/to-specs/SKILL.md')
          s = p.read_text()
          anchor = "If required durable state cannot be recovered, report the missing artifact rather than infer or recreate it from memory.\n\n"
          assert anchor in s
          assert '## Delegated Owner Result Admission Gate' not in s
          payload = ''''''
          insert = base64.b64decode(payload).decode()
          s = s.replace(anchor, anchor + insert, 1)
          p.write_text(s)
          PY

          git diff --check
          grep -q '## Delegated Owner Result Admission Gate' .agents/skills/to-specs/SKILL.md
          grep -q 'Remediation owner invoked: $to-remediation-specs' .agents/skills/to-specs/SKILL.md
          grep -q 'Manual project-delivery reconstruction used as substitute: no' .agents/skills/to-specs/SKILL.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/skills/to-specs/SKILL.md
          git commit -m 'fix(workflow): require to-specs delegated owner results'
          fix_commit=$(git rev-parse HEAD)
          git push origin HEAD:main

          git checkout -B spec-357 origin/spec-357
          git cherry-pick "$fix_commit"
          git push origin HEAD:spec-357

          git checkout main
          git rm .github/workflows/stopfix-to-specs-owner-admission.yml
          git commit -m 'chore: remove to-specs stopfix transport'
          git push origin HEAD:main
