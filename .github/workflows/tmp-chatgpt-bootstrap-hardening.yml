name: Temporary ChatGPT bootstrap hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-chatgpt-bootstrap-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply bounded bootstrap hardening
        run: python .github/tmp-chatgpt-bootstrap-hardening.py
