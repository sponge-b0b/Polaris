name: Temporary ChatGPT capture Spec 279 candidate evidence

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-chatgpt-capture-spec-279-candidate.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2d59797ebcaf4b87b3c2c941fb08bffc2213dd7
          fetch-depth: 0
      - name: Bind and stage exact evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e2d59797ebcaf4b87b3c2c941fb08bffc2213dd7"
          OUT="$RUNNER_TEMP/spec279-candidate"
          mkdir -p "$OUT"
          cp -a src/polaris/application/decisions "$OUT/application-decisions"
          cp -a tests/application/decisions "$OUT/application-tests"
          if [ -d src/polaris/domain/decisions ]; then cp -a src/polaris/domain/decisions "$OUT/domain-decisions"; fi
          mkdir -p "$OUT/authority"
          cp docs/proposed/investment-decisions-r2-foundation-public-contract.md "$OUT/authority/"
          cp docs/proposed/investment-decisions-lifecycle-model.md "$OUT/authority/"
          cp docs/proposed/investment-decisions-decision-relationship-model.md "$OUT/authority/"
          cp docs/proposed/application-use-cases-investment-decision-lifecycle.md "$OUT/authority/"
          cp docs/proposed/durable-persistence-investment-decision-history.md "$OUT/authority/"
          cp docs/adr/0004-platform-make-async-and-multi-core-execution-first-class.md "$OUT/authority/"
          printf '%s\n' "$(git rev-parse HEAD)" > "$OUT/HEAD.txt"
          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: spec-279-candidate-evidence
          path: ${{ runner.temp }}/spec279-candidate
          retention-days: 1
