name: Temporary ChatGPT capture Spec 279 verification inputs

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-chatgpt-capture-spec-279.yml'

permissions:
  contents: read
  issues: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Capture exact tracker inputs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: sponge-b0b/Polaris
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/spec279-inputs"
          gh api "repos/$REPO/issues/279" > "$RUNNER_TEMP/spec279-inputs/issue.json"
          gh api "repos/$REPO/issues/279" --jq .body > "$RUNNER_TEMP/spec279-inputs/spec-body.md"
          sha256sum "$RUNNER_TEMP/spec279-inputs/spec-body.md" > "$RUNNER_TEMP/spec279-inputs/spec-body.sha256"
          gh api "repos/$REPO/issues/279/comments?per_page=100" --paginate > "$RUNNER_TEMP/spec279-inputs/spec-comments-pages.json"
          gh api "repos/$REPO/issues/comments/5630203405" > "$RUNNER_TEMP/spec279-inputs/coverage-comment.json"
          gh api "repos/$REPO/issues/comments/5679200640" > "$RUNNER_TEMP/spec279-inputs/checkpoint-comment.json"
      - uses: actions/upload-artifact@v4
        with:
          name: spec-279-verification-inputs
          path: ${{ runner.temp }}/spec279-inputs
          retention-days: 1
