name: Temporary ChatGPT capture verify-spec finalizer

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-chatgpt-capture-verify-finalizer.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2d59797ebcaf4b87b3c2c941fb08bffc2213dd7
      - name: Capture canonical utility
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/verify-finalizer"
          mkdir -p "$OUT"
          cp .agents/skills/verify-spec/scripts/verify_spec_artifacts.py "$OUT/"
          cp .agents/skills/review-spec/scripts/review_spec_artifacts.py "$OUT/"
          sha256sum "$OUT"/*.py > "$OUT/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: verify-spec-finalizer
          path: ${{ runner.temp }}/verify-finalizer
          retention-days: 1
