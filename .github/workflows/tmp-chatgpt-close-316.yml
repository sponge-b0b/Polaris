name: Temporary ChatGPT close ticket 316 lifecycle

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-chatgpt-close-316.yml

permissions:
  contents: write
  issues: write

jobs:
  close:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: sponge-b0b/Polaris
      SPEC_HEAD: 36f06cf396e50409e432b99fa00941053fe83f02
      TICKET_BASELINE: e243c2c50b0d2a2ed4ee539f040fed53597a402f
      CERTIFIED_STATE: 9e7248f3a868957fb660e4ade4367b9b7c0649ac75ff22e5e264728b85b9ffa9
      PRE_TRANSPORT_MAIN: a8d784d63210f945ddbc3546c350d61386009080
      AUTHORITY_MAIN: 330cf7f45c1d6aaae1358466f330177fcc228cf2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Revalidate closure bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$REPO/git/ref/heads/spec-279 --jq .object.sha)" = "$SPEC_HEAD"
          test "$(gh api repos/$REPO/issues/316 --jq .state)" = "open"
          test "$(gh api repos/$REPO/issues/316 --jq .parent_issue_url)" = "https://api.github.com/repos/$REPO/issues/310"
          test "$(gh api repos/$REPO/issues/316 --jq '.issue_dependencies_summary.blocked_by')" = "0"
          gh api repos/$REPO/issues/316 --jq .body | grep -Fq "Ticket baseline"
          gh api repos/$REPO/issues/316 --jq .body | grep -Fq "$TICKET_BASELINE"
          gh api repos/$REPO/issues/comments/5676233718 --jq .body | grep -Fq "**Stage:** verifier-passed"
          gh api repos/$REPO/issues/comments/5676233718 --jq .body | grep -Fq "$CERTIFIED_STATE"
          gh api repos/$REPO/issues/comments/5676233718 --jq .body | grep -Fq "TICKET CLOSURE: PASS"

      - name: Project certified closure into durable review state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          repo = os.environ["REPO"]
          spec_head = os.environ["SPEC_HEAD"]
          baseline = os.environ["TICKET_BASELINE"]
          candidate = os.environ["CERTIFIED_STATE"]

          def api(path, method="GET", payload=None):
              cmd = ["gh", "api", f"repos/{repo}/{path}"]
              if method != "GET":
                  cmd += ["-X", method, "--input", "-"]
              result = subprocess.run(
                  cmd,
                  input=(json.dumps(payload) if payload is not None else None),
                  text=True,
                  stdout=subprocess.PIPE,
                  check=True,
              )
              return json.loads(result.stdout) if result.stdout.strip() else None

          # Finding Continuity Ledger: RF-3 becomes terminal satisfied.
          finding = api("issues/comments/5662220111")
          body = finding["body"]
          match = re.search(r"```json\n(.*?)\n```", body, re.S)
          if not match:
              raise SystemExit("finding ledger JSON block missing")
          rows = json.loads(match.group(1))
          rf3 = next((row for row in rows if row.get("id") == "RF-3"), None)
          rf4 = next((row for row in rows if row.get("id") == "RF-4"), None)
          if rf3 is None or rf4 is None:
              raise SystemExit("RF-3/RF-4 missing")
          if rf3.get("status") not in {"open", "satisfied"}:
              raise SystemExit(f"unexpected RF-3 status: {rf3.get('status')}")
          rf3["status"] = "satisfied"
          rf3["disposition_evidence"] = (
              "Ticket #316 independently certified TICKET CLOSURE: PASS for candidate "
              f"{candidate}; persisted commit {spec_head}; closure checkpoint comment "
              "5676233718. ARCHSRC-1 atomic multi-relationship correction coverage is "
              "implemented and independently closed."
          )
          if rf4.get("status") != "open":
              raise SystemExit(f"RF-4 unexpectedly not open: {rf4.get('status')}")
          rendered = json.dumps(rows, indent=2, ensure_ascii=False)
          body = body[:match.start(1)] + rendered + body[match.end(1):]
          api("issues/comments/5662220111", "PATCH", {"body": body})

          # Decomposition record: preserve historical sections, update the canonical DD-1
          # top-level status, and append the implementation-closure projection.
          decomp = api("issues/comments/5663250943")
          body = decomp["body"]
          open_form = (
              "### DD-1 — Atomic multi-relationship correction omitted from decomposition\n"
              "Status: reconciled"
          )
          closed_form = (
              "### DD-1 — Atomic multi-relationship correction omitted from decomposition\n"
              "Status: satisfied"
          )
          if open_form in body:
              body = body.replace(open_form, closed_form, 1)
          elif closed_form not in body:
              raise SystemExit("DD-1 canonical status anchor missing")
          heading = "## Implementation Closure — #316"
          if heading not in body:
              body += f"""

{heading}

**Ticket:** #316 — Add atomic multi-relationship correction coordination  
**Finding:** RF-3  
**Architecture obligation:** `ARCHSRC-1`  
**Ticket baseline:** `{baseline}`  
**Certified candidate:** `{candidate}`  
**Persisted commit:** `{spec_head}`  
**Independent verification:** `TICKET CLOSURE: PASS` — checkpoint comment `5676233718`, Attempt 2.

Closure projection:
- DD-1 / RF-3 implementation status: `satisfied`.
- `ARCHSRC-1` is implemented on `spec-279` and independently certified against all 10 ticket acceptance cells; violated 0, unproven 0, unchecked 0.
- Certified closure domains: atomic correction-set domain; semantic multiset/replay domain; temporal final-history/preservation domain — all closed, remaining 0.
- Equivalent distinct sibling corrections preserve multiset cardinality; tuple order, request-local handles, and generated durable IDs remain non-semantic while graph/content/ancestry/cardinality remain semantic.
- Complete correction sets pass once through the authoritative reducer and commit atomically; singular correction compatibility and preservation obligations remain intact.
- DD-2 / RF-4 remains decomposition-reconciled to `ARCHSRC-2` / #317 and its implementation obligation remains open.

Current implementation obligations from decomposition defects: satisfied 1 (`ARCHSRC-1` / #316); open 1 (`ARCHSRC-2` / #317).
"""
          api("issues/comments/5663250943", "PATCH", {"body": body})

          # Parent Ticket Coverage Manifest: append current implementation closure
          # without rewriting decomposition provenance.
          coverage = api("issues/comments/5630203405")
          body = coverage["body"]
          heading = "## Architecture / Design Obligation Closure Projection — #316"
          if heading not in body:
              body += f"""

{heading}

- `ARCHSRC-1` → **satisfied** by #316. Independent `$verify-ticket-closure` certified exact candidate `{candidate}` with 10/10 acceptance cells proven and all three certified closure domains closed; persisted product commit `{spec_head}` on `spec-279`; closure checkpoint comment `5676233718`.
- `ARCHSRC-2` → implementation ticket #317; implementation obligation remains open.

Architecture/design implementation obligations: 2 total; satisfied 1; open 1; unmapped 0; ambiguous 0; implementation obligations without ticket coverage 0.

This projection records implementation closure only. The original decomposition rows remain provenance, and fresh integrated `$verify-spec` remains required after all remediation tickets close.
"""
          api("issues/comments/5630203405", "PATCH", {"body": body})

          # Spec Review body: append the latest decomposition-remediation state.
          review = api("issues/310")
          body = review["body"]
          heading = "## Decomposition Remediation Closure Update — #316"
          if heading not in body:
              body += f"""

{heading}

- DD-1 / RF-3 / `ARCHSRC-1`: **satisfied** by #316.
- Independent closure: `TICKET CLOSURE: PASS`, exact candidate `{candidate}`, 10/10 acceptance cells proven, all nested closure domains closed.
- Persisted product state: `spec-279@{spec_head}`.
- DD-2 / RF-4 / `ARCHSRC-2`: remains open on #317.
- RB-1, RB-2/RF-1, and RB-3/RF-2 remain satisfied.
- Spec Review #310 remains in Review Remediation until #317 closes and fresh integrated `$verify-spec` certifies the resulting exact `spec-279` HEAD.
"""
          api("issues/310", "PATCH", {"body": body})
          PY

      - name: Persist ticket closure evidence and close ticket
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ["REPO"]
          spec_head = os.environ["SPEC_HEAD"]
          baseline = os.environ["TICKET_BASELINE"]
          candidate = os.environ["CERTIFIED_STATE"]
          marker = "<!-- ticket-316-closure-evidence:v1 -->"

          def api(path, method="GET", payload=None):
              cmd = ["gh", "api", f"repos/{repo}/{path}"]
              if method != "GET":
                  cmd += ["-X", method, "--input", "-"]
              result = subprocess.run(
                  cmd,
                  input=(json.dumps(payload) if payload is not None else None),
                  text=True,
                  stdout=subprocess.PIPE,
                  check=True,
              )
              return json.loads(result.stdout) if result.stdout.strip() else None

          comments = api("issues/316/comments?per_page=100")
          matches = [c for c in comments if marker in c.get("body", "")]
          if len(matches) > 1:
              raise SystemExit("multiple ticket-316 closure evidence comments")
          body = f"""{marker}
## Root Closure Evidence

**Root:** None — DD-1 / RF-3 architecture/decomposition remediation  
**Architecture obligation:** `ARCHSRC-1`  
**Production path:** privileged `DecisionRelationshipCorrectionService` atomic correction-set coordination through the existing authoritative relationship reducer and atomic store command boundary.  
**Independent verification:** `TICKET CLOSURE: PASS` — fresh `$verify-ticket-closure`, Actions run `34941072421`, job `104289661324`.  
**Ticket baseline:** `{baseline}`  
**Certified candidate state:** `{candidate}`  
**Persisted commit:** `{spec_head}` — `feat(application): add atomic relationship correction sets`

Certified acceptance:
- 10/10 ticket acceptance cells proven; violated 0; unproven 0; unchecked 0.
- `ARCHSRC-1` authority/decomposition accounting complete; missing 0; ambiguous 0; misrouted 0; implementation obligations without coverage 0.
- Certified Closure Domains 3/3 closed: atomic correction-set; semantic multiset/replay; temporal final-history/preservation.
- Equivalent distinct correction acts preserve multiset cardinality; tuple order, local handles, and generated IDs are non-semantic, while semantic graph/content/ancestry/cardinality remain binding for replay/conflict.
- Full correction set is validated as one final history and persisted atomically with no public tentative prefix.
- Exact endpoint guards plus material non-endpoint/path/future/history/absence revalidation remain enforced.
- Relationship-only versioning remains once-only/support-sensitive and does not advance lifecycle sequence.
- Existing singular correction, renewal, Supersession, append-only history, cycle/contest/restoration, concurrency, idempotency, and persistence-failure behavior are preserved.

Final candidate verification: targeted relationship tests 43 passed; full locked suite 637 passed; architecture guards passed; changed-surface Ruff/mypy passed; persisted candidate state exactly matched the independently certified state.

Parent reconciliation: RF-3 is terminal `satisfied`; DD-1 is terminal `satisfied`; `ARCHSRC-1` closure is projected into the parent Spec #279 Ticket Coverage Manifest and Spec Review #310 durable state. DD-2/RF-4/`ARCHSRC-2` remains open on #317.
"""
          if matches:
              comment = api(f"issues/comments/{matches[0]['id']}", "PATCH", {"body": body})
          else:
              comment = api("issues/316/comments", "POST", {"body": body})
          print(f"CLOSURE_COMMENT_ID={comment['id']}")

          issue = api("issues/316")
          labels = [item["name"] for item in issue.get("labels", []) if item["name"] != "ready-for-agent"]
          api("issues/316", "PATCH", {"state": "closed", "state_reason": "completed", "labels": labels})
          PY

      - name: Remove all temporary ticket 316 transports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          mapfile -t tmpfiles < <(git ls-files '.github/workflows/tmp-chatgpt-*316*.yml')
          test ${#tmpfiles[@]} -gt 0
          printf 'Removing %s temporary ticket-316 workflow files\n' "${#tmpfiles[@]}"
          git rm -- "${tmpfiles[@]}"
          git commit -m "chore(workflow): remove ticket 316 temporary transports"
          cleanup=$(git rev-parse HEAD)
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$cleanup"
          git diff --quiet "$PRE_TRANSPORT_MAIN" "$cleanup" --
          git diff --quiet "$AUTHORITY_MAIN" "$cleanup" --
          ! git ls-tree -r --name-only "$cleanup" .github/workflows | grep -q '316'
          echo "MAIN_CLEANUP_COMMIT=$cleanup"

      - name: Final durable readback
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$REPO/git/ref/heads/spec-279 --jq .object.sha)" = "$SPEC_HEAD"
          main=$(gh api repos/$REPO/git/ref/heads/main --jq .object.sha)
          test "$main" = "$(git rev-parse HEAD)"
          test "$(gh api repos/$REPO/issues/316 --jq .state)" = "closed"
          test "$(gh api repos/$REPO/issues/316 --jq .state_reason)" = "completed"
          test "$(gh api repos/$REPO/issues/316 --jq .parent_issue_url)" = "https://api.github.com/repos/$REPO/issues/310"
          test "$(gh api repos/$REPO/issues/316 --jq '[.labels[].name | select(. == "ready-for-agent")] | length')" = "0"
          gh api repos/$REPO/issues/comments/5662220111 --jq .body | grep -Fq '"id": "RF-3"'
          python - <<'PY'
          import json, re, subprocess
          repo='sponge-b0b/Polaris'
          raw=subprocess.run(['gh','api',f'repos/{repo}/issues/comments/5662220111'],check=True,text=True,stdout=subprocess.PIPE).stdout
          body=json.loads(raw)['body']
          rows=json.loads(re.search(r'```json\n(.*?)\n```',body,re.S).group(1))
          status={row['id']:row['status'] for row in rows}
          assert status['RF-3']=='satisfied', status
          assert status['RF-4']=='open', status
          PY
          gh api repos/$REPO/issues/comments/5663250943 --jq .body | grep -Fq '## Implementation Closure — #316'
          gh api repos/$REPO/issues/comments/5663250943 --jq .body | grep -Fq 'Status: satisfied'
          gh api repos/$REPO/issues/comments/5630203405 --jq .body | grep -Fq '## Architecture / Design Obligation Closure Projection — #316'
          gh api repos/$REPO/issues/310 --jq .body | grep -Fq '## Decomposition Remediation Closure Update — #316'
          gh api repos/$REPO/issues/316/comments?per_page=100 --paginate --slurp --jq '[.[][] | select(.body | contains("<!-- ticket-316-closure-evidence:v1 -->"))] | length' | grep -qx '1'
          echo "TICKET_316_CLOSURE=PASS"
          echo "FINAL_MAIN=$main"
