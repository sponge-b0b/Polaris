name: Temporary ChatGPT close ticket 317 lifecycle

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-chatgpt-close-317.yml

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  close:
    runs-on: ubuntu-24.04
    env:
      REPO: sponge-b0b/Polaris
      API_VERSION: '2026-03-10'
      TICKET: '317'
      REVIEW: '310'
      SPEC: '279'
      BASELINE: 36f06cf396e50409e432b99fa00941053fe83f02
      CANDIDATE: 8a3ada741d4fde4e86a04bfbd821be9cc1e436e02214b57c974d41914646ee56
      PRODUCT_COMMIT: c6a5955c944c72c01c052db743ef97d47b3a56f4
      CHECKPOINT_ID: '5676814349'
      FINDING_LEDGER_ID: '5662220111'
      DECOMP_ID: '5663250943'
      COVERAGE_ID: '5630203405'
      SESSION_LEDGER_ID: '5486199073'
      CLEAN_MAIN_BASELINE: 4615c51579a3f6e95849ebc990e2b87c9c39a6c7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Revalidate certified persistence and hierarchy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api -H "X-GitHub-Api-Version: $API_VERSION" repos/$REPO/git/ref/heads/spec-279 --jq .object.sha)" = "$PRODUCT_COMMIT"
          test "$(gh api -H "X-GitHub-Api-Version: $API_VERSION" repos/$REPO/issues/$TICKET --jq .state)" = "open"
          test "$(gh api -H "X-GitHub-Api-Version: $API_VERSION" repos/$REPO/issues/$TICKET --jq .parent_issue_url)" = "https://api.github.com/repos/$REPO/issues/$REVIEW"
          test "$(gh api -H "X-GitHub-Api-Version: $API_VERSION" repos/$REPO/issues/$SPEC --jq .state)" = "open"
          body=$(gh api -H "X-GitHub-Api-Version: $API_VERSION" repos/$REPO/issues/comments/$CHECKPOINT_ID --jq .body)
          grep -Fq '**Stage:** verifier-passed' <<<"$body"
          grep -Fq "**Candidate state:** \`$CANDIDATE\`" <<<"$body"
          grep -Fq "**Ticket baseline:** \`$BASELINE\`" <<<"$body"
          grep -Fq '**Architecture obligations:** `ARCHSRC-2`' <<<"$body"
          grep -Fq 'TICKET CLOSURE: PASS' <<<"$body"

      - name: Persist ticket closure evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='<!-- ticket-317-closure-evidence:v1 -->'
          pages="$RUNNER_TEMP/ticket-comments.json"
          gh api --paginate --slurp -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPO/issues/$TICKET/comments?per_page=100" > "$pages"
          count=$(jq --arg marker "$marker" '[.[][] | select(.body | contains($marker))] | length' "$pages")
          if [ "$count" -gt 1 ]; then
            echo 'ambiguous ticket closure evidence' >&2; exit 1
          fi
          cat > "$RUNNER_TEMP/closure-evidence.md" <<'EOF'
          <!-- ticket-317-closure-evidence:v1 -->
          ## Root Closure Evidence

          **Root:** None — DD-2 / RF-4 architecture/decomposition remediation  
          **Architecture obligation:** `ARCHSRC-2`  
          **Production path:** privileged `DecisionRelationshipService.attach_omitted_renewal_lineage()` existing-identity `RENEWED_FROM` attachment through the existing authoritative relationship reducer and atomic Decisions store boundary.  
          **Independent verification:** `TICKET CLOSURE: PASS` — fresh `$verify-ticket-closure`, Actions run `34945673902`, job `104304363228`.  
          **Ticket baseline:** `36f06cf396e50409e432b99fa00941053fe83f02`  
          **Certified candidate state:** `8a3ada741d4fde4e86a04bfbd821be9cc1e436e02214b57c974d41914646ee56`  
          **Persisted commit:** `c6a5955c944c72c01c052db743ef97d47b3a56f4` — `feat(application): attach omitted renewal lineage`

          ### Acceptance proof
          - 5/5 authoritative acceptance cells proven; violated 0; unproven 0; unchecked 0.
          - `ARCHSRC-2` decomposition accounting complete: applicable material architecture obligations 1; covered 1; missing 0; ambiguous 0; misrouted 0; implementation obligations absent from ticket coverage 0.
          - Certified Closure Domains 4/4 closed: acceptance obligations; temporal historical admission; mixed-lineage/revalidation; public/privileged boundary.
          - Valid late attachment preserves the existing source Decision/Need identity and predecessor identity/history; no replacement identity, reopening, or immutable lifecycle rewrite is introduced.
          - Explicit `RenewedFromRelationshipBasis`, Actor Attribution, Trigger Provenance, optional Technical Provenance, effective time, and OperationId are preserved.
          - Every predecessor remains independently admitted at source-episode start and relationship-effective time, including substantive/external resolution and fail-closed contested/unsupported/incomplete boundaries.
          - Relationship effective time cannot predate the source judgment episode.
          - Mixed-lineage cycle safety, exact directly touched endpoint versions, non-endpoint/path/history/future/absence revalidation, atomic failure semantics, and support/basis-sensitive both-endpoint `DecisionVersion` effects remain governed by the existing reducer/store contract without lifecycle-sequence mutation.
          - Exact replay appends nothing; changed semantic request reuse of the same OperationId conflicts.
          - Later endpoint lifecycle correction does not silently rewrite admitted relationship truth; relationship-semantic change remains explicit relationship correction.
          - Ordinary new-identity `renew()` remains distinct and unchanged.
          - `AttachOmittedRenewalLineageCommand` remains privileged/internal: absent from ordinary `polaris.application.decisions.__all__` while usable through `polaris.application.decisions.relationships`.
          - No `PRIOR_DECISION_CONTEXT`, generic graph framework, schema/persistence broadening, or unrelated surface was introduced.

          ### Invariant sweep
          - Authority units: 6/6 mapped and dispositioned; unmapped 0; ambiguous 0.
          - Proof plans: 5/5 authority-first; composition/order seams 9/9 dispositioned; remaining 0.
          - Nested domains: 4/4 closed; open candidates 0; ambiguous membership 0.

          ### Protected roots / preservation
          - RB-1, RB-2/RF-1, RB-3/RF-2, and DD-1/RF-3/`ARCHSRC-1` remain satisfied on the integrated branch; the candidate does not alter their governed failure/admission/correction contracts.

          ### Verification
          - Fresh `$verify-ticket-closure`: PASS; independent actionable findings 0.
          - Relationship tests: 45 passed.
          - Application Decisions tests: 153 passed.
          - Architecture guards: 305 passed.
          - Ruff, format check, Mypy, and diff hygiene: PASS.
          - Persisted representation-independent candidate state exactly equals the independently certified state.

          ### Commits
          - `c6a5955` — `feat(application): attach omitted renewal lineage`

          ### Parent reconciliation
          - RF-4 is terminal `satisfied` by this exact candidate/commit.
          - DD-2 is terminal `satisfied`; `ARCHSRC-2` is implemented and independently certified.
          - `ARCHSRC-1` remains satisfied by #316; all decomposition-derived implementation obligations are now satisfied.
          - Fresh integrated `$verify-spec` for #279 remains required before any downstream review/merge-cleanup lifecycle.
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/closure-evidence.md"
          if [ "$count" -eq 0 ]; then
            jq -Rs '{body:.}' "$RUNNER_TEMP/closure-evidence.md" | gh api -X POST -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPO/issues/$TICKET/comments" --input - > "$RUNNER_TEMP/closure-post.json"
            jq -r .id "$RUNNER_TEMP/closure-post.json" > "$RUNNER_TEMP/closure-evidence-id.txt"
          else
            jq -r --arg marker "$marker" '.[][] | select(.body | contains($marker)) | .id' "$pages" > "$RUNNER_TEMP/closure-evidence-id.txt"
            id=$(cat "$RUNNER_TEMP/closure-evidence-id.txt")
            existing=$(gh api -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPO/issues/comments/$id" --jq .body)
            test "$existing" = "$(cat "$RUNNER_TEMP/closure-evidence.md")"
          fi
          test -s "$RUNNER_TEMP/closure-evidence-id.txt"

      - name: Reconcile RF-4 Finding Continuity Ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPO/issues/comments/$FINDING_LEDGER_ID" --jq .body > "$RUNNER_TEMP/finding.md"
          python - <<'PY'
          import json, re, pathlib
          p=pathlib.Path('/tmp/_dummy')
          path=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'finding.md'
          text=path.read_text()
          m=re.search(r'```json\n(.*?)\n```', text, re.S)
          if not m: raise SystemExit('finding ledger JSON block missing')
          data=json.loads(m.group(1))
          rows=[r for r in data if r.get('id')=='RF-4']
          if len(rows)!=1: raise SystemExit(f'RF-4 rows={len(rows)}')
          row=rows[0]
          expected='Ticket #317 independently certified TICKET CLOSURE: PASS for candidate 8a3ada741d4fde4e86a04bfbd821be9cc1e436e02214b57c974d41914646ee56; persisted commit c6a5955c944c72c01c052db743ef97d47b3a56f4; closure checkpoint comment 5676814349. ARCHSRC-2 late omitted-renewal-lineage attachment coverage is implemented and independently closed.'
          if row.get('status') not in {'open','satisfied'}: raise SystemExit(f'unexpected RF-4 status {row.get("status")}')
          if row.get('disposition_evidence') not in {'', expected}: raise SystemExit('unexpected RF-4 disposition evidence')
          row['status']='satisfied'; row['disposition_evidence']=expected
          block='```json\n'+json.dumps(data, indent=2)+'\n```'
          text=text[:m.start()]+block+text[m.end():]
          path.write_text(text)
          PY
          jq -Rs '{body:.}' "$RUNNER_TEMP/finding.md" | gh api -X PATCH -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPO/issues/comments/$FINDING_LEDGER_ID" --input - >/dev/null

      - name: Reconcile DD-2 decomposition implementation closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPO/issues/comments/$DECOMP_ID" --jq .body > "$RUNNER_TEMP/decomp.md"
          python - <<'PY'
          import os, pathlib, re
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'decomp.md'
          text=path.read_text()
          header='### DD-2 — Late omitted-renewal-lineage attachment omitted from decomposition\n'
          if header not in text: raise SystemExit('DD-2 section missing')
          before, rest=text.split(header,1)
          section, tail=rest.split('\nUnresolved decomposition defects:',1)
          if 'Status: satisfied' not in section:
              if 'Status: reconciled' not in section: raise SystemExit('unexpected DD-2 status')
              section=section.replace('Status: reconciled','Status: satisfied',1)
          text=before+header+section+'\nUnresolved decomposition defects:'+tail
          text=re.sub(r'^Open decomposition-defect RF rows:.*$', 'Open decomposition-defect RF rows: None — RF-3 / #316 and RF-4 / #317 are satisfied.', text, count=1, flags=re.M)
          heading='## Implementation Closure — #317'
          block='''\n\n## Implementation Closure — #317\n\n**Ticket:** #317 — Attach omitted renewal lineage to existing Decisions  \n**Finding:** RF-4  \n**Architecture obligation:** `ARCHSRC-2`  \n**Ticket baseline:** `36f06cf396e50409e432b99fa00941053fe83f02`  \n**Certified candidate:** `8a3ada741d4fde4e86a04bfbd821be9cc1e436e02214b57c974d41914646ee56`  \n**Persisted commit:** `c6a5955c944c72c01c052db743ef97d47b3a56f4`  \n**Independent verification:** `TICKET CLOSURE: PASS` — checkpoint comment `5676814349`, Attempt 2; Actions run `34945673902`, job `104304363228`.\n\nClosure projection:\n- DD-2 / RF-4 implementation status: `satisfied`.\n- `ARCHSRC-2` is implemented on `spec-279` and independently certified against all 5 authoritative acceptance cells; violated 0, unproven 0, unchecked 0.\n- Certified closure domains 4/4 are closed: acceptance obligations; temporal historical admission; mixed-lineage/revalidation; public/privileged boundary.\n- Late omitted `RENEWED_FROM` lineage attaches only to an already-established source Decision/Need with explicit typed renewal basis and attributable command metadata; every predecessor is admitted at both source-episode start and relationship-effective time.\n- Existing source/predecessor identity and immutable lifecycle history remain unchanged; no resolved Decision is reopened and no replacement identity is created.\n- Existing relationship interpretation, mixed-lineage graph safety, expected-version/non-endpoint revalidation, support-sensitive both-endpoint versioning, atomic persistence, and idempotent replay/conflict semantics remain authoritative.\n- The privileged command is not exposed through ordinary `polaris.application.decisions.__all__`; ordinary new-identity renewal remains unchanged.\n- DD-1 / RF-3 / `ARCHSRC-1` remains satisfied by #316.\n\nCurrent implementation obligations from decomposition defects: satisfied 2 (`ARCHSRC-1` / #316, `ARCHSRC-2` / #317); open 0; unmapped 0; ambiguous 0.\n'''
          if heading not in text:
              text=text.rstrip()+block
          path.write_text(text)
          PY
          jq -Rs '{body:.}' "$RUNNER_TEMP/decomp.md" | gh api -X PATCH -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPO/issues/comments/$DECOMP_ID" --input - >/dev/null

      - name: Project ARCHSRC-2 closure into parent Spec coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPO/issues/comments/$COVERAGE_ID" --jq .body > "$RUNNER_TEMP/coverage.md"
          python - <<'PY'
          import os, pathlib
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'coverage.md'
          text=path.read_text()
          heading='## Architecture / Design Obligation Closure Projection — #317'
          block='''\n\n## Architecture / Design Obligation Closure Projection — #317\n\n- `ARCHSRC-2` → **satisfied** by #317. Independent `$verify-ticket-closure` certified exact candidate `8a3ada741d4fde4e86a04bfbd821be9cc1e436e02214b57c974d41914646ee56` with 5/5 authoritative acceptance cells proven and all four certified closure domains closed; persisted product commit `c6a5955c944c72c01c052db743ef97d47b3a56f4` on `spec-279`; closure checkpoint comment `5676814349`.\n- `ARCHSRC-1` remains **satisfied** by #316 at persisted commit `36f06cf396e50409e432b99fa00941053fe83f02`.\n\nArchitecture/design implementation obligations: 2 total; satisfied 2; open 0; unmapped 0; ambiguous 0; implementation obligations without ticket coverage 0.\n\nThis projection records implementation closure only. The original decomposition rows remain provenance. Fresh integrated `$verify-spec` must independently certify the repaired exact `spec-279` HEAD before the Spec Review lifecycle continues.\n'''
          if heading not in text:
              text=text.rstrip()+block
          path.write_text(text)
          PY
          jq -Rs '{body:.}' "$RUNNER_TEMP/coverage.md" | gh api -X PATCH -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPO/issues/comments/$COVERAGE_ID" --input - >/dev/null

      - name: Read back reconciled parent state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPO/issues/comments/$FINDING_LEDGER_ID" --jq .body > "$RUNNER_TEMP/finding-readback.md"
          python - <<'PY'
          import json, os, pathlib, re
          text=(pathlib.Path(os.environ['RUNNER_TEMP'])/'finding-readback.md').read_text()
          data=json.loads(re.search(r'```json\n(.*?)\n```', text, re.S).group(1))
          statuses={r['id']:r['status'] for r in data if r['id'] in {'RF-1','RF-2','RF-3','RF-4'}}
          assert statuses=={'RF-1':'satisfied','RF-2':'satisfied','RF-3':'satisfied','RF-4':'satisfied'}, statuses
          assert next(r for r in data if r['id']=='RF-4')['disposition_evidence']
          PY
          decomp=$(gh api -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPO/issues/comments/$DECOMP_ID" --jq .body)
          grep -Fq $'### DD-2 — Late omitted-renewal-lineage attachment omitted from decomposition\nStatus: satisfied' <<<"$decomp"
          grep -Fq '## Implementation Closure — #317' <<<"$decomp"
          grep -Fq 'satisfied 2 (`ARCHSRC-1` / #316, `ARCHSRC-2` / #317); open 0' <<<"$decomp"
          coverage=$(gh api -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPO/issues/comments/$COVERAGE_ID" --jq .body)
          grep -Fq '## Architecture / Design Obligation Closure Projection — #317' <<<"$coverage"
          grep -Fq 'Architecture/design implementation obligations: 2 total; satisfied 2; open 0' <<<"$coverage"
          evidence_id=$(cat "$RUNNER_TEMP/closure-evidence-id.txt")
          evidence=$(gh api -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPO/issues/comments/$evidence_id" --jq .body)
          grep -Fq '<!-- ticket-317-closure-evidence:v1 -->' <<<"$evidence"
          grep -Fq "$PRODUCT_COMMIT" <<<"$evidence"

      - name: Close ticket 317
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' '{"state":"closed","state_reason":"completed"}' | gh api -X PATCH -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPO/issues/$TICKET" --input - >/dev/null
          test "$(gh api -H "X-GitHub-Api-Version: $API_VERSION" repos/$REPO/issues/$TICKET --jq .state)" = "closed"
          test "$(gh api -H "X-GitHub-Api-Version: $API_VERSION" repos/$REPO/issues/$TICKET --jq .state_reason)" = "completed"

      - name: Recover deterministic post-closure frontier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPO/issues/$REVIEW/sub_issues?per_page=100" > "$RUNNER_TEMP/frontier-pages.json"
          jq -c '[.[][] | select(.state == "open") | {number,title,url:.html_url}]' "$RUNNER_TEMP/frontier-pages.json" > "$RUNNER_TEMP/open-children.json"
          test "$(jq length "$RUNNER_TEMP/open-children.json")" = "0"

          gh api --paginate --slurp -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPO/issues/$TICKET/dependencies/blocking?per_page=100" > "$RUNNER_TEMP/dependents-pages.json"
          jq -c '[.[][] | select(.state == "open") | {number,title,url:.html_url,parent_issue_url}]' "$RUNNER_TEMP/dependents-pages.json" > "$RUNNER_TEMP/open-dependents.json"
          while read -r n; do
            [ -n "$n" ] || continue
            gh api --paginate --slurp -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPO/issues/$n/dependencies/blocked_by?per_page=100" > "$RUNNER_TEMP/dependent-$n-blockers.json"
            jq -c '[.[][] | select(.state == "open") | {number,title,url:.html_url}]' "$RUNNER_TEMP/dependent-$n-blockers.json" > "$RUNNER_TEMP/dependent-$n-open-blockers.json"
          done < <(jq -r '.[].number' "$RUNNER_TEMP/open-dependents.json")

          # All remediation children are closed and all review findings are satisfied; Parent Spec #279 is now ready for fresh integrated verify-spec.
          test "$(gh api -H "X-GitHub-Api-Version: $API_VERSION" repos/$REPO/issues/$SPEC --jq .state)" = "open"
          echo 'NEXT_SKILL=$verify-spec' >> "$GITHUB_ENV"

      - name: Remove all ticket 317 temporary transports from main
        run: |
          set -euo pipefail
          expected=$'.github/workflows/tmp-chatgpt-close-317.yml\n.github/workflows/tmp-chatgpt-implement-317-v2.yml\n.github/workflows/tmp-chatgpt-implement-317.yml\n.github/workflows/tmp-chatgpt-persist-317.yml\n.github/workflows/tmp-chatgpt-verify-317-v2.yml\n.github/workflows/tmp-chatgpt-verify-317.yml'
          actual=$(git diff --name-only "$CLEAN_MAIN_BASELINE" HEAD | sort)
          test "$actual" = "$expected"
          git config user.name "Bob Taylor"
          git config user.email "bobltaylorjr@gmail.com"
          git rm \
            .github/workflows/tmp-chatgpt-close-317.yml \
            .github/workflows/tmp-chatgpt-implement-317-v2.yml \
            .github/workflows/tmp-chatgpt-implement-317.yml \
            .github/workflows/tmp-chatgpt-persist-317.yml \
            .github/workflows/tmp-chatgpt-verify-317-v2.yml \
            .github/workflows/tmp-chatgpt-verify-317.yml
          git commit -m "chore(workflow): remove ticket 317 temporary transports"
          git push origin HEAD:main
          git diff --quiet "$CLEAN_MAIN_BASELINE" HEAD --
          echo "CLEANUP_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Update durable Session Ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence_id=$(cat "$RUNNER_TEMP/closure-evidence-id.txt")
          cat > "$RUNNER_TEMP/session-ledger.md" <<EOF
          <!-- polaris-chatgpt-session-ledger-state:v1 -->
          # Current Session Ledger

          **Version:** 1  
          **Generation:** 310  
          **Maintained at:** 2026-09-15 02:30 MDT

          ## Active Continuation Record

          **Active branch context:** \`spec-279\` at durable remote \`$PRODUCT_COMMIT\`.  
          **Active artifact:** Spec Review #310 — \`Spec Review: Implement Investment Decision application lifecycle and Decision Memory queries\`, remediation owner for Parent Spec #279.  
          **Workflow checkpoint:** \`$implement-ticket\` for #317 is fully **CLOSED**. The exact independently certified candidate was committed/pushed, ticket closure evidence was persisted, RF-4/DD-2/\`ARCHSRC-2\` was reconciled to satisfied, #317 was closed/completed, the deterministic post-closure frontier was recovered, and all temporary #317 transport workflows were removed from \`main\`.

          ### Closed Remediation Ticket #317

          **Ticket:** #317 — \`Attach omitted renewal lineage to existing Decisions\`  
          **URL:** https://github.com/sponge-b0b/Polaris/issues/317  
          **Mode:** remediation  
          **Decomposition lineage:** DD-2 / RF-4  
          **Architecture obligation:** \`ARCHSRC-2\`  
          **Ticket branch:** \`spec-279\`  
          **Ticket baseline:** \`$BASELINE\`  
          **Certified candidate state:** \`$CANDIDATE\`  
          **Persisted commit:** \`$PRODUCT_COMMIT\` — \`feat(application): attach omitted renewal lineage\`

          Attempt history:
          - Attempt 1 \`f75e44aa00a611bccd836ccb83041446a29aa1483d1424dc4cd4d651253955a2\` — fresh verifier FAIL: privileged command leaked through ordinary package API.
          - Attempt 2 \`$CANDIDATE\` — fresh independent \`$verify-ticket-closure\` PASS after restoring the privileged/internal boundary.

          Fresh Attempt-2 certification:
          - Actions run/job: \`34945673902\` / \`104304363228\`;
          - acceptance: 5/5 proven, violated 0, unproven 0, unchecked 0;
          - authority source units: 6/6 mapped, missing 0, ambiguous 0;
          - proof-plan composition seams: 9/9 dispositioned;
          - Certified Closure Domains: 4/4 closed;
          - architecture/decomposition obligations: 1 applicable, 1 covered, missing/ambiguous/misrouted 0;
          - independent actionable findings: 0.

          Durable #317 artifacts:
          - closure checkpoint / exact PASS: comment \`5676814349\`;
          - closure evidence: comment \`$evidence_id\`;
          - persisted product commit: \`$PRODUCT_COMMIT\`.

          ### Parent Spec Review / Coverage Reconciliation

          Finding Continuity Ledger on Spec Review #310:
          - RF-1: \`satisfied\` by #314;
          - RF-2: \`satisfied\` by #315;
          - RF-3: \`satisfied\` by #316;
          - RF-4: \`satisfied\` by #317.

          Decomposition state:
          - DD-1 / RF-3 / \`ARCHSRC-1\`: **satisfied** by #316;
          - DD-2 / RF-4 / \`ARCHSRC-2\`: **satisfied** by #317;
          - implementation obligations from decomposition defects: 2 total; satisfied 2; open 0.

          Parent Spec #279 Ticket Coverage Manifest implementation closure projection:
          - \`ARCHSRC-1\`: satisfied by #316;
          - \`ARCHSRC-2\`: satisfied by #317;
          - architecture/design implementation obligations: 2 total; satisfied 2; open 0; unmapped 0; ambiguous 0.

          All direct remediation children of Spec Review #310 are now closed. Spec Review #310 remains the durable review/remediation provenance artifact; child closure does not itself mark the review complete.

          ### Deterministic Post-Closure Frontier

          Native direct-child frontier for Spec Review #310: **0 open children**.  
          Parent Spec #279 is open and its implementation remediation set is closed.  
          **Next lifecycle:** fresh integrated \`$verify-spec\` for Parent Spec #279 at exact \`spec-279@$PRODUCT_COMMIT\`.  
          Do not run \`$spec-merge-cleanup\` before the required integrated verification/re-review lifecycle completes.

          ### Repository Transport Cleanup

          All temporary #317 implementation, correction, verification, persistence, and closure transport workflows were removed from \`main\`.  
          **Cleanup main commit:** \`$CLEANUP_COMMIT\` — \`chore(workflow): remove ticket 317 temporary transports\`.  
          **Clean-tree reference:** \`$CLEAN_MAIN_BASELINE\`.  
          Tree comparison between the clean-tree reference and cleanup commit is empty. All intervening #317 main commits are audit-only transport history and must not be merged into \`spec-279\`.

          ## Expected Next Transition

          \`$verify-spec - Spec: Implement Investment Decision application lifecycle and Decision Memory queries (https://github.com/sponge-b0b/Polaris/issues/279)\`

