name: Temporary ChatGPT harden verify-spec execution

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-chatgpt-harden-verify-spec.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    env:
      MAIN_BASELINE: 01c17e1484b0470593c0b072580ff89dbbee5b9c
      SPEC_BASELINE: c6a5955c944c72c01c052db743ef97d47b3a56f4
      EXPECTED_VERIFY_BLOB: 60f257d9c102eb8ec84ee685b5b4cd4b2d725b80
      EXPECTED_DEDUP_BLOB: b9f48d9c6db68c1650f57a69d911383c0689ae7c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Revalidate source state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main spec-279
          test "$(git rev-parse origin/main^)" = "$MAIN_BASELINE"
          test "$(git rev-parse origin/spec-279)" = "$SPEC_BASELINE"
          test "$(git rev-parse origin/main:.agents/skills/verify-spec/SKILL.md)" = "$EXPECTED_VERIFY_BLOB"
          test "$(git rev-parse origin/spec-279:.agents/skills/verify-spec/SKILL.md)" = "$EXPECTED_VERIFY_BLOB"
          test "$(git rev-parse origin/main:.agents/skills/deduplicate-code/SKILL.md)" = "$EXPECTED_DEDUP_BLOB"
          test "$(git rev-parse origin/spec-279:.agents/skills/deduplicate-code/SKILL.md)" = "$EXPECTED_DEDUP_BLOB"

      - name: Harden verify-spec and dedup integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          verify_path = Path('.agents/skills/verify-spec/SKILL.md')
          verify = verify_path.read_text()

          anchor = '''Parent-side substitute contract construction: 0
          ```

          ## Authorized Verification Scope and Repair Attribution
          '''
          assert verify.count(anchor) == 1, 'verify-spec bounded-execution anchor mismatch'

          bounded = '''Parent-side substitute contract construction: 0
          ```

          ## Bounded Execution, Mutation, and Durable Evidence Reuse

          This section is authoritative for execution order, repository mutation, and evidence recovery. It supersedes later wording that can be read as authorizing broad repository rediscovery before the candidate is stable.

          `$verify-spec` is a **bounded integration verification-and-repair workflow for one exact Spec candidate**, not a general repository audit or cleanup campaign. Spend work only on evidence that can change whether the active Spec candidate deserves PASS.

          ### Execution order

          Follow these phases sequentially:

          1. **Minimal preflight** — resolve the Spec, fixed baseline, Spec branch, exact current HEAD, clean/dirty state, direct native blockers/prerequisites, durable governance classification, current Ticket Coverage Manifest, and current remediation/closure state. Do not begin repository-wide audits here.
          2. **Repair-capable deterministic/delegated gates** — build the working Verification Scope Manifest from the Spec body, durable coverage state, change provenance, and directly affected consumers. Run applicable Python quality checks, acceptance tests, global deduplication, architecture invariants, and other explicitly applicable gates. Repair only failures authorized below.
          3. **Candidate stabilization** — rerun every invalidated gate after repair, commit/push verification-owned mutations through the normal branch workflow, and require one clean stable exact HEAD.
          4. **Fresh final contract build** — only after the repair-capable candidate is stable, dispatch one genuinely fresh `$spec-contract` builder for the exact final HEAD and wait for its terminal result. Do not run broad parent-side exploration in parallel with the builder.
          5. **Fresh semantic certification** — dispatch one fresh non-mutating `$verify-spec-closure` certifier against that exact final HEAD and exact final contract handoff.
          6. **Finalization** — persist the receipt only if all exact-HEAD bindings still match.

          Do **not** launch the fresh certification/finalization contract build before repair-capable gates merely to get an early handoff. An early exploratory build may be used only when an exact unresolved scope question cannot be answered from durable Spec/coverage authority; it is disposable and never substitutes for the mandatory final stable-HEAD build.

          Any repository mutation after the final contract build invalidates that handoff for certification. Return to candidate stabilization, rerun invalidated gates, and perform a new fresh final build.

          ### Parent mutation authority

          `$verify-spec` itself is intentionally mutating when repair is warranted. Read-only behavior applies to the fresh `$verify-spec-closure` certifier, not to the parent workflow.

          The parent must repair a required-gate failure when it is either:

          * `spec-relevant` under **Failure causality and repair authority**; or
          * explicitly repairable under an applicable delegated repository-wide gate such as architecture or deduplication.

          Repairs may touch unchanged/non-Spec files when the leanest correct fix must consume or establish an existing shared owner across a boundary. Path ownership does not override causal repair authority.

          After every repair:

          * rerun all checks invalidated by that repair;
          * preserve the original failure/disposition evidence;
          * require a clean worktree and one exact candidate HEAD before final contract construction;
          * treat all earlier exact-HEAD semantic certification as stale.

          ### Durable evidence reuse

          Reuse durable lifecycle records instead of reconstructing already-closed work from scratch.

          Prefer, in order:

          * the parent Spec `Ticket Coverage Manifest` and Architecture/Design Obligation mappings;
          * passing ticket/spec closure checkpoints and receipts bound to exact candidate identities;
          * Finding Continuity and Decomposition Defect records;
          * native issue state/parent/dependency metadata;
          * current Workspace Metadata / explicit governance classification.

          For a closed implementation/remediation ticket, normally validate only the ticket identity/state, required parent/dependency relation, closure-record identity, and exact persisted commit/candidate binding. Do **not** reread every ticket body, every ticket comment, or reconstruct the ticket's full proof unless a durable record is missing, stale, internally inconsistent, or the integrated certifier needs an exact unresolved acceptance detail.

          Closed ticket certification is evidence input, not a substitute for integrated Spec certification. `$verify-spec-closure` still proves composition and entailment against the exact final Spec HEAD; it should consume concise closure evidence pointers rather than force the parent to reproduce each ticket investigation.

          ### Governance discovery bound

          Resolve governance from durable local lifecycle evidence first.

          * If current Workspace Metadata or another authoritative current Spec record explicitly classifies the Spec as `Independent`, and no current `wayfinder-source`, `wayfinder-remediation`, native parent, or conflicting governance marker invalidates that classification, accept it. Do not enumerate every Wayfinder or scan unrelated Wayfinder comment histories merely to prove absence.
          * Enumerate/reconcile governing Wayfinders only when the Spec is positively Wayfinder-managed or durable governance evidence is missing, stale, or conflicting.

          ### Wiki applicability bound

          Living Entity Wiki verification is applicable only when the active Spec changes wiki knowledge/source authority, changes a source that the current wiki is required to synchronize, or carries an explicit wiki obligation under the routing rules.

          Do not run a repository-wide wiki audit merely to discover whether wiki routing applies. Determine applicability from the Spec/change-impact universe and durable routing authority first. Incidental baseline-identical wiki drift observed by another check is `non-spec` for this invocation unless the active Spec causally owns it.

          ### Evidence-driven expansion

          Broad discovery is a fallback for unresolved evidence, not the default proof strategy. In particular, do not by default:

          * fetch every closed ticket body/comment history when durable closure records already bind the implementation;
          * enumerate every Wayfinder to reconfirm an explicit Independent classification;
          * reconstruct accepted architecture prose already represented by exact current architecture authority/manifest mappings;
          * audit unrelated artifact classes solely because a tool exists for them.

          Expand only the unresolved evidence domain, record why expansion was required, and return to the bounded phase sequence above.

          ## Authorized Verification Scope and Repair Attribution
          '''
          verify = verify.replace(anchor, bounded)

          start = verify.index('### Delegated repository-wide deduplication exception')
          end = verify.index('### Delegated repository-wide architecture invariant exception')
          dedup_section = '''### Delegated repository-wide deduplication exception

          Deduplication detection remains **whole-repository** whenever this gate is applicable. Duplication is relational: new Spec code can duplicate unchanged code anywhere else in the repository, so changed-file or Spec-only scanning is forbidden.

          Invoke `$deduplicate-code` in its `spec-differential` integration mode with the fixed `BASELINE_COMMIT` and exact candidate HEAD.

          The child must scan the normal configured repository scope globally for both Arid and JSCPD, then classify candidate findings against the fixed Spec baseline as exactly one of:

          ```text
          candidate-introduced
          candidate-expanded
          baseline-identical
          unresolved
          ```

          Rules:

          * `candidate-introduced` includes a new duplicate relation between changed/new Spec code and unchanged code elsewhere in the repository. Cross-boundary duplication is still candidate-caused.
          * `candidate-expanded` means pre-existing duplicate debt gained a new occurrence, larger matching region, new semantic coupling, or newly invalid suppression because of the candidate.
          * `baseline-identical` means the same duplicate relation and material occurrence set existed at the fixed baseline and was not expanded or made newly actionable by the candidate. It is durable inherited debt for this Spec invocation, not opportunistic cleanup authority.
          * `unresolved` blocks PASS.

          Candidate-introduced and candidate-expanded findings must be consolidated or narrowly/justifiably suppressed under `$deduplicate-code` rules. The correct repair may touch unchanged or otherwise non-Spec files when that is necessary to consume or establish the real shared owner.

          Baseline-identical findings remain visible in the dedup evidence summary but do not enter the `$verify-spec` repair loop merely to make historical repository debt disappear. Do not semantically re-investigate every baseline-identical group once machine correlation has established unchanged identity unless the candidate changes detector configuration, suppression state, or another fact that invalidates the comparison.

          The final Spec dedup gate requires:

          ```text
          candidate-introduced findings: 0
          candidate-expanded findings: 0
          unresolved causality: 0
          stale/newly-invalid suppressions attributable to candidate: 0
          scanner operational/source-processing errors: 0
          ```

          This changes **repair attribution**, not scan scope. Both scanners still run globally after every dedup repair. Repository-wide deduplication repair does not broaden Ruff, Mypy, Pytest, acceptance-test, or unrelated cleanup authority.

          If deduplication mutates the repository, treat those mutations as verification-owned changes for branch/candidate/commit handling. Any prior exact-HEAD semantic certification or final contract handoff becomes stale.
          '''
          verify = verify[:start] + dedup_section + '\n\n' + verify[end:]

          old_wiki = 'Invoke the `$wiki-lint` skill when Living Entity Wiki routing applies. Invoke the `$deduplicate-code` skill only when Spec-owned/Mixed work creates a real duplicate-implementation risk; when invoked, both Arid and JSCPD must be visible.'
          new_wiki = 'Invoke the `$wiki-lint` skill only after the bounded Wiki applicability rule above proves Living Entity Wiki routing applies; do not run a whole-wiki discovery audit merely to decide applicability. Invoke the `$deduplicate-code` skill only when Spec-owned/Mixed work creates a real duplicate-implementation risk; when invoked, use its `spec-differential` integration mode and keep both Arid and JSCPD whole-repository scans visible.'
          assert verify.count(old_wiki) == 1, 'verify-spec wiki/dedup invocation anchor mismatch'
          verify = verify.replace(old_wiki, new_wiki)

          governance_anchor = 'For a Wayfinder-managed Spec, before substantive verification:\n'
          governance_prefix = '''Resolve whether the Spec is Wayfinder-managed from durable current governance evidence before performing discovery. An explicit current `Independent` classification is sufficient unless contradicted by a current governance marker or native relationship; absence of a contradiction does not require an all-Wayfinder scan.\n\n'''
          assert verify.count(governance_anchor) == 1, 'verify-spec Wayfinder anchor mismatch'
          verify = verify.replace(governance_anchor, governance_prefix + governance_anchor)

          verify_path.write_text(verify)

          dedup_path = Path('.agents/skills/deduplicate-code/SKILL.md')
          dedup = dedup_path.read_text()
          assert '  version: 2.0.0' in dedup
          dedup = dedup.replace('  version: 2.0.0', '  version: 2.1.0', 1)

          old_delegate = '''When this skill is delegated by another lifecycle or verification skill, **this skill owns the repository-wide duplication gate and the narrowly bounded repository repairs required to make that gate pass**, even when a finding is outside the parent's semantic change scope. This authority is limited to duplicate-code consolidation or justified suppression under this skill; it does not authorize unrelated cleanup.
          '''
          new_delegate = '''When this skill is delegated by another lifecycle or verification skill, the parent-supplied integration mode controls **repair attribution**, never scanner scope. Default mode retains the repository-wide zero-finding invariant. `$verify-spec` uses the `spec-differential` mode below so candidate-caused duplication is repaired globally without turning Spec verification into unrelated historical cleanup. Repair authority remains limited to duplicate-code consolidation or justified suppression under this skill; it does not authorize unrelated cleanup.
          '''
          assert dedup.count(old_delegate) == 1, 'dedup delegation anchor mismatch'
          dedup = dedup.replace(old_delegate, new_delegate)

          zero_anchor = '### Zero-Finding Invariant\n\nA successful run requires all of the following:\n'
          integration = '''## Verification Integration Mode: `spec-differential`

          When `$verify-spec` delegates this skill, it must supply the fixed Spec `BASELINE_COMMIT` and exact candidate HEAD and invoke `spec-differential` mode.

          This mode preserves **Whole-Repository Scope**. Both Arid and JSCPD still scan their normal configured repository scope for the candidate. The baseline is used only to determine whether a reported relation is caused or expanded by the active Spec candidate.

          Use an isolated read-only baseline worktree/ref and correlate machine-readable scanner results before performing semantic source inspection. Classify each candidate finding as exactly one of:

          ```text
          candidate-introduced
          candidate-expanded
          baseline-identical
          unresolved
          ```

          Classification rules:

          * **candidate-introduced** — the duplicate relation is absent at baseline. This includes changed/new candidate code duplicating an unchanged implementation elsewhere.
          * **candidate-expanded** — the relation existed at baseline but the candidate adds an occurrence, materially enlarges the duplicated region, creates new shared-authority coupling, or makes an existing suppression stale/invalid.
          * **baseline-identical** — the material occurrence set and duplicate relation are unchanged from baseline and the candidate does not alter their detector/suppression semantics.
          * **unresolved** — causality cannot be established safely; blocks PASS.

          If Arid/JSCPD configuration or suppression policy changed between baseline and candidate, that delta is candidate-caused and must be inspected explicitly. Do not classify a visibility change as `baseline-identical` merely because the source block itself predates the candidate.

          Only `candidate-introduced` and `candidate-expanded` findings enter the repair loop. Repair them using the normal consolidation/suppression rules, even when the correct repair touches an unchanged/non-Spec file to establish the real shared owner.

          `baseline-identical` findings remain in the evidence summary as inherited repository debt and do not authorize opportunistic cleanup during `$verify-spec`. Once exact baseline correlation establishes unchanged identity, do not repeatedly perform semantic source analysis for every inherited group unless another candidate change invalidates that correlation.

          The `spec-differential` terminal invariant is:

          ```text
          Candidate-introduced duplicate findings: 0
          Candidate-expanded duplicate findings: 0
          Unresolved causality classifications: 0
          Candidate-attributable stale/invalid suppressions: 0
          Arid operational/source-processing errors: 0
          JSCPD operational errors: 0
          Actionable competing implementations introduced/expanded by candidate: 0
          ```

          Baseline-identical findings may remain nonzero in this mode. That is not a narrowed scan; it is a bounded repair disposition for this parent lifecycle.

          ### Zero-Finding Invariant

          In standalone/default mode, a successful run requires all of the following:
          '''
          assert dedup.count(zero_anchor) == 1, 'dedup zero-finding anchor mismatch'
          dedup = dedup.replace(zero_anchor, integration)

          old_loop = '''Run the whole-repository scans, inspect the actual matching source, and disposition every reported finding as exactly one of:

          ```text
          consolidate
          suppress
          unresolved
          ```

          Then apply all safe repairs, rerun invalidated verification when executable behavior changed, and rerun both repository-wide scanners. Repeat until both scanners are clean or a concrete blocker makes further safe repair impossible.

          `unresolved` blocks PASS.
          '''
          new_loop = '''Run the whole-repository scans and inspect actual matching source where repair/classification requires it.

          In standalone/default mode, disposition every reported finding as exactly one of:

          ```text
          consolidate
          suppress
          unresolved
          ```

          In `spec-differential` mode, perform baseline causality classification first. Only `candidate-introduced` and `candidate-expanded` findings then receive `consolidate | suppress | unresolved`; `baseline-identical` is a terminal inherited disposition for this invocation and does not enter the repair loop.

          Apply all authorized repairs, rerun invalidated verification when executable behavior changed, and rerun both repository-wide candidate scanners. Repeat until the active mode's terminal invariant is satisfied or a concrete blocker makes further safe repair impossible.

          `unresolved` blocks PASS in every mode.
          '''
          assert dedup.count(old_loop) == 1, 'dedup repair-loop anchor mismatch'
          dedup = dedup.replace(old_loop, new_loop)

          old_post = '''3. rerun JSCPD across the repository;
          4. inspect any remaining findings against actual source rather than assuming they share the previous disposition;
          5. continue until the Zero-Finding Invariant is satisfied.
          '''
          new_post = '''3. rerun JSCPD across the repository;
          4. in default mode, inspect remaining findings normally; in `spec-differential` mode, reuse exact baseline-identical correlations unless a repair/configuration/suppression change invalidated them;
          5. continue until the active mode's terminal invariant is satisfied.
          '''
          assert dedup.count(old_post) == 1, 'dedup post-repair anchor mismatch'
          dedup = dedup.replace(old_post, new_post)

          old_final = 'The final successful native exit status for both tools must be zero.\n'
          new_final = '''In standalone/default mode, the final successful native exit status for both tools must be zero. In `spec-differential` mode, a scanner may still report only machine-correlated `baseline-identical` findings; the differential wrapper/classification must prove candidate-introduced `0`, candidate-expanded `0`, unresolved `0`, candidate-attributable stale/invalid suppressions `0`, and operational errors `0`.\n'''
          assert dedup.count(old_final) == 1, 'dedup final-status anchor mismatch'
          dedup = dedup.replace(old_final, new_final)

          dedup_path.write_text(dedup)
          PY

          git diff --check
          grep -Fq '## Bounded Execution, Mutation, and Durable Evidence Reuse' .agents/skills/verify-spec/SKILL.md
          grep -Fq 'spec-differential' .agents/skills/verify-spec/SKILL.md
          grep -Fq '## Verification Integration Mode: `spec-differential`' .agents/skills/deduplicate-code/SKILL.md
          grep -Fq 'version: 2.1.0' .agents/skills/deduplicate-code/SKILL.md

      - name: Commit main-owned authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Bob Taylor'
          git config user.email 'bobltaylorjr@gmail.com'
          git add .agents/skills/verify-spec/SKILL.md .agents/skills/deduplicate-code/SKILL.md
          git commit -m 'fix(skills): bound spec verification work'
          git push origin HEAD:main
          echo "AUTHORITY_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Propagate authority to active Spec branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main spec-279
          git checkout -B spec-279 origin/spec-279
          test "$(git rev-parse HEAD)" = "$SPEC_BASELINE"
          git checkout "$AUTHORITY_COMMIT" -- .agents/skills/verify-spec/SKILL.md .agents/skills/deduplicate-code/SKILL.md
          git diff --check
          git add .agents/skills/verify-spec/SKILL.md .agents/skills/deduplicate-code/SKILL.md
          git commit -m 'chore(skills): sync bounded spec verification'
          git push origin HEAD:spec-279
          echo "SPEC_SYNC_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate synchronized authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main spec-279
          test "$(git rev-parse origin/main:.agents/skills/verify-spec/SKILL.md)" = "$(git rev-parse origin/spec-279:.agents/skills/verify-spec/SKILL.md)"
          test "$(git rev-parse origin/main:.agents/skills/deduplicate-code/SKILL.md)" = "$(git rev-parse origin/spec-279:.agents/skills/deduplicate-code/SKILL.md)"
          test "$(git rev-parse origin/spec-279)" = "$SPEC_SYNC_COMMIT"

      - name: Remove temporary transport and temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          git rm .github/workflows/tmp-chatgpt-harden-verify-spec.yml
          git commit -m 'chore(workflow): remove verify-spec hardening transport'
          git push origin HEAD:main
          git push origin --delete tmp-verify-spec-hardening || true
          echo "CLEANUP_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Final readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main spec-279
          test "$(git rev-parse origin/main)" = "$CLEANUP_COMMIT"
          test "$(git rev-parse origin/spec-279)" = "$SPEC_SYNC_COMMIT"
          test "$(git rev-parse origin/main:.agents/skills/verify-spec/SKILL.md)" = "$(git rev-parse origin/spec-279:.agents/skills/verify-spec/SKILL.md)"
          test "$(git rev-parse origin/main:.agents/skills/deduplicate-code/SKILL.md)" = "$(git rev-parse origin/spec-279:.agents/skills/deduplicate-code/SKILL.md)"
          test "$(git diff --name-only "$MAIN_BASELINE" origin/main | sort)" = $'.agents/skills/deduplicate-code/SKILL.md\n.agents/skills/verify-spec/SKILL.md'
          printf 'AUTHORITY_COMMIT=%s\nSPEC_SYNC_COMMIT=%s\nCLEANUP_COMMIT=%s\n' "$AUTHORITY_COMMIT" "$SPEC_SYNC_COMMIT" "$CLEANUP_COMMIT"
