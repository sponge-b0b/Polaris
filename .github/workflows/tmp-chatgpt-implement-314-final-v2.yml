name: Temporary ChatGPT ticket 314 final verification v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-chatgpt-implement-314-final-v2.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout transport
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout exact ticket baseline
        uses: actions/checkout@v4
        with:
          ref: 9081386b8fcbf65e117fdac6c7b8c776edaef8f0
          path: candidate
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Reconstruct candidate
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
        run: |
          python .github/tmp/implement_314_candidate.py
          python .github/tmp/implement_314_refactor.py

      - name: Run complete frozen-candidate verification
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          EVIDENCE_ROOT: ${{ runner.temp }}/ticket-314-final-v2
        run: python .github/tmp/verify_314_final.py

      - name: Upload final verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticket-314-final-verification-v2
          path: ${{ runner.temp }}/ticket-314-final-v2
          retention-days: 7
