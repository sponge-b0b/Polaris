name: Temporary ChatGPT ticket 316 semantic identity finalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-chatgpt-implement-316-v4.yml'

permissions:
  contents: read
  copilot-requests: write
  issues: read

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: transport
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: e243c2c50b0d2a2ed4ee539f040fed53597a402f
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - run: npm install --global @github/copilot

      - name: Implement final semantic candidate
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AUTO_UPDATE: 'false'
          COPILOT_MCP_TOOL_CACHE: 'false'
        run: |
          cat > "$RUNNER_TEMP/prompt.txt" <<'PROMPT'
          Implement Polaris ticket #316 from exact baseline e243c2c50b0d2a2ed4ee539f040fed53597a402f. Modify this checkout only; do not commit/push/mutate GitHub. Read AGENTS.md and ARCHSRC-1 authority (application §§12–14,17; relationship model §§5.4,6.1–6.3; durable persistence §§5,8) plus current application/domain/store tests.

          Build the privileged one-or-more atomic correction SET. The domain `apply_relationship_command` already owns complete final-history interpretation, mixed-lineage temporal graph validation, touched/version effects, and protection requirements; application must coordinate the entire set and existing persistence must atomically revalidate/commit it.

          Required representation:
          - use an opaque request-local member identity only to resolve same-command ancestry before fresh durable fact IDs exist;
          - targets can be an existing durable relationship fact ID or another request-local member;
          - allocate all durable IDs before constructing facts, so same-command ancestry is order independent;
          - sibling corrections targeting the same fact are valid and independent; do NOT reject them merely for sharing a target;
          - reject duplicate local IDs, missing local targets, self-targets, and local ancestry cycles;
          - preserve legacy one-correction service call as one-element compatibility.

          CRITICAL semantic-identity rule: request-local member IDs are NON-SEMANTIC implementation handles. They must NOT affect persisted semantic request equality/idempotency. Two commands with the same correction graph/content but different local member names and/or different input tuple order are the SAME semantic request and must replay for the same OperationId. Conversely, changing a correction's target/ancestry, effect, times, correction basis, replacement claim/basis, or set cardinality is a different request and must conflict. Do not use generated durable correction fact IDs in semantic request identity either.

          Solve this by building a canonical semantic correction-set payload for `_request` that normalizes away request-local names while preserving the complete directed correction ancestry graph. The canonical representation should be deterministic, order independent, and reject truly duplicate indistinguishable semantic members if necessary to make a mathematical set unambiguous. Avoid clever generic graph frameworks; keep it local to this privileged command.

          Expected-version coverage must equal all directly touched existing endpoints resolved from the complete correction graph. Existing domain/store protection/revalidation must still protect non-endpoint path/future/history/absence predicates; do not duplicate that logic. Pass the constructed corrections to `apply_relationship_command` once, never prefix-by-prefix. Result fact ID ordering may be canonical but must not derive semantic precedence from caller order.

          Deterministic tests must cover at least:
          1 multi-correction atomic success;
          2 invalid member rollback;
          3 same semantic set reordered replays;
          4 same semantic graph with ALL request-local member IDs renamed replays;
          5 changed ancestry or content conflicts;
          6 same-command child targeting another member works independent of input order;
          7 sibling corrections sharing one target are accepted/preserve independent semantics;
          8 invalid local ancestry missing/self/cycle fails before commit;
          9 complete endpoint expected-version enforcement;
          10 once-only DecisionVersion effects and unchanged DecisionLifecycleSequence;
          11 existing recursive restoration/contest, definite/possible cycles, stale revalidation/persistence, renewal/Supersession, and single-member paths remain green via the full suite.

          Keep changes lean and localized. No docs/policy/workflow edits, no broad exception catch, no domain identity for the request-local handle. If authority genuinely leaves a material product/domain/persistence choice unresolved, print `DESIGN GAP:` and stop without edits. Otherwise run Ruff, mypy, full pytest. End with IMPLEMENTATION COMPLETE.
          PROMPT
          copilot -s --allow-all-tools --no-custom-instructions --disable-builtin-mcps --no-ask-user --no-remote --no-remote-export < "$RUNNER_TEMP/prompt.txt" | tee "$RUNNER_TEMP/copilot-output.txt"
          ! grep -q '^DESIGN GAP:' "$RUNNER_TEMP/copilot-output.txt"

      - name: Verify candidate
        working-directory: candidate
        env:
          UV_CACHE_DIR: /tmp/uv-cache
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e243c2c50b0d2a2ed4ee539f040fed53597a402f
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --check e243c2c50b0d2a2ed4ee539f040fed53597a402f
          mapfile -t pyfiles < <(git diff --name-only e243c2c50b0d2a2ed4ee539f040fed53597a402f -- '*.py')
          test ${#pyfiles[@]} -gt 0
          uv run --locked ruff check --fix "${pyfiles[@]}"
          uv run --locked ruff format "${pyfiles[@]}"
          uv run --locked ruff check "${pyfiles[@]}"
          uv run --locked ruff format --check "${pyfiles[@]}"
          uv run --locked mypy --explicit-package-bases "${pyfiles[@]}"
          uv run --locked pytest -q
          POLARIS_BROAD_VERIFY_AUTHORIZED=verify-architecture uv run --locked pytest -q tests/test_architecture_guard.py tests/test_architecture_guard_identity_aliases.py tests/test_architecture_guard_legacy_loaders.py

      - name: Freeze candidate
        working-directory: candidate
        env:
          TICKET_BASELINE: e243c2c50b0d2a2ed4ee539f040fed53597a402f
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ticket-316-candidate-v4"; mkdir -p "$root"
          git diff --no-renames --binary "$TICKET_BASELINE" -- > "$root/candidate.patch"
          git diff --no-renames --name-only "$TICKET_BASELINE" -- > "$root/changed-files.txt"
          git diff --stat "$TICKET_BASELINE" -- > "$root/diff-stat.txt"
          cp "$RUNNER_TEMP/copilot-output.txt" "$root/copilot-output.txt"
          python - <<'PY' > "$root/candidate-state.txt"
          import hashlib, os, stat, subprocess
          baseline=os.environ['TICKET_BASELINE']
          def zpaths(*args):
              out=subprocess.run(['git',*args],check=True,stdout=subprocess.PIPE).stdout
              return [p for p in out.split(b'\0') if p]
          paths=set(zpaths('diff','--no-renames','--name-only','-z',baseline,'--')); paths.update(zpaths('ls-files','--others','--exclude-standard','-z'))
          d=hashlib.sha256()
          for raw in sorted(paths):
              path=os.fsdecode(raw); d.update(b'path\0'+raw+b'\0')
              try: meta=os.lstat(path)
              except FileNotFoundError: d.update(b'state\0DELETED\0'); continue
              if stat.S_ISLNK(meta.st_mode): mode=b'120000'; content=hashlib.sha256(os.fsencode(os.readlink(path))).hexdigest()
              elif stat.S_ISREG(meta.st_mode):
                  mode=b'100755' if meta.st_mode & stat.S_IXUSR else b'100644'; h=hashlib.sha256()
                  with open(path,'rb') as f:
                      for chunk in iter(lambda: f.read(1024*1024),b''): h.update(chunk)
                  content=h.hexdigest()
              else: raise SystemExit(path)
              d.update(b'mode\0'+mode+b'\0sha256\0'+content.encode()+b'\0')
          print(d.hexdigest())
          PY
          echo "CANDIDATE_STATE=$(cat "$root/candidate-state.txt")"
      - uses: actions/upload-artifact@v4
        with:
          name: ticket-316-candidate-v4
          path: ${{ runner.temp }}/ticket-316-candidate-v4
          retention-days: 7
