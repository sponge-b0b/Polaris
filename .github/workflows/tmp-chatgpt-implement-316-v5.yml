name: Temporary ChatGPT ticket 316 final candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-chatgpt-implement-316-v5.yml'

permissions:
  contents: read
  copilot-requests: write
  issues: read

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: transport
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: e243c2c50b0d2a2ed4ee539f040fed53597a402f
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - run: npm install --global @github/copilot

      - name: Implement final candidate
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AUTO_UPDATE: 'false'
          COPILOT_MCP_TOOL_CACHE: 'false'
        run: |
          cat > "$RUNNER_TEMP/prompt.txt" <<'PROMPT'
          Implement Polaris ticket #316 from exact baseline e243c2c50b0d2a2ed4ee539f040fed53597a402f. Modify checkout only; no commit/push/GitHub mutation. Read AGENTS.md and ARCHSRC-1 authority before editing.

          Use the semantically correct design:
          - privileged non-empty atomic correction set;
          - request-local opaque handles only for same-command ancestry resolution;
          - handles and input order are non-semantic and normalized out of idempotency identity;
          - target may be existing durable fact or another set member; all durable correction fact IDs allocated before construction;
          - sibling corrections may share targets; reject duplicate local IDs, missing/self/cyclic local ancestry, and truly indistinguishable duplicate semantic members;
          - canonical payload preserves full ancestry graph/content/cardinality independent of local names, list order, and generated UUIDs;
          - complete exact expected-version coverage for all directly touched existing endpoints;
          - one call to existing domain apply_relationship_command with whole constructed set; existing domain/store own final-history graph validation, version effects, and non-endpoint/future/path/absence revalidation;
          - atomic commit/receipt or none, one DecisionVersion increment max, no DecisionLifecycleSequence mutation.

          CRITICAL PRESERVATION FALSIFIER FROM PRIOR DISPOSABLE DRAFT: the pre-ticket singular `CorrectDecisionRelationshipCommand` has an established persisted semantic request/receipt shape (`RelationshipCorrectionPayload`). Exact same-operation replay of a legacy singular command after this change MUST still match its pre-ticket receipt. Do NOT simply route singular `correct()` through a batch `_request` that changes its semantic request to a set payload. Preserve `_request(CorrectDecisionRelationshipCommand)` for the singular entry point while sharing the execution machinery internally. New set commands use the canonical set payload. This is required by the ticket's single-target compatibility + idempotency preservation.

          Add/retain focused tests proving:
          1 atomic multi-correction success;
          2 invalid member rollback/no partial receipt/history;
          3 reorder + rename of local handles replays same set request;
          4 changed content OR changed same-command ancestry conflicts;
          5 same-command child works independent of tuple order;
          6 sibling corrections sharing a target preserve independent/contested interpretation, not merely raw append count;
          7 invalid local target/self/cycle rejection;
          8 exact endpoint expected-version coverage: missing or extra touched-endpoint guard rejects before commit;
          9 each Decision advances version at most once for a multi-member command and lifecycle sequence is unchanged;
          10 singular exact replay preserves the pre-existing `RelationshipCorrectionPayload` receipt identity and behavior;
          11 full existing suite still covers recursive restoration/contest, definite/possible cycles, stale revalidation/persistence, renewal/Supersession, and single-member paths.

          Keep changes localized and lean. No docs/policy/workflow edits, no broad catch, no domain identity/framework for local handles. If a genuine material design gap remains, print DESIGN GAP and stop. Otherwise run Ruff, mypy, full pytest and end IMPLEMENTATION COMPLETE.
          PROMPT
          copilot -s --allow-all-tools --no-custom-instructions --disable-builtin-mcps --no-ask-user --no-remote --no-remote-export < "$RUNNER_TEMP/prompt.txt" | tee "$RUNNER_TEMP/copilot-output.txt"
          ! grep -q '^DESIGN GAP' "$RUNNER_TEMP/copilot-output.txt"

      - name: Verify final candidate
        working-directory: candidate
        env:
          UV_CACHE_DIR: /tmp/uv-cache
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e243c2c50b0d2a2ed4ee539f040fed53597a402f
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --check e243c2c50b0d2a2ed4ee539f040fed53597a402f
          mapfile -t pyfiles < <(git diff --name-only e243c2c50b0d2a2ed4ee539f040fed53597a402f -- '*.py')
          test ${#pyfiles[@]} -gt 0
          uv run --locked ruff check --fix "${pyfiles[@]}"
          uv run --locked ruff format "${pyfiles[@]}"
          uv run --locked ruff check "${pyfiles[@]}"
          uv run --locked ruff format --check "${pyfiles[@]}"
          uv run --locked mypy --explicit-package-bases "${pyfiles[@]}"
          uv run --locked pytest -q
          POLARIS_BROAD_VERIFY_AUTHORIZED=verify-architecture uv run --locked pytest -q tests/test_architecture_guard.py tests/test_architecture_guard_identity_aliases.py tests/test_architecture_guard_legacy_loaders.py

      - name: Freeze final candidate
        working-directory: candidate
        env:
          TICKET_BASELINE: e243c2c50b0d2a2ed4ee539f040fed53597a402f
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ticket-316-final"; mkdir -p "$root"
          git diff --no-renames --binary "$TICKET_BASELINE" -- > "$root/candidate.patch"
          git diff --no-renames --name-only "$TICKET_BASELINE" -- > "$root/changed-files.txt"
          git diff --stat "$TICKET_BASELINE" -- > "$root/diff-stat.txt"
          cp "$RUNNER_TEMP/copilot-output.txt" "$root/copilot-output.txt"
          python - <<'PY' > "$root/candidate-state.txt"
          import hashlib, os, stat, subprocess
          baseline=os.environ['TICKET_BASELINE']
          def zpaths(*args):
              out=subprocess.run(['git',*args],check=True,stdout=subprocess.PIPE).stdout
              return [p for p in out.split(b'\0') if p]
          paths=set(zpaths('diff','--no-renames','--name-only','-z',baseline,'--')); paths.update(zpaths('ls-files','--others','--exclude-standard','-z'))
          d=hashlib.sha256()
          for raw in sorted(paths):
              path=os.fsdecode(raw); d.update(b'path\0'+raw+b'\0')
              try: meta=os.lstat(path)
              except FileNotFoundError: d.update(b'state\0DELETED\0'); continue
              if stat.S_ISLNK(meta.st_mode): mode=b'120000'; content=hashlib.sha256(os.fsencode(os.readlink(path))).hexdigest()
              elif stat.S_ISREG(meta.st_mode):
                  mode=b'100755' if meta.st_mode & stat.S_IXUSR else b'100644'; h=hashlib.sha256()
                  with open(path,'rb') as f:
                      for chunk in iter(lambda: f.read(1024*1024),b''): h.update(chunk)
                  content=h.hexdigest()
              else: raise SystemExit(path)
              d.update(b'mode\0'+mode+b'\0sha256\0'+content.encode()+b'\0')
          print(d.hexdigest())
          PY
          echo "CANDIDATE_STATE=$(cat "$root/candidate-state.txt")"
      - uses: actions/upload-artifact@v4
        with:
          name: ticket-316-final
          path: ${{ runner.temp }}/ticket-316-final
          retention-days: 7
