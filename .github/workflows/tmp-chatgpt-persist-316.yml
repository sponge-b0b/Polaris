name: Temporary ChatGPT persist ticket 316 candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-chatgpt-persist-316.yml'

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec-279
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v6

      - name: Restore exact certified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TICKET_BASELINE: e243c2c50b0d2a2ed4ee539f040fed53597a402f
          CERTIFIED_STATE: 9e7248f3a868957fb660e4ade4367b9b7c0649ac75ff22e5e264728b85b9ffa9
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = spec-279
          test "$(git rev-parse HEAD)" = "$TICKET_BASELINE"
          test "$(git rev-parse origin/spec-279)" = "$TICKET_BASELINE"
          gh api repos/sponge-b0b/Polaris/actions/artifacts/10385655150/zip > "$RUNNER_TEMP/candidate.zip"
          unzip -q "$RUNNER_TEMP/candidate.zip" -d "$RUNNER_TEMP/ticket316"
          test "$(cat "$RUNNER_TEMP/ticket316/candidate-state.txt")" = "$CERTIFIED_STATE"
          git apply "$RUNNER_TEMP/ticket316/candidate.patch"
          test "$(git diff --name-only "$TICKET_BASELINE" -- | sort)" = $'src/polaris/application/decisions/relationships.py\ntests/application/decisions/test_relationships.py'
          state=$(python - <<'PY'
          import hashlib, os, stat, subprocess
          baseline=os.environ['TICKET_BASELINE']
          def zpaths(*args):
              out=subprocess.run(['git',*args],check=True,stdout=subprocess.PIPE).stdout
              return [p for p in out.split(b'\0') if p]
          paths=set(zpaths('diff','--no-renames','--name-only','-z',baseline,'--')); paths.update(zpaths('ls-files','--others','--exclude-standard','-z'))
          d=hashlib.sha256()
          for raw in sorted(paths):
              path=os.fsdecode(raw); d.update(b'path\0'+raw+b'\0')
              try: meta=os.lstat(path)
              except FileNotFoundError: d.update(b'state\0DELETED\0'); continue
              if stat.S_ISLNK(meta.st_mode): mode=b'120000'; content=hashlib.sha256(os.fsencode(os.readlink(path))).hexdigest()
              elif stat.S_ISREG(meta.st_mode):
                  mode=b'100755' if meta.st_mode & stat.S_IXUSR else b'100644'; h=hashlib.sha256()
                  with open(path,'rb') as f:
                      for chunk in iter(lambda: f.read(1024*1024),b''): h.update(chunk)
                  content=h.hexdigest()
              else: raise SystemExit(path)
              d.update(b'mode\0'+mode+b'\0sha256\0'+content.encode()+b'\0')
          print(d.hexdigest())
          PY
          )
          test "$state" = "$CERTIFIED_STATE"
          git diff --check "$TICKET_BASELINE"

      - name: Re-verify certified state before persistence
        run: |
          set -euo pipefail
          mapfile -t pyfiles < <(git diff --name-only e243c2c50b0d2a2ed4ee539f040fed53597a402f -- '*.py')
          uv run --locked ruff check "${pyfiles[@]}"
          uv run --locked ruff format --check "${pyfiles[@]}"
          uv run --locked mypy --explicit-package-bases "${pyfiles[@]}"
          uv run --locked pytest -q
          POLARIS_BROAD_VERIFY_AUTHORIZED=verify-architecture uv run --locked pytest -q tests/test_architecture_guard.py tests/test_architecture_guard_identity_aliases.py tests/test_architecture_guard_legacy_loaders.py

      - name: Commit and push exact candidate
        env:
          TICKET_BASELINE: e243c2c50b0d2a2ed4ee539f040fed53597a402f
          CERTIFIED_STATE: 9e7248f3a868957fb660e4ade4367b9b7c0649ac75ff22e5e264728b85b9ffa9
        run: |
          set -euo pipefail
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          git add src/polaris/application/decisions/relationships.py tests/application/decisions/test_relationships.py
          git commit -m "feat(application): add atomic relationship correction sets"
          persisted=$(git rev-parse HEAD)
          git push origin HEAD:spec-279
          test "$(git ls-remote origin refs/heads/spec-279 | cut -f1)" = "$persisted"
          state=$(python - <<'PY'
          import hashlib, os, stat, subprocess
          baseline=os.environ['TICKET_BASELINE']
          def zpaths(*args):
              out=subprocess.run(['git',*args],check=True,stdout=subprocess.PIPE).stdout
              return [p for p in out.split(b'\0') if p]
          paths=set(zpaths('diff','--no-renames','--name-only','-z',baseline,'--')); paths.update(zpaths('ls-files','--others','--exclude-standard','-z'))
          d=hashlib.sha256()
          for raw in sorted(paths):
              path=os.fsdecode(raw); d.update(b'path\0'+raw+b'\0')
              try: meta=os.lstat(path)
              except FileNotFoundError: d.update(b'state\0DELETED\0'); continue
              if stat.S_ISLNK(meta.st_mode): mode=b'120000'; content=hashlib.sha256(os.fsencode(os.readlink(path))).hexdigest()
              elif stat.S_ISREG(meta.st_mode):
                  mode=b'100755' if meta.st_mode & stat.S_IXUSR else b'100644'; h=hashlib.sha256()
                  with open(path,'rb') as f:
                      for chunk in iter(lambda: f.read(1024*1024),b''): h.update(chunk)
                  content=h.hexdigest()
              else: raise SystemExit(path)
              d.update(b'mode\0'+mode+b'\0sha256\0'+content.encode()+b'\0')
          print(d.hexdigest())
          PY
          )
          test "$state" = "$CERTIFIED_STATE"
          test -z "$(git status --porcelain)"
          echo "PERSISTED_COMMIT=$persisted"
          echo "PERSISTED_STATE=$state"
