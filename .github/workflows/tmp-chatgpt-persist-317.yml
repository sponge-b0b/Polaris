name: Temporary ChatGPT persist ticket 317

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-chatgpt-persist-317.yml

permissions:
  actions: read
  contents: write
  issues: read

jobs:
  persist:
    runs-on: ubuntu-24.04
    env:
      TICKET_BASELINE: 36f06cf396e50409e432b99fa00941053fe83f02
      CANDIDATE_STATE: 8a3ada741d4fde4e86a04bfbd821be9cc1e436e02214b57c974d41914646ee56
      CANDIDATE_ARTIFACT_ID: '10386609580'
      CHECKPOINT_COMMENT_ID: '5676814349'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec-279
          fetch-depth: 0

      - name: Guard certified persistence state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "spec-279"
          test "$(git rev-parse HEAD)" = "$TICKET_BASELINE"
          test "$(gh api repos/sponge-b0b/Polaris/git/ref/heads/spec-279 --jq .object.sha)" = "$TICKET_BASELINE"
          test "$(gh api repos/sponge-b0b/Polaris/issues/317 --jq .parent_issue_url)" = "https://api.github.com/repos/sponge-b0b/Polaris/issues/310"
          body=$(gh api repos/sponge-b0b/Polaris/issues/comments/$CHECKPOINT_COMMENT_ID --jq .body)
          grep -Fq '**Stage:** verifier-passed' <<<"$body"
          grep -Fq '**Ticket branch:** `spec-279`' <<<"$body"
          grep -Fq '**Ticket baseline:** `36f06cf396e50409e432b99fa00941053fe83f02`' <<<"$body"
          grep -Fq '**Candidate state:** `8a3ada741d4fde4e86a04bfbd821be9cc1e436e02214b57c974d41914646ee56`' <<<"$body"
          grep -Fq '**Attempt:** 2' <<<"$body"
          issue=$(gh api repos/sponge-b0b/Polaris/issues/317 --jq .body)
          grep -Fq 'Remediation parent: Spec Review #310' <<<"$issue"
          grep -Fq 'Parent Spec: #279' <<<"$issue"
          grep -Fq 'ARCHSRC-2' <<<"$issue"

      - name: Restore exact certified candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/sponge-b0b/Polaris/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip > "$RUNNER_TEMP/candidate.zip"
          unzip -q "$RUNNER_TEMP/candidate.zip" -d "$RUNNER_TEMP/t317"
          test "$(cat "$RUNNER_TEMP/t317/candidate-state.txt")" = "$CANDIDATE_STATE"
          git apply "$RUNNER_TEMP/t317/candidate.patch"
          git diff --check "$TICKET_BASELINE"

          TICKET_BASELINE="$TICKET_BASELINE" python - <<'PY' > "$RUNNER_TEMP/recomputed-state.txt"
          import hashlib, os, stat, subprocess
          baseline=os.environ['TICKET_BASELINE']
          def zp(*args):
              out=subprocess.run(['git',*args],check=True,stdout=subprocess.PIPE).stdout
              return [p for p in out.split(b'\0') if p]
          paths=set(zp('diff','--no-renames','--name-only','-z',baseline,'--'))
          paths.update(zp('ls-files','--others','--exclude-standard','-z'))
          d=hashlib.sha256()
          for raw in sorted(paths):
              path=os.fsdecode(raw); d.update(b'path\0'+raw+b'\0')
              try: meta=os.lstat(path)
              except FileNotFoundError:
                  d.update(b'state\0DELETED\0'); continue
              if stat.S_ISLNK(meta.st_mode):
                  mode=b'120000'; content=hashlib.sha256(os.fsencode(os.readlink(path))).hexdigest()
              elif stat.S_ISREG(meta.st_mode):
                  mode=b'100755' if meta.st_mode & stat.S_IXUSR else b'100644'; h=hashlib.sha256()
                  with open(path,'rb') as f:
                      for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
                  content=h.hexdigest()
              else: raise SystemExit(path)
              d.update(b'mode\0'+mode+b'\0sha256\0'+content.encode()+b'\0')
          print(d.hexdigest())
          PY
          test "$(cat "$RUNNER_TEMP/recomputed-state.txt")" = "$CANDIDATE_STATE"
          test "$(git diff --name-only "$TICKET_BASELINE" | sort)" = $'src/polaris/application/decisions/relationships.py\ntests/application/decisions/test_relationships.py'

      - name: Commit and push certified candidate
        run: |
          set -euo pipefail
          git config user.name "Bob Taylor"
          git config user.email "bobltaylorjr@gmail.com"
          git add src/polaris/application/decisions/relationships.py tests/application/decisions/test_relationships.py
          git diff --cached --check
          git commit -m "feat(application): attach omitted renewal lineage"
          git push -u origin HEAD:spec-279
          echo "PERSISTED_COMMIT=$(git rev-parse HEAD)"

      - name: Verify persisted candidate identity
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "spec-279"
          persisted=$(git rev-parse HEAD)
          test "$persisted" != "$TICKET_BASELINE"
          TICKET_BASELINE="$TICKET_BASELINE" python - <<'PY' > "$RUNNER_TEMP/post-state.txt"
          import hashlib, os, stat, subprocess
          baseline=os.environ['TICKET_BASELINE']
          def zp(*args):
              out=subprocess.run(['git',*args],check=True,stdout=subprocess.PIPE).stdout
              return [p for p in out.split(b'\0') if p]
          paths=set(zp('diff','--no-renames','--name-only','-z',baseline,'--'))
          paths.update(zp('ls-files','--others','--exclude-standard','-z'))
          d=hashlib.sha256()
          for raw in sorted(paths):
              path=os.fsdecode(raw); d.update(b'path\0'+raw+b'\0')
              try: meta=os.lstat(path)
              except FileNotFoundError:
                  d.update(b'state\0DELETED\0'); continue
              if stat.S_ISLNK(meta.st_mode):
                  mode=b'120000'; content=hashlib.sha256(os.fsencode(os.readlink(path))).hexdigest()
              elif stat.S_ISREG(meta.st_mode):
                  mode=b'100755' if meta.st_mode & stat.S_IXUSR else b'100644'; h=hashlib.sha256()
                  with open(path,'rb') as f:
                      for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
                  content=h.hexdigest()
              else: raise SystemExit(path)
              d.update(b'mode\0'+mode+b'\0sha256\0'+content.encode()+b'\0')
          print(d.hexdigest())
          PY
          test "$(cat "$RUNNER_TEMP/post-state.txt")" = "$CANDIDATE_STATE"
          git status --porcelain | test ! -s /dev/stdin
          git log --reverse --format='%H %h — %s' "$TICKET_BASELINE"..HEAD
