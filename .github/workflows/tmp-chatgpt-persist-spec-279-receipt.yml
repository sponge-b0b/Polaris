name: Temporary ChatGPT persist Spec 279 verification receipt
on:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
jobs:
  persist:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: sponge-b0b/Polaris
      RECEIPT_GZ_B64: 
    steps:
      - name: Revalidate and persist canonical receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$REPO/git/ref/heads/spec-279 --jq .object.sha)" = "e2d59797ebcaf4b87b3c2c941fb08bffc2213dd7"
          SPEC_BODY_HASH=$(gh issue view 279 --repo "$REPO" --json body --jq .body | sha256sum | awk '{print $1}')
          test "$SPEC_BODY_HASH" = "5f59ee666c65e9e93fe3b69403dbf4bc5328332d14d6339fc55b067755e4eb17"
          printf '%s' "$RECEIPT_GZ_B64" | base64 -d | gzip -d > receipt.md
          test "$(sha256sum receipt.md | awk '{print $1}')" = "4cf6b5621549064457451d80c93752f6b66abca60ec5e86303594b2f3d9cd382"
          EXISTING=$(gh api --paginate "repos/$REPO/issues/279/comments?per_page=100" | jq -s 'add | map(select(.body | contains("**Verification Hash:** f6a6e62d9df2135a602a295a2501ab78bb65e46e7f0a893cecc32cf9da676923"))) | length')
          test "$EXISTING" = "0"
          jq -Rs '{body: .}' receipt.md > payload.json
          gh api --method POST "repos/$REPO/issues/279/comments" --input payload.json > comment.json
          COMMENT_ID=$(jq -r .id comment.json)
          COMMENT_URL=$(jq -r .html_url comment.json)
          test -n "$COMMENT_ID"
          gh api "repos/$REPO/issues/comments/$COMMENT_ID" | jq -j .body > readback.md
          cmp -s receipt.md readback.md
          echo "COMMENT_ID=$COMMENT_ID"
          echo "COMMENT_URL=$COMMENT_URL"
          echo "RECEIPT_SHA256=$(sha256sum receipt.md | awk '{print $1}')"
