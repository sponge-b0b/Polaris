name: Temporary ChatGPT finalize Spec 279 review
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec-279
          fetch-depth: 0
      - name: Revalidate checkpoint and durable review state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: sponge-b0b/Polaris
          EXPECTED_HEAD: e2d59797ebcaf4b87b3c2c941fb08bffc2213dd7
          EXPECTED_BASELINE: 4daed9034891600597a47c01b6c39d5ebd9914ca
          EXPECTED_BODY_HASH: 5f59ee666c65e9e93fe3b69403dbf4bc5328332d14d6339fc55b067755e4eb17
          EXPECTED_CONTRACT_HASH: ab243bb1e38159aef9de1a87dd6ad4de43773c093f2149dc83e2ca81087411f2
          EXPECTED_AGENTS_BLOB: 66a1be7f0498f92ac9574d258443ec4cb8a15059
          FINDING_LEDGER_COMMENT: '5662220111'
          DECOMPOSITION_COMMENT: '5663250943'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git branch --show-current)" = "spec-279"
          test -z "$(git status --porcelain)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main:AGENTS.md)" = "$EXPECTED_AGENTS_BLOB"

          gh issue view 279 --repo "$REPO" --json body --jq .body > "$RUNNER_TEMP/spec-body.md"
          test "$(sha256sum "$RUNNER_TEMP/spec-body.md" | awk '{print $1}')" = "$EXPECTED_BODY_HASH"
          gh api "repos/$REPO/issues/310" --jq .body > "$RUNNER_TEMP/review-body.md"
          gh api "repos/$REPO/issues/comments/$DECOMPOSITION_COMMENT" --jq .body > "$RUNNER_TEMP/decomposition.md"
          gh api "repos/$REPO/issues/comments/$FINDING_LEDGER_COMMENT" --jq .body > "$RUNNER_TEMP/prior-ledger.md"

          python - <<'PY'
          import os, re
          from pathlib import Path

          review = Path(os.environ['RUNNER_TEMP'], 'review-body.md').read_text()
          roots = dict(re.findall(r'^### (RB-\d+) —[^\n]*\n\nStatus: ([^\n]+)', review, re.M))
          assert roots == {'RB-1': 'satisfied  ', 'RB-2': 'satisfied  ', 'RB-3': 'satisfied  '} or {
              key: value.strip() for key, value in roots.items()
          } == {'RB-1': 'satisfied', 'RB-2': 'satisfied', 'RB-3': 'satisfied'}, roots

          decomp = Path(os.environ['RUNNER_TEMP'], 'decomposition.md').read_text()
          defects = dict(re.findall(r'^### (DD-\d+) —[^\n]*\nStatus: ([^\n]+)', decomp, re.M))
          assert {key: value.strip() for key, value in defects.items()} == {
              'DD-1': 'satisfied', 'DD-2': 'satisfied'
          }, defects
          assert 'Unresolved decomposition defects: 0' in decomp
          assert 'Current implementation obligations from decomposition defects: satisfied 2' in decomp
          assert 'open 0; unmapped 0; ambiguous 0' in decomp
          PY

      - name: Render and persist current finding ledger
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: sponge-b0b/Polaris
          FINDING_LEDGER_COMMENT: '5662220111'
          EXPECTED_HEAD: e2d59797ebcaf4b87b3c2c941fb08bffc2213dd7
          EXPECTED_BODY_HASH: 5f59ee666c65e9e93fe3b69403dbf4bc5328332d14d6339fc55b067755e4eb17
          EXPECTED_CONTRACT_HASH: ab243bb1e38159aef9de1a87dd6ad4de43773c093f2149dc83e2ca81087411f2
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_TOOL=.agents/skills/review-spec/scripts/review_spec_artifacts.py
          python - <<'PY'
          import importlib.util, json, os
          from pathlib import Path

          tool_path = Path('.agents/skills/review-spec/scripts/review_spec_artifacts.py')
          spec = importlib.util.spec_from_file_location('review_spec_artifacts', tool_path)
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          prior_body = Path(os.environ['RUNNER_TEMP'], 'prior-ledger.md').read_text()
          prior = module.parse_finding_ledger(prior_body)
          assert prior['parent_spec'] == 279
          assert prior['spec_review'] == 310
          assert len(prior['findings']) == 4
          assert all(row['severity'] == 'blocking' for row in prior['findings'])
          assert all(row['status'] in module.TERMINAL_FINDING_STATUSES for row in prior['findings'])
          payload = {
              'parent_spec': 279,
              'spec_review': 310,
              'head': os.environ['EXPECTED_HEAD'],
              'spec_body_hash': os.environ['EXPECTED_BODY_HASH'],
              'spec_contract_hash': os.environ['EXPECTED_CONTRACT_HASH'],
              'findings': prior['findings'],
          }
          Path(os.environ['RUNNER_TEMP'], 'ledger-input.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )
          PY
          python "$REVIEW_TOOL" render-finding-ledger \
            --input "$RUNNER_TEMP/ledger-input.json" \
            --prior-ledger "$RUNNER_TEMP/prior-ledger.md" \
            --output "$RUNNER_TEMP/finding-ledger.md"
          jq -Rs '{body: .}' "$RUNNER_TEMP/finding-ledger.md" > "$RUNNER_TEMP/finding-ledger.json"
          gh api --method PATCH "repos/$REPO/issues/comments/$FINDING_LEDGER_COMMENT" \
            --input "$RUNNER_TEMP/finding-ledger.json" > "$RUNNER_TEMP/finding-ledger-response.json"
          gh api "repos/$REPO/issues/comments/$FINDING_LEDGER_COMMENT" --jq .body > "$RUNNER_TEMP/finding-ledger-readback.md"
          cmp -s "$RUNNER_TEMP/finding-ledger.md" "$RUNNER_TEMP/finding-ledger-readback.md"

      - name: Render and persist Exit Receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: sponge-b0b/Polaris
          EXPECTED_HEAD: e2d59797ebcaf4b87b3c2c941fb08bffc2213dd7
          EXPECTED_BASELINE: 4daed9034891600597a47c01b6c39d5ebd9914ca
          EXPECTED_BODY_HASH: 5f59ee666c65e9e93fe3b69403dbf4bc5328332d14d6339fc55b067755e4eb17
          EXPECTED_CONTRACT_HASH: ab243bb1e38159aef9de1a87dd6ad4de43773c093f2149dc83e2ca81087411f2
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_TOOL=.agents/skills/review-spec/scripts/review_spec_artifacts.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              'parent_spec': 279,
              'spec_review': 310,
              'head': os.environ['EXPECTED_HEAD'],
              'baseline': os.environ['EXPECTED_BASELINE'],
              'branch': 'spec-279',
              'spec_body_hash': os.environ['EXPECTED_BODY_HASH'],
              'spec_contract_hash': os.environ['EXPECTED_CONTRACT_HASH'],
              'unaccounted_prior_findings': 0,
              'unresolved_continuity_cells': 0,
              'active_root_blockers': 0,
              'candidate_new_roots': 0,
              'unchecked_coverage_cells': 0,
              'unresolved_challenges': 0,
              'review_coverage': 'complete',
              'primary_reviewers': '1',
              'targeted_challengers': 1,
              'saturation_challengers': 0,
              'reviewer_execution': 'owner-authorized in-session substitute',
              'reviewer_execution_override': 'docs/process/session-reconstitution.md standing Skill Authorization Override; fresh GitHub Copilot substrate unavailable because monthly quota is exhausted',
          }
          Path(os.environ['RUNNER_TEMP'], 'exit-input.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )
          PY
          python "$REVIEW_TOOL" render-exit \
            --input "$RUNNER_TEMP/exit-input.json" \
            --finding-ledger "$RUNNER_TEMP/finding-ledger-readback.md" \
            --output "$RUNNER_TEMP/exit-receipt.md"
          jq -Rs '{body: .}' "$RUNNER_TEMP/exit-receipt.md" > "$RUNNER_TEMP/exit-receipt.json"
          gh api --method POST "repos/$REPO/issues/310/comments" \
            --input "$RUNNER_TEMP/exit-receipt.json" > "$RUNNER_TEMP/exit-comment.json"
          EXIT_ID=$(jq -r .id "$RUNNER_TEMP/exit-comment.json")
          EXIT_URL=$(jq -r .html_url "$RUNNER_TEMP/exit-comment.json")
          test -n "$EXIT_ID" && test "$EXIT_ID" != null
          gh api "repos/$REPO/issues/comments/$EXIT_ID" --jq .body > "$RUNNER_TEMP/exit-readback.md"
          cmp -s "$RUNNER_TEMP/exit-receipt.md" "$RUNNER_TEMP/exit-readback.md"
          LEDGER_HASH=$(sha256sum "$RUNNER_TEMP/finding-ledger-readback.md" | awk '{print $1}')
          printf '{"exit_comment_id":%s,"exit_url":"%s","finding_ledger_hash":"%s"}\n' \
            "$EXIT_ID" "$EXIT_URL" "$LEDGER_HASH" > "$GITHUB_WORKSPACE/review-exit-metadata.json"

      - name: Clean temporary review transports and prove zero tree delta
        env:
          GH_TOKEN: ${{ github.token }}
          PRE_REVIEW_MAIN: 474d0fa34c6ab2bbd764729f3222d1a849bbc2eb
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-chatgpt-review-spec-279-preflight.yml
          git rm .github/workflows/tmp-chatgpt-review-spec-279-exit.yml
          git commit -m "chore(workflow): clean Spec 279 review transport"
          git push origin main
          git diff --exit-code "$PRE_REVIEW_MAIN" HEAD -- .
          printf '%s\n' "$(git rev-parse HEAD)" > "$GITHUB_WORKSPACE/review-main-head.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: review-spec-279-exit
          path: |
            review-exit-metadata.json
            review-main-head.txt
