name: Temporary ChatGPT review Spec 279 preflight
on:
  push:
    branches: [main]
permissions:
  contents: read
  issues: read
  actions: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec-279
          fetch-depth: 0
      - name: Validate exact candidate and build review context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: sponge-b0b/Polaris
          SPEC_NUMBER: '279'
          EXPECTED_HEAD: e2d59797ebcaf4b87b3c2c941fb08bffc2213dd7
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git branch --show-current)" = "spec-279"
          test -z "$(git status --porcelain)"
          VERIFY_TOOL=.agents/skills/verify-spec/scripts/verify_spec_artifacts.py
          REVIEW_TOOL=.agents/skills/review-spec/scripts/review_spec_artifacts.py
          SPEC_COMMENTS_FILE="$RUNNER_TEMP/spec-comments.json"
          SPEC_COMMENTS_SUMMARY="$RUNNER_TEMP/spec-comments-summary.json"
          SPEC_BODY_FILE="$RUNNER_TEMP/spec-body.md"
          REVIEW_CHECKPOINT="$RUNNER_TEMP/review-checkpoint.json"
          OWNERSHIP_FILE="$RUNNER_TEMP/change-provenance.json"
          gh api --paginate --slurp -H "X-GitHub-Api-Version: 2026-03-10" "repos/$REPO/issues/$SPEC_NUMBER/comments?per_page=100" > "$SPEC_COMMENTS_FILE"
          python "$VERIFY_TOOL" comments --input "$SPEC_COMMENTS_FILE" > "$SPEC_COMMENTS_SUMMARY"
          gh issue view "$SPEC_NUMBER" --repo "$REPO" --json body --jq .body > "$SPEC_BODY_FILE"
          python "$REVIEW_TOOL" checkpoint --comments-summary "$SPEC_COMMENTS_SUMMARY" --spec-body "$SPEC_BODY_FILE" --spec "$SPEC_NUMBER" --head "$EXPECTED_HEAD" --branch spec-279 > "$REVIEW_CHECKPOINT"
          python .agents/skills/spec-contract/scripts/classify_ownership.py --baseline "$(python -c 'import json; print(json.load(open("'$REVIEW_CHECKPOINT'"))["baseline"])')" --branch spec-279 --head "$EXPECTED_HEAD" > "$OWNERSHIP_FILE"
          cp "$SPEC_BODY_FILE" "$GITHUB_WORKSPACE/review-spec-body.md"
          cp "$REVIEW_CHECKPOINT" "$GITHUB_WORKSPACE/review-checkpoint.json"
          cp "$OWNERSHIP_FILE" "$GITHUB_WORKSPACE/change-provenance.json"
          git status --short
      - uses: actions/upload-artifact@v4
        with:
          name: review-spec-279-preflight
          path: |
            review-spec-body.md
            review-checkpoint.json
            change-provenance.json
