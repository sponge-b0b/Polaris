name: Temporary ChatGPT Spec 279 remediation persistence

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  persist:
    if: "${{ github.event.head_commit.message == 'chore(review): persist Spec 279 remediation' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Pin execution identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show HEAD:AGENTS.md | git hash-object --stdin)" = "66a1be7f0498f92ac9574d258443ec4cb8a15059"
          git fetch --no-tags origin spec-279
          test "$(git rev-parse FETCH_HEAD)" = "4baa54445e0bcd9f19bb75277a9abc84bea3008c"

      - name: Persist Spec Review remediation ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          repo = "sponge-b0b/Polaris"
          issue = "310"
          raw = subprocess.check_output(
              ["gh", "issue", "view", issue, "--repo", repo, "--json", "body"],
              text=True,
          )
          body = json.loads(raw)["body"]
          assert body.startswith("**Parent Spec:** #279")
          assert body.count("### RB-1 — External Resolution admission must remain independent of operative applicability") == 1
          assert "### RB-2 — Command-side persistence read failures must be application-owned" not in body
          assert "### RB-3 — Relationship construction failures must cross application translation" not in body
          assert body.count("\n## Spec Acceptance Matrix\n") == 1
          assert body.count("\n## Review State\n") == 1

          roots = '\n### RB-2 — Command-side persistence read failures must be application-owned\n\nStatus: open  \nInvariant: Command-side persistence reads must expose a technology-neutral application-owned persistence-failure contract so raw infrastructure failures cannot escape the application boundary.  \nArchitecture decision required: No  \nGoverning authority: Spec #279 ID-24, ID-26, TD-21; `docs/proposed/application-use-cases-investment-decision-lifecycle.md` §16; `docs/proposed/durable-persistence-investment-decision-history.md` §§2 and 16.  \nRouting: existing-authority remediation  \nContributing findings: RF-1  \nAffected surfaces/reference kinds: `src/polaris/application/decisions/contracts.py` command-side read ports; command-side reads in `ordinary_work.py` and `relationships.py`; unavailable-persistence application outcomes and directly affected tests.  \nExit checks: (1) inward command-side read ports establish an explicit technology-neutral persistence-failure contract; (2) ordinary-work and relationship services translate/read through that contract so raw infrastructure read exceptions do not escape; (3) unavailable persistence remains distinct from not-found, lifecycle, relationship, concurrency, continuity, and idempotency outcomes; (4) concrete adapter/database exception translation remains adapter-owned rather than leaking vendor exceptions inward; (5) focused tests prove read-side unavailable-persistence behavior without arbitrary broad application catches; (6) fresh `$verify-spec` certifies the remediated exact `spec-279` HEAD before re-review.  \nCurrent evidence:\n- Canonical Finding Continuity Ledger `RF-1` remains open with zero invalidation-boundary intersection at `4baa54445e0bcd9f19bb75277a9abc84bea3008c`.\n- Current `DecisionCommandStore` command-side read methods return domain/application values or `None`, while explicit unavailable outcomes exist for commit paths; the durable review record therefore still lacks an application-owned read-failure contract.\n- Replacement fresh review did not terminally disposition `RF-1`; continuity rules preserve it as open.\n\n### RB-3 — Relationship construction failures must cross application translation\n\nStatus: open  \nInvariant: Relationship-construction domain failures must cross the application-owned relationship error-translation boundary rather than leaking raw domain exceptions.  \nArchitecture decision required: No  \nGoverning authority: Spec #279 ID-26, TD-21; `docs/proposed/application-use-cases-investment-decision-lifecycle.md` §16; `docs/proposed/durable-persistence-investment-decision-history.md` §16.  \nRouting: existing-authority remediation  \nContributing findings: RF-2  \nAffected surfaces/reference kinds: `src/polaris/application/decisions/relationships.py` renewal, Supersession, and correction construction paths; `relationship_fact()` / `relationship_correction()`; `_RELATIONSHIP_ERRORS`; directly affected relationship tests.  \nExit checks: (1) renewal relationship construction crosses the application translation boundary; (2) Supersession relationship construction crosses that boundary; (3) relationship-correction construction crosses that boundary; (4) domain cycle/history/conflict construction failures become the established semantic application outcomes rather than leaking raw domain exceptions; (5) the fix does not introduce an arbitrary broad `Exception` catch and preserves valid atomic/idempotent/concurrency behavior; (6) focused tests prove constructor-failure translation for the affected paths; (7) fresh `$verify-spec` certifies the remediated exact `spec-279` HEAD before re-review.  \nCurrent evidence:\n- Canonical Finding Continuity Ledger `RF-2` remains open with zero invalidation-boundary intersection at `4baa54445e0bcd9f19bb75277a9abc84bea3008c`.\n- Durable review evidence shows `relationship_fact()` and `relationship_correction()` construction occurs before the `_RELATIONSHIP_ERRORS` translation guard on affected paths.\n- Replacement fresh review did not terminally disposition `RF-2`; continuity rules preserve it as open.\n'
          matrix = '\n| RB-2 | Command-side read-port failure contract | Persistence unavailability on command-side reads is represented by a technology-neutral application-owned contract. | open | RF-1 / Finding Continuity Ledger comment 5662220111; Pending comment 5663229010. |\n| RB-2 | Ordinary-work / relationship command reads | Raw infrastructure read exceptions cannot escape through application command services and remain distinct from semantic conflicts/not-found. | open | RF-1; governing application/persistence failure authority. |\n| RB-3 | Renewal / Supersession relationship construction | Relationship-fact construction failures cross the established application translation boundary. | open | RF-2 / Finding Continuity Ledger comment 5662220111. |\n| RB-3 | Relationship correction construction | `relationship_correction()` failures cross the established application translation boundary and preserve semantic conflict typing. | open | RF-2; Pending comment 5663229010. |\n'
          history = '\n\n## Review Remediation Update [2026-09-14 05:32 MDT]\n\nCurrent independently validated Blocking state:\n- Standards: RF-1 and RF-2 remain open by durable finding continuity; no new replacement-review Standards blocker survived axis-provenance validation.\n- Spec: RF-1 remains open on ID-24/ID-26/TD-21; RF-2 remains open on ID-26/TD-21.\n- Architecture: RF-1 and RF-2 remain ordinary existing-authority remediation; RF-3 and RF-4 remain unresolved decomposition defects. No new architecture decision is required.\n\nReviewer execution:\n- Owner-authorized replacement fresh reviewer: GitHub Actions run `34837790698`, job `103955510481`, exact candidate `4baa54445e0bcd9f19bb75277a9abc84bea3008c`.\n- Checkpoint, 34-candidate Standards universe, 122-cell Spec coverage, 8-cell Architecture coverage, and deterministic proof-set validation passed.\n- The replacement reviewer proposed an expected-version blocker for relationship correction. Existing owner-authorized independent challenge run `34814978740` / job `103883668778` on the same unchanged candidate already proved missing endpoint versions reject before commit as `ConcurrencyConflict`; the falsifier is excluded, so that proposal is non-actionable.\n- The replacement reviewer proposed a Standards blocker for `memory.py::_read()` broad exception translation. Axis-provenance validation rejected it because the cited coding standard expressly permits deliberate `except Exception` at a genuine boundary that owns failure translation, which `_read()` does while preserving existing `DecisionApplicationError`.\n\nFinding continuity:\n- `RF-1`: carried-open; invalidation-boundary intersection zero.\n- `RF-2`: carried-open; invalidation-boundary intersection zero.\n- `RF-3`: carried-open decomposition defect; invalidation-boundary intersection zero.\n- `RF-4`: carried-open decomposition defect; invalidation-boundary intersection zero.\n- Unaccounted prior findings: 0.\n- Unresolved continuity cells: 0.\n\nDecomposition integrity:\n- `DD-1` / `RF-3`: atomic multi-relationship correction remains unresolved and routes to `$to-tickets`.\n- `DD-2` / `RF-4`: late omitted-renewal-lineage attachment remains unresolved and routes to `$to-tickets`.\n- Canonical decomposition record: issue comment `5663250943`.\n\nRoot updates:\n- RB-1 remains satisfied; no acceptance cell changed.\n- RB-2 created open from RF-1.\n- RB-3 created open from RF-2.\n- Open ordinary-remediation RF rows: 2.\n- RF rows mapped to active Root Blockers: 2.\n- Open ordinary RF rows without root mapping: 0.\n- Root mappings to unknown/terminal RF rows: 0.\n- Open decomposition-defect RF rows: 2.\n\nRemediation delta:\n- RB-2 and RB-3 are active architecture-conforming ordinary remediation.\n- DD-1 and DD-2 remain unresolved decomposition defects and must be independently validated/reconciled by `$to-tickets`; they do not suppress RB-2/RB-3 remediation.\n- Fresh `$verify-spec` is required after remediation before `$review-spec` re-review.\n'

          body = body.replace(
              "\n## Spec Acceptance Matrix\n",
              roots + "\n## Spec Acceptance Matrix\n",
              1,
          )
          body = body.replace(
              "\n## Review State\n",
              matrix + "\n## Review State\n",
              1,
          )
          body = body.rstrip() + history

          out = pathlib.Path("/tmp/spec-review-310.md")
          out.write_text(body, encoding="utf-8")
          subprocess.run(
              ["gh", "issue", "edit", issue, "--repo", repo, "--body-file", str(out)],
              check=True,
          )

          readback = json.loads(
              subprocess.check_output(
                  ["gh", "issue", "view", issue, "--repo", repo, "--json", "body"],
                  text=True,
              )
          )["body"]
          assert readback == body
          assert readback.count("### RB-2 — Command-side persistence read failures must be application-owned") == 1
          assert readback.count("### RB-3 — Relationship construction failures must cross application translation") == 1
          assert "Open ordinary RF rows without root mapping: 0." in readback
          print("SPEC 279 REVIEW REMEDIATION PERSISTENCE: PASS")
          PY
