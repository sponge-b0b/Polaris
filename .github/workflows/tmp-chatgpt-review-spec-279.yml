name: Temporary ChatGPT Spec 279 fresh reviewer

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: read
  copilot-requests: write

jobs:
  review:
    if: "${{ github.event.head_commit.message == 'chore(review): run fresh Spec 279 reviewer' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec-279
          fetch-depth: 0

      - name: Pin exact candidate and current policy authority
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "spec-279"
          test "$(git rev-parse HEAD)" = "4baa54445e0bcd9f19bb75277a9abc84bea3008c"
          test -z "$(git status --porcelain)"
          git fetch --quiet origin a2a945ca63323a19d0bf631f7417f98c6615997e
          test "$(git rev-parse FETCH_HEAD)" = "a2a945ca63323a19d0bf631f7417f98c6615997e"
          test "$(git show a2a945ca63323a19d0bf631f7417f98c6615997e:AGENTS.md | git hash-object --stdin)" = "66a1be7f0498f92ac9574d258443ec4cb8a15059"

      - name: Build deterministic review inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REVIEW_ROOT="$RUNNER_TEMP/review-spec-279-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$REVIEW_ROOT"
          printf 'REVIEW_ROOT=%s\n' "$REVIEW_ROOT" >> "$GITHUB_ENV"

          gh api --paginate --slurp \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/sponge-b0b/Polaris/issues/279/comments?per_page=100" \
            > "$REVIEW_ROOT/spec-comments.json"
          python .agents/skills/verify-spec/scripts/verify_spec_artifacts.py comments \
            --input "$REVIEW_ROOT/spec-comments.json" \
            > "$REVIEW_ROOT/spec-comments-summary.json"
          gh issue view 279 --repo sponge-b0b/Polaris --json body --jq .body \
            > "$REVIEW_ROOT/spec-body.md"
          python .agents/skills/review-spec/scripts/review_spec_artifacts.py checkpoint \
            --comments-summary "$REVIEW_ROOT/spec-comments-summary.json" \
            --spec-body "$REVIEW_ROOT/spec-body.md" \
            --spec 279 \
            --head 4baa54445e0bcd9f19bb75277a9abc84bea3008c \
            --branch spec-279 \
            > "$REVIEW_ROOT/checkpoint.json"

          python - "$REVIEW_ROOT/checkpoint.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['head'] == '4baa54445e0bcd9f19bb75277a9abc84bea3008c'
          assert data['baseline'] == '4daed9034891600597a47c01b6c39d5ebd9914ca'
          assert data['branch'] == 'spec-279'
          assert data['spec_body_hash'] == '5f59ee666c65e9e93fe3b69403dbf4bc5328332d14d6339fc55b067755e4eb17'
          assert data['spec_contract_hash'] == '3044b039742306f1c0ed10085479c7c823ed463443e8d11d761f45de564fb334'
          assert data['verification_hash'] == '4b7f7a1641603337b2880adb851ca8ee4d4c13baee97b1da0f80a63d69eac9e4'
          assert int(data['receipt_id']) == 5659536204
          assert len(data['manifest']) == 122
          assert not data['coverage']['unresolved']
          print('Review checkpoint: PASS; 122-cell exact verified contract pinned.')
          PY

          python .agents/skills/spec-contract/scripts/classify_ownership.py \
            --baseline 4daed9034891600597a47c01b6c39d5ebd9914ca \
            --branch spec-279 \
            --head 4baa54445e0bcd9f19bb75277a9abc84bea3008c \
            > "$REVIEW_ROOT/provenance.json"

          python - "$REVIEW_ROOT/provenance.json" "$REVIEW_ROOT/standards-universe.json" <<'PY'
          import json, sys
          from pathlib import PurePosixPath

          provenance = json.load(open(sys.argv[1], encoding='utf-8'))
          rows = []
          candidates = []
          for kind, key in (
              ('branch-local', 'branch_local_surfaces'),
              ('mixed', 'mixed_provenance_surfaces'),
          ):
              for surface in provenance[key]:
                  candidates.append((surface, kind))
          candidates.sort()

          def categories(surface: str) -> list[str]:
              p = PurePosixPath(surface)
              if surface.endswith('.py'):
                  return ['python-coding-standards']
              if surface == 'AGENTS.md' or surface.startswith('.agents/skills/') or surface.startswith('docs/process/'):
                  return ['workflow-process-policy']
              if surface.startswith('wiki/'):
                  return ['living-entity-wiki-policy']
              if surface in {'.jscpd.json', 'pyproject.toml', 'uv.lock'}:
                  return ['repository-tool-configuration']
              return ['repository-policy']

          n = 0
          for surface, provenance_kind in candidates:
              for category in categories(surface):
                  n += 1
                  rows.append({
                      'candidate': f'STD-CAND-{n:03d}',
                      'surface': surface,
                      'mechanical_provenance': provenance_kind,
                      'standards_category': category,
                  })
          json.dump(rows, open(sys.argv[2], 'w', encoding='utf-8'), indent=2)
          print(f'Provisional Standards candidates: {len(rows)}; omitted before attribution: 0')
          PY

          cat > "$REVIEW_ROOT/architecture-universe.json" <<'JSON'
          [
            {
              "cell": "ARCH-1",
              "claim": "Application Use Cases owns Decision commands, queries, transaction semantics, idempotency, and cross-entity coordination without becoming a second domain source of truth.",
              "authority": ["Spec #279 Architecture Impact", "docs/current/platform-architecture-0.2.0.md", "docs/proposed/application-use-cases-investment-decision-lifecycle.md", "ADR 0001"]
            },
            {
              "cell": "ARCH-2",
              "claim": "Investment Decision identity, lifecycle, applicability, correction, renewal, and relationship semantics remain domain-owned while the application layer coordinates them without redefining them.",
              "authority": ["Spec #279", "docs/proposed/investment-decisions-r2-foundation-public-contract.md", "docs/proposed/investment-decisions-lifecycle-model.md", "docs/proposed/investment-decisions-decision-relationship-model.md"]
            },
            {
              "cell": "ARCH-3",
              "claim": "Durable Persistence is accessed only through technology-neutral inward-owned Decisions ports; PostgreSQL, ORM, driver, locking, isolation, and vendor-native representations do not leak into application contracts.",
              "authority": ["Spec #279 US-44, ID-24, OOS-1", "ADR 0003", "docs/proposed/durable-persistence-investment-decision-history.md"]
            },
            {
              "cell": "ARCH-4",
              "claim": "Governance & Authority trusted-basis seams preserve the separation between Actor Attribution, application authorization, and investment authority; #279 does not implement Governance durable truth.",
              "authority": ["Spec #279 US-18..20, US-36, ID-4, ID-13, OOS-2", "docs/proposed/application-use-cases-investment-decision-lifecycle.md"]
            },
            {
              "cell": "ARCH-5",
              "claim": "Interfaces and Background Work are later thin callers of the same application use cases and no alternate business-write path is introduced by #279.",
              "authority": ["Spec #279 US-43, OOS-11", "docs/current/platform-architecture-0.2.0.md", "ADR 0001"]
            },
            {
              "cell": "ARCH-6",
              "claim": "Real I/O/waiting seams are async-first, pure deterministic Decision-domain work remains synchronous, contracts stay executor-neutral, and correctness does not depend on one event loop, one thread, or incidental GIL serialization.",
              "authority": ["Spec #279 Solution, ID-29..32", "ADR 0004"]
            },
            {
              "cell": "ARCH-7",
              "claim": "The implementation preserves modular-monolith dependency direction, inward-owned ports, direct business truth, immutable history, and avoids concrete infrastructure imports from the application boundary.",
              "authority": ["Spec #279 Architecture Impact", "ADR 0001", "ADR 0002", "ADR 0003", "docs/current/platform-architecture-0.2.0.md"]
            },
            {
              "cell": "ARCH-8",
              "claim": "R2 remains purpose-specific: no platform-wide Unit of Work, generic workflow/event runtime, speculative PRIOR_DECISION_CONTEXT payload/retrieval, or other unearned cross-owner machinery is introduced.",
              "authority": ["Spec #279 US-42, US-45, ID-25, ID-28, OOS-7..10"]
            }
          ]
          JSON

          git show a2a945ca63323a19d0bf631f7417f98c6615997e:AGENTS.md > "$REVIEW_ROOT/current-AGENTS.md"
          git show a2a945ca63323a19d0bf631f7417f98c6615997e:.agents/skills/review-spec/SKILL.md > "$REVIEW_ROOT/current-review-spec.md"
          git show a2a945ca63323a19d0bf631f7417f98c6615997e:.agents/skills/review-architecture/SKILL.md > "$REVIEW_ROOT/current-review-architecture.md"
          git show a2a945ca63323a19d0bf631f7417f98c6615997e:.agents/skills/coding-standards/SKILL.md > "$REVIEW_ROOT/current-coding-standards.md"

      - name: Install current Copilot CLI
        run: npm install --global @github/copilot

      - name: Run one fresh three-axis semantic reviewer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AUTO_UPDATE: "false"
          COPILOT_MCP_TOOL_CACHE: "false"
        run: |
          set -euo pipefail
          COPILOT_HOME="$REVIEW_ROOT/copilot-home"
          export COPILOT_HOME
          mkdir -p "$COPILOT_HOME"

          python - "$REVIEW_ROOT" <<'PY'
          from __future__ import annotations
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          output = root / 'review-result.json'

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def add_file(parts: list[str], path: str) -> None:
              p = Path(path)
              if p.exists():
                  parts.extend([f'\n=== FILE: {path} ===\n', p.read_text(encoding='utf-8')])

          instructions = r'''You are the single genuinely fresh semantic reviewer for Polaris `$review-spec` on Spec #279. You did not participate in implementation, verification, prior review, remediation, or parent orchestration.

Review exact candidate `spec-279@4baa54445e0bcd9f19bb75277a9abc84bea3008c`, baseline `4daed9034891600597a47c01b6c39d5ebd9914ca`, using the embedded current authority and evidence only.

CRITICAL ADVERSARIAL BOUNDARY:
- Do NOT seek, infer, or use any prior Spec Review issue, Root Blocker history, previous review finding, prior review-proof ledger, prior reviewer conclusion, conversation memory, or historical remediation conclusion.
- The parent will perform root/provenance/domain-finality reconciliation only after your provisional findings are frozen.
- The passing verification receipt establishes the immutable review contract/manifest, not correctness evidence for your semantic dispositions.
- Do not rerun verification gates. This is semantic review, not `$verify-spec`.
- Do not mutate repository/tracker state and do not access network, shell, memory, or external tools.

EXECUTION INTEGRITY:
Perform exactly three sequential, semantically independent passes in this order: Standards, Spec, Architecture. Freeze each axis before starting the next. Shared factual excerpts may be reused; an earlier axis's semantic conclusion is never evidence for a later axis. Continue through all cells even if you find a blocker.

STANDARDS:
The supplied `standards-universe.json` is the complete provisional candidate universe. Return exactly one attribution/disposition row per supplied candidate. Mechanical provenance is not semantic ownership. `in-scope` requires exact current Spec/architecture/tracker authority materially owning that Standards behavior. `out-of-scope` remains an explicit N/A row. `ambiguous` is forbidden at completion: perform a bounded self-challenge from supplied authority to resolve it or report an unresolved challenge trigger. Standards Blocking requires both in-scope attribution and an actual deterministic/current repository-standard violation.

SPEC:
Use the supplied checkpoint manifest EXACTLY. Return exactly one coverage row per manifest cell and no extra Spec cells. Do not rebuild or expand the Spec contract. Evaluate every requirement against current source/tests and governing supplied authority. Preserve conditions/triggers if a cell is conditional. OOS cells may be `not-applicable` only with the exact exclusion reason. A passing verifier is never proof that a cell is clean.

ARCHITECTURE:
Use every supplied ARCH cell and apply the embedded `$review-architecture` authority/evidence method. You may add ARCH cells only when supplied current authority independently requires a materially distinct affected authority/surface omitted by the parent. Build the architecture domain authority-first and inspect named canonical/sibling/alternate/bypass paths represented in the supplied source/evidence. Architecture findings must state whether a new architecture decision is required.

CLAIM-PROOF INTEGRITY:
For each material cell internally establish claim/predicate/domain/falsifier/evidence and exclude the falsifier before `checked-no-finding`; no unproven material assumption may remain. Keep clean output compact. When a concrete ambiguity/evidence conflict appears, perform one bounded self-challenge in this SAME reviewer context before final output. Record only unresolved challenge triggers after that attempt.

PROOF REUSE OUTPUT:
For every current clean or N/A cell, certify it exactly once in a proof group for its axis. Group cells only when evidence identity and invalidation boundary are genuinely shared. Every proof group must have a non-empty invalidation boundary. Blocking/advisory cells are not included in clean proof groups.

OUTPUT:
Emit EXACTLY one JSON object and nothing else. Use this schema:
{
  "reviewer_execution":"fresh-github-actions-copilot-single-reviewer-three-axis-passes",
  "standards":{
    "coverage":[{"candidate":"STD-CAND-001","scope":"in-scope|out-of-scope","standards_disposition":"checked-no-finding|blocking|advisory|not-applicable","authority":"concise authority","evidence":"concise direct evidence/reason"}],
    "blocking":[{"title":"...","cells":["STD-CAND-..."],"surface":"...","authority":"...","evidence":"...","why":"..."}],
    "advisory":[{"title":"...","cells":["STD-CAND-..."],"surface":"...","authority":"...","evidence":"...","why":"..."}],
    "proof_groups":[{"id":"RPR-STANDARDS-1","cells":["STD-CAND-..."],"disposition":"checked-no-finding|not-applicable","evidence_identity":"...","evidence_stability":"repository-immutable|mutable","invalidation_boundary":["..."]}],
    "challenge_triggers":[]
  },
  "spec":{
    "coverage":[{"cell":"US-1","disposition":"checked-no-finding|blocking|advisory|not-applicable","evidence":"concise direct evidence","reason":null}],
    "blocking":[{"title":"...","cells":["US-..."],"surface":"...","authority":"...","evidence":"...","why":"..."}],
    "advisory":[{"title":"...","cells":["US-..."],"surface":"...","authority":"...","evidence":"...","why":"..."}],
    "proof_groups":[{"id":"RPR-SPEC-1","cells":["US-..."],"disposition":"checked-no-finding|not-applicable","evidence_identity":"...","evidence_stability":"repository-immutable|mutable","invalidation_boundary":["..."]}],
    "challenge_triggers":[]
  },
  "architecture":{
    "coverage":[{"cell":"ARCH-1","disposition":"checked-no-finding|blocking|advisory|not-applicable","authority":"...","surfaces":["..."],"evidence":"...","architecture_decision_required":"Yes|No|null","routing":"existing-authority remediation|upstream architecture resolution|none"}],
    "blocking":[{"title":"...","cells":["ARCH-..."],"surface":"...","authority":"...","evidence":"...","why":"...","architecture_decision_required":"Yes|No","routing":"..."}],
    "advisory":[{"title":"...","cells":["ARCH-..."],"surface":"...","authority":"...","evidence":"...","why":"...","architecture_decision_required":"Yes|No|null","routing":"..."}],
    "added_cells":[{"cell":"ARCH-9","claim":"...","authority":["..."]}],
    "proof_groups":[{"id":"RPR-ARCH-1","cells":["ARCH-..."],"disposition":"checked-no-finding|not-applicable","evidence_identity":"...","evidence_stability":"repository-immutable|mutable","invalidation_boundary":["..."]}],
    "challenge_triggers":[]
  }
}

Rules for JSON consistency:
- Coverage rows are one-to-one with the supplied universe (plus declared `added_cells` for Architecture).
- Use `not-applicable` for Standards `out-of-scope` rows.
- Do not put the same finding cell in both Blocking and Advisory.
- Each clean/N/A cell appears in exactly one proof group; finding-bearing cells appear in none.
- `challenge_triggers` must contain only genuinely unresolved bounded questions after your self-challenge. If any remain, explain them as concise strings; do not guess.
- Keep evidence concise but specific enough for parent provenance validation.
'''

          parts = [instructions]
          for label, path in [
              ('CURRENT ROOT AGENTS', root / 'current-AGENTS.md'),
              ('CURRENT REVIEW-SPEC SKILL', root / 'current-review-spec.md'),
              ('CURRENT REVIEW-ARCHITECTURE SKILL', root / 'current-review-architecture.md'),
              ('CURRENT CODING-STANDARDS SKILL', root / 'current-coding-standards.md'),
              ('SPEC #279 BODY', root / 'spec-body.md'),
              ('EXACT REVIEW CHECKPOINT JSON', root / 'checkpoint.json'),
              ('CURRENT CHANGE PROVENANCE JSON', root / 'provenance.json'),
              ('PROVISIONAL STANDARDS UNIVERSE JSON', root / 'standards-universe.json'),
              ('ARCHITECTURE UNIVERSE JSON', root / 'architecture-universe.json'),
          ]:
              parts.extend([f'\n=== {label} ===\n', Path(path).read_text(encoding='utf-8')])

          evidence_files = [
              'pyproject.toml',
              'wiki/index.md',
              'wiki/entities/investment-decisions.md',
              'wiki/entities/application-use-cases.md',
              'wiki/entities/durable-persistence.md',
              'wiki/entities/governance-authority.md',
              'wiki/entities/interfaces-presentation.md',
              'wiki/entities/background-work-follow-up.md',
              'docs/current/platform-architecture-0.2.0.md',
              'docs/adr/0001-platform-use-modular-monolith-with-ports-and-adapters.md',
              'docs/adr/0002-platform-persist-direct-business-truth-with-immutable-history.md',
              'docs/adr/0003-platform-insulate-infrastructure-behind-inward-owned-capability-ports.md',
              'docs/adr/0004-platform-make-async-and-multi-core-execution-first-class.md',
              'docs/proposed/investment-decisions-r2-foundation-public-contract.md',
              'docs/proposed/investment-decisions-lifecycle-model.md',
              'docs/proposed/investment-decisions-decision-relationship-model.md',
              'docs/proposed/application-use-cases-investment-decision-lifecycle.md',
              'docs/proposed/durable-persistence-investment-decision-history.md',
              'src/polaris/application/__init__.py',
              'src/polaris/application/decisions/__init__.py',
              'src/polaris/application/decisions/contracts.py',
              'src/polaris/application/decisions/initiation.py',
              'src/polaris/application/decisions/lifecycle_correction.py',
              'src/polaris/application/decisions/memory.py',
              'src/polaris/application/decisions/ordinary_work.py',
              'src/polaris/application/decisions/relationships.py',
              'tests/application/decisions/test_initiation.py',
              'tests/application/decisions/test_lifecycle_correction.py',
              'tests/application/decisions/test_memory.py',
              'tests/application/decisions/test_ordinary_work.py',
              'tests/application/decisions/test_relationships.py',
              'tests/application/decisions/test_resolution.py',
          ]
          for path in evidence_files:
              add_file(parts, path)

          prompt = '\n'.join(parts)
          command = [
              'copilot', '-s',
              '--no-custom-instructions',
              '--disable-builtin-mcps',
              '--deny-tool=shell,write,url,memory',
              '--no-ask-user',
              '--no-remote',
              '--no-remote-export',
          ]
          result = subprocess.run(command, input=prompt, text=True, capture_output=True, check=False)
          if result.returncode != 0:
              sys.stderr.write(result.stderr)
              raise SystemExit(result.returncode)
          output.write_text(result.stdout, encoding='utf-8')
          PY

      - name: Validate reviewer coverage and reusable proof
        run: |
          set -euo pipefail
          python - "$REVIEW_ROOT" <<'PY'
          from __future__ import annotations
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          result = json.loads((root / 'review-result.json').read_text(encoding='utf-8'))
          checkpoint = json.loads((root / 'checkpoint.json').read_text(encoding='utf-8'))
          standards = json.loads((root / 'standards-universe.json').read_text(encoding='utf-8'))
          arch = json.loads((root / 'architecture-universe.json').read_text(encoding='utf-8'))

          assert result['reviewer_execution'] == 'fresh-github-actions-copilot-single-reviewer-three-axis-passes'
          allowed = {'checked-no-finding', 'blocking', 'advisory', 'not-applicable'}

          std_expected = [row['candidate'] for row in standards]
          std_rows = result['standards']['coverage']
          std_actual = [row['candidate'] for row in std_rows]
          assert len(std_actual) == len(set(std_actual)) == len(std_expected)
          assert set(std_actual) == set(std_expected)
          for row in std_rows:
              assert row['scope'] in {'in-scope', 'out-of-scope'}
              assert row['standards_disposition'] in allowed
              if row['scope'] == 'out-of-scope':
                  assert row['standards_disposition'] == 'not-applicable'

          spec_expected = [row['cell'] for row in checkpoint['manifest']]
          spec_rows = result['spec']['coverage']
          spec_actual = [row['cell'] for row in spec_rows]
          assert len(spec_actual) == len(set(spec_actual)) == 122
          assert set(spec_actual) == set(spec_expected)
          assert all(row['disposition'] in allowed for row in spec_rows)

          supplied_arch = [row['cell'] for row in arch]
          added = result['architecture'].get('added_cells', [])
          added_ids = [row['cell'] for row in added]
          assert len(added_ids) == len(set(added_ids))
          assert not (set(supplied_arch) & set(added_ids))
          arch_expected = supplied_arch + added_ids
          arch_rows = result['architecture']['coverage']
          arch_actual = [row['cell'] for row in arch_rows]
          assert len(arch_actual) == len(set(arch_actual)) == len(arch_expected)
          assert set(arch_actual) == set(arch_expected)
          assert all(row['disposition'] in allowed for row in arch_rows)

          for axis_name, id_key, disposition_key in (
              ('standards', 'candidate', 'standards_disposition'),
              ('spec', 'cell', 'disposition'),
              ('architecture', 'cell', 'disposition'),
          ):
              axis = result[axis_name]
              rows = axis['coverage']
              clean = {
                  row[id_key]
                  for row in rows
                  if row[disposition_key] in {'checked-no-finding', 'not-applicable'}
              }
              finding = {
                  row[id_key]
                  for row in rows
                  if row[disposition_key] in {'blocking', 'advisory'}
              }
              proof_cells = []
              for group in axis['proof_groups']:
                  assert group['disposition'] in {'checked-no-finding', 'not-applicable'}
                  assert group['invalidation_boundary']
                  proof_cells.extend(group['cells'])
              assert len(proof_cells) == len(set(proof_cells))
              assert set(proof_cells) == clean
              assert not (set(proof_cells) & finding)
              assert not axis.get('challenge_triggers')

          summary = {
              'standards_candidates': len(std_rows),
              'spec_cells': len(spec_rows),
              'architecture_cells': len(arch_rows),
              'standards_blocking': len(result['standards']['blocking']),
              'standards_advisory': len(result['standards']['advisory']),
              'spec_blocking': len(result['spec']['blocking']),
              'spec_advisory': len(result['spec']['advisory']),
              'architecture_blocking': len(result['architecture']['blocking']),
              'architecture_advisory': len(result['architecture']['advisory']),
          }
          (root / 'review-summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print('Fresh review coverage validation: PASS')
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Expose bounded review result
        run: |
          set -euo pipefail
          echo '=== REVIEW-SUMMARY ==='
          cat "$REVIEW_ROOT/review-summary.json"
          echo '=== REVIEW-RESULT-BEGIN ==='
          cat "$REVIEW_ROOT/review-result.json"
          echo '=== REVIEW-RESULT-END ==='

      - uses: actions/upload-artifact@v4
        with:
          name: review-spec-279-fresh-review
          path: |
            ${{ env.REVIEW_ROOT }}/review-result.json
            ${{ env.REVIEW_ROOT }}/review-summary.json
            ${{ env.REVIEW_ROOT }}/checkpoint.json
            ${{ env.REVIEW_ROOT }}/provenance.json
            ${{ env.REVIEW_ROOT }}/standards-universe.json
            ${{ env.REVIEW_ROOT }}/architecture-universe.json
          if-no-files-found: error
          retention-days: 1
