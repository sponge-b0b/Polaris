name: ChatGPT Spec 280 wiki audit

on:
  push:
    branches:
      - chatgpt/verify-spec-280-contract

permissions:
  contents: read

jobs:
  wiki-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec-280
          fetch-depth: 0

      - name: Pin exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "af9937141acdec7ca463b9a825be7fdb5715232c"
          test -z "$(git status --porcelain)"

      - name: Materialize deterministic wiki audit coverage
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import re
          from pathlib import Path

          root = Path(".")
          wiki = root / "wiki"
          entities_dir = wiki / "entities"
          index = (wiki / "index.md").read_text()
          template = (wiki / "_template.md").read_text()
          ignore_path = root / "docs" / ".wikiignore"

          problems: list[str] = []
          rows = []
          for line in index.splitlines():
              m = re.match(r"^\| \[([^]]+)\]\(entities/([^)]+)\.md\) \| ([^|]+) \| ([^|]+) \| ([^|]+) \| ([^|]+) \|$", line)
              if m:
                  rows.append(tuple(x.strip() for x in m.groups()))

          entity_files = sorted(p.stem for p in entities_dir.glob("*.md"))
          row_ids = sorted(r[1] for r in rows)
          if entity_files != row_ids:
              problems.append(f"entity/index mismatch files={entity_files} rows={row_ids}")

          seen=set()
          citations=[]
          claim_count=0
          open_questions=0
          for name, entity_id, category, impl, anchors, summary in rows:
              if entity_id in seen:
                  problems.append(f"duplicate entity id: {entity_id}")
              seen.add(entity_id)
              if impl not in {"present","pending"}:
                  problems.append(f"invalid implementation state: {entity_id}={impl}")
              if impl == "pending" and anchors != "—":
                  problems.append(f"pending entity has routing anchor: {entity_id}")
              if impl == "present":
                  count=0 if anchors=="—" else len([a for a in anchors.split("<br>") if a.strip()])
                  if count<1 or count>2:
                      problems.append(f"present entity routing anchor count: {entity_id}={count}")
              p=entities_dir/f"{entity_id}.md"
              text=p.read_text()
              if not re.match(rf"^# .+ \(Entity ID: {re.escape(entity_id)}\)\n",text):
                  problems.append(f"invalid title/entity id: {entity_id}")
              if "**Boundary Rationale:**" not in text:
                  problems.append(f"missing Boundary Rationale: {entity_id}")
              if not re.search(r"\*\*Boundary Rationale:\*\*.*?\n\(source: (?:docs/[^)]+|owner-approved entity boundary determination|owner-approved entity promotion)\)",text,re.S):
                  problems.append(f"invalid Boundary Rationale provenance: {entity_id}")
              for forbidden in ["linked_docs:", "last_updated:", "Category:", "Implementation:", "Routing Anchors:"]:
                  if forbidden in text:
                      problems.append(f"obsolete entity metadata {forbidden}: {entity_id}")
              section=None
              for ln in text.splitlines():
                  if ln.startswith("### "):
                      section=ln[4:]
                      if section=="Open Questions":
                          pass
                  if ln.lstrip().startswith("* "):
                      claim_count+=1
                      if section=="Open Questions":
                          open_questions+=1
                  for source in re.findall(r"source:\s*(docs/[^);]+)",ln):
                      citations.append((entity_id,section,source.strip()))

          # Validate .wikiignore grammar and apply exact/directory exclusions.
          entries=[]
          for raw in ignore_path.read_text().splitlines():
              s=raw.strip()
              if not s or s.startswith("#"):
                  continue
              bad = s.startswith("/") or "\\" in s or any(part in {".",".."} for part in s.rstrip("/").split("/")) or any(ch in s for ch in "*?![")
              if bad:
                  problems.append(f"invalid .wikiignore entry: {s}")
              else:
                  entries.append(s)
          def ignored(rel: str)->bool:
              for e in entries:
                  if e.endswith("/") and (rel==e[:-1] or rel.startswith(e)):
                      return True
                  if not e.endswith("/") and rel==e:
                      return True
              return False

          docs=[p for p in (root/"docs").rglob("*") if p.is_file() and p != ignore_path]
          unclassified=[]
          for p in docs:
              rel=p.relative_to(root/"docs").as_posix()
              if ignored(rel):
                  continue
              parts=rel.split("/")
              ok = parts[0] in {"adr","current","proposed","research","reference","process"}
              if not ok:
                  unclassified.append("docs/"+rel)
          if unclassified:
              problems.append("unclassified docs: "+", ".join(unclassified))

          eligible={"Strict Invariants":{"adr","current"},"Planned":{"adr","proposed"}}
          broken=[]
          ineligible=[]
          for entity,section,src in citations:
              p=root/src
              if not p.exists():
                  broken.append((entity,section,src))
                  continue
              parts=Path(src).parts
              cls=parts[1] if len(parts)>1 else ""
              if section in eligible and cls not in eligible[section]:
                  ineligible.append((entity,section,src))
          if broken:
              problems.append("broken citations: "+repr(broken))
          if ineligible:
              problems.append("section-ineligible citations: "+repr(ineligible))

          # Explicitly account for every docs file after exclusions.
          classified_docs = sum(
              1 for p in docs
              if not ignored(p.relative_to(root/"docs").as_posix())
              and p.relative_to(root/"docs").parts[0] in {"adr","current","proposed","research","reference","process"}
          )
          print(f"INDEX_ROWS={len(rows)}")
          print(f"ENTITY_FILES={len(entity_files)}")
          print(f"CLAIM_ROWS={claim_count}")
          print(f"OPEN_QUESTIONS={open_questions}")
          print(f"INLINE_DOC_CITATIONS={len(citations)}")
          print(f"DOC_FILES_TOTAL={len(docs)}")
          print(f"WIKIIGNORE_ENTRIES={len(entries)}")
          print(f"CLASSIFIED_DOCS={classified_docs}")
          print(f"UNCLASSIFIED_DOCS={len(unclassified)}")
          print(f"BROKEN_CITATIONS={len(broken)}")
          print(f"INELIGIBLE_CITATIONS={len(ineligible)}")
          print(f"STRUCTURAL_PROBLEMS={len(problems)}")
          for problem in problems:
              print("PROBLEM:",problem)
          if problems:
              raise SystemExit(1)
          PY

      - name: Candidate mutation guard
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "af9937141acdec7ca463b9a825be7fdb5715232c"
          test -z "$(git status --porcelain)"
