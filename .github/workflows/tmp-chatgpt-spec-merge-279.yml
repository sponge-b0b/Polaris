name: Temporary ChatGPT complete Spec 279 lifecycle
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-chatgpt-spec-merge-279.yml
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run final post-merge cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: sponge-b0b/Polaris
          EXPECTED_PRE_MAIN: ae5f3a2d7f5c2f2cdeb6c8df0d6299d92dbf72eb
          EXPECTED_HEAD: e2d59797ebcaf4b87b3c2c941fb08bffc2213dd7
          EXPECTED_MERGE_SHA: e44ae859d1dec3652aa0c9096231d51106ef086a
        shell: bash
        run: |
          set -euo pipefail
          cp .github/tmp-chatgpt-spec-merge-279.py "$RUNNER_TEMP/spec-merge-279.py"
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'spec-merge-279.py'
          text = path.read_text()
          old = '''git("fetch", "origin", "main", "spec-279")
require(git("rev-parse", "origin/main").stdout.strip() == CREATE_SHA, "main moved before post-merge recovery")
require(git("rev-parse", "origin/spec-279").stdout.strip() == HEAD, "spec-279 moved after merge")'''
          new = '''git("fetch", "origin", "main")
require(git("rev-parse", "origin/main").stdout.strip() == CREATE_SHA, "main moved before post-merge recovery")'''
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
          python "$RUNNER_TEMP/spec-merge-279.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-279-merge-cleanup-final
          path: |
            completion-metadata.json
            project-reconstruction.txt
            dependency-reconstruction.txt
            project-tracking-status.txt
