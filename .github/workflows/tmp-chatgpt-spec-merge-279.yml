name: Temporary ChatGPT complete Spec 279 lifecycle
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-chatgpt-spec-merge-279.yml
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  complete:
    if: github.event.head_commit.message == 'chore(workflow): complete Spec 279 lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Revalidate durable completion authority
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: sponge-b0b/Polaris
          SPEC: '279'
          REVIEW: '310'
          PR: '320'
          EXPECTED_PRE_MAIN: ae5f3a2d7f5c2f2cdeb6c8df0d6299d92dbf72eb
          EXPECTED_HEAD: e2d59797ebcaf4b87b3c2c941fb08bffc2213dd7
          EXPECTED_BASELINE: 4daed9034891600597a47c01b6c39d5ebd9914ca
          EXPECTED_BODY_HASH: 5f59ee666c65e9e93fe3b69403dbf4bc5328332d14d6339fc55b067755e4eb17
          EXPECTED_CONTRACT_HASH: ab243bb1e38159aef9de1a87dd6ad4de43773c093f2149dc83e2ca81087411f2
          EXPECTED_LEDGER_HASH: efb77d7faafd0d0641b4f874bece20cea875db6f6f3b9f60e2c24c1ea710d839
          VERIFY_COMMENT: '5688872157'
          LEDGER_COMMENT: '5662220111'
          EXIT_COMMENT: '5689504777'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PRE_MAIN"
          CHANGED=$(git diff --name-only "$EXPECTED_PRE_MAIN" "$GITHUB_SHA")
          test "$CHANGED" = ".github/workflows/tmp-chatgpt-spec-merge-279.yml"

          git fetch origin main spec-279
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/spec-279)" = "$EXPECTED_HEAD"

          gh api "repos/$REPO/issues/$SPEC" > "$RUNNER_TEMP/spec.json"
          gh api "repos/$REPO/issues/$REVIEW" > "$RUNNER_TEMP/review.json"
          test "$(jq -r .state "$RUNNER_TEMP/spec.json")" = open
          test "$(jq -r .state "$RUNNER_TEMP/review.json")" = open
          jq -j .body "$RUNNER_TEMP/spec.json" > "$RUNNER_TEMP/spec-body.md"
          test "$(sha256sum "$RUNNER_TEMP/spec-body.md" | awk '{print $1}')" = "$EXPECTED_BODY_HASH"

          SPEC_COMMENTS=$(mktemp)
          REVIEW_COMMENTS=$(mktemp)
          gh api --paginate --slurp "repos/$REPO/issues/$SPEC/comments?per_page=100" > "$SPEC_COMMENTS"
          gh api --paginate --slurp "repos/$REPO/issues/$REVIEW/comments?per_page=100" > "$REVIEW_COMMENTS"

          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path

          def flatten(path: str):
              pages = json.loads(Path(path).read_text())
              return [item for page in pages for item in page]

          spec_comments = flatten(os.environ['SPEC_COMMENTS'])
          review_comments = flatten(os.environ['REVIEW_COMMENTS'])
          head = os.environ['EXPECTED_HEAD']
          baseline = os.environ['EXPECTED_BASELINE']
          body_hash = os.environ['EXPECTED_BODY_HASH']
          contract_hash = os.environ['EXPECTED_CONTRACT_HASH']

          workspace = [c for c in spec_comments if '## Workspace Metadata' in (c.get('body') or '')]
          assert len(workspace) == 1, len(workspace)
          wb = workspace[0]['body']
          assert f'**Baseline Commit Hash:** {baseline}' in wb
          assert '**Branch:** spec-279' in wb

          receipts = [c for c in spec_comments
                      if '## Spec Verification Receipt' in (c.get('body') or '')
                      and '**Status:** passed' in c['body']
                      and f'**Verified HEAD:** {head}' in c['body']]
          assert receipts, 'matching Spec Verification Receipt missing'
          receipts.sort(key=lambda c: (c.get('created_at') or '', c['id']))
          vr = receipts[-1]
          assert str(vr['id']) == os.environ['VERIFY_COMMENT'], vr['id']
          vb = vr['body']
          for required in (
              f'**Verified Baseline:** {baseline}',
              '**Branch:** spec-279',
              f'**Spec Body Hash:** {body_hash}',
              f'**Spec Contract Hash:** {contract_hash}',
          ):
              assert required in vb, required

          ledgers = [c for c in review_comments if '<!-- review-spec-finding-ledger:v1 -->' in (c.get('body') or '')]
          assert len(ledgers) == 1, len(ledgers)
          ledger = ledgers[0]
          assert str(ledger['id']) == os.environ['LEDGER_COMMENT']
          lb = ledger['body']
          assert f'**Reviewed HEAD:** {head}' in lb
          assert f'**Spec Body Hash:** {body_hash}' in lb
          assert f'**Spec Contract Hash:** {contract_hash}' in lb
          digest = hashlib.sha256(lb.encode()).hexdigest()
          assert digest == os.environ['EXPECTED_LEDGER_HASH'], digest

          exits = [c for c in review_comments if '## Spec Review Exit Receipt' in (c.get('body') or '')]
          assert exits, 'Spec Review Exit Receipt missing'
          exits.sort(key=lambda c: (c.get('created_at') or '', c['id']))
          er = exits[-1]
          assert str(er['id']) == os.environ['EXIT_COMMENT'], er['id']
          eb = er['body']
          exact = {
              'Status': 'passed',
              'Spec Review': '#310',
              'Reviewed HEAD': head,
              'Reviewed Baseline': baseline,
              'Branch': 'spec-279',
              'Spec Body Hash': body_hash,
              'Spec Contract Hash': contract_hash,
              'Finding Ledger Hash': digest,
              'Blocking findings': '0',
              'Open blocking findings': '0',
              'Unaccounted prior findings': '0',
              'Unresolved continuity cells': '0',
              'Unresolved decomposition defects': '0',
              'Root blockers': 'satisfied/owner-overridden/scope-retired',
              'Candidate new roots': '0',
              'Review coverage': 'complete',
              'Unchecked coverage cells': '0',
          }
          for label, value in exact.items():
              assert f'**{label}:** {value}' in eb, (label, value)

          # Direct reverse provenance on the Spec itself must be absent.
          provenance_text = Path(os.environ['RUNNER_TEMP'], 'spec-body.md').read_text() + '\n' + '\n'.join(
              c.get('body') or '' for c in spec_comments
          )
          assert 'wayfinder-source' not in provenance_text
          assert 'wayfinder-remediation' not in provenance_text
          PY
        env:
          SPEC_COMMENTS: ${{ runner.temp }}/spec-comments.json
          REVIEW_COMMENTS: ${{ runner.temp }}/review-comments.json

      - name: Revalidate independent governance and exact PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: sponge-b0b/Polaris
          EXPECTED_HEAD: e2d59797ebcaf4b87b3c2c941fb08bffc2213dd7
          PR: '320'
        shell: bash
        run: |
          set -euo pipefail
          # Recreate paginated comment files used by this step without relying on shell state.
          gh api --paginate --slurp "repos/$REPO/issues/279/comments?per_page=100" > "$RUNNER_TEMP/spec279-comments.json"
          gh api --paginate --slurp "repos/$REPO/issues/280/comments?per_page=100" > "$RUNNER_TEMP/spec280-comments.json"
          gh api "repos/$REPO/issues/279" > "$RUNNER_TEMP/spec279.json"
          gh api "repos/$REPO/issues/280" > "$RUNNER_TEMP/spec280.json"
          gh api --paginate --slurp "repos/$REPO/issues?state=all&labels=wayfinder%3Amap&per_page=100" > "$RUNNER_TEMP/wayfinders.json"

          python - <<'PY'
          import json, re, os
          from pathlib import Path

          def flatten(path):
              pages = json.loads(Path(path).read_text())
              return [x for p in pages for x in p]

          specs = {}
          for n in (279, 280):
              issue = json.loads(Path(os.environ['RUNNER_TEMP'], f'spec{n}.json').read_text())
              comments = flatten(Path(os.environ['RUNNER_TEMP'], f'spec{n}-comments.json'))
              text = (issue.get('body') or '') + '\n' + '\n'.join(c.get('body') or '' for c in comments)
              assert 'wayfinder-source' not in text, f'#{n} has wayfinder-source'
              assert 'wayfinder-remediation' not in text, f'#{n} has wayfinder-remediation'
              specs[n] = text

          maps = flatten(Path(os.environ['RUNNER_TEMP'], 'wayfinders.json'))
          for wf in maps:
              number = wf['number']
              body = wf.get('body') or ''
              # Fetch comments lazily through gh in shell was intentionally avoided; canonical
              # forward handoffs are required in map body for this bounded governance recovery.
              for specn in (279, 280):
                  patterns = [
                      rf'(?im)^.*Spec Handoff.*#\s*{specn}\b',
                      rf'(?im)^.*Derived Spec.*#\s*{specn}\b',
                      rf'(?im)^.*Remediation Spec.*#\s*{specn}\b',
                  ]
                  assert not any(re.search(p, body) for p in patterns), (number, specn)
          PY

          gh api "repos/$REPO/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          test "$(jq -r .state "$RUNNER_TEMP/pr.json")" = open
          test "$(jq -r .base.ref "$RUNNER_TEMP/pr.json")" = main
          test "$(jq -r .head.ref "$RUNNER_TEMP/pr.json")" = spec-279
          test "$(jq -r .head.sha "$RUNNER_TEMP/pr.json")" = "$EXPECTED_HEAD"
          test "$(jq -r .mergeable "$RUNNER_TEMP/pr.json")" = true
          test "$(jq -r .mergeable_state "$RUNNER_TEMP/pr.json")" = clean

      - name: Merge exact reviewed head and verify Spec completion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: sponge-b0b/Polaris
          PR: '320'
          EXPECTED_HEAD: e2d59797ebcaf4b87b3c2c941fb08bffc2213dd7
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PUT "repos/$REPO/pulls/$PR/merge" \
            -f merge_method=merge \
            -f sha="$EXPECTED_HEAD" > "$RUNNER_TEMP/merge.json"
          test "$(jq -r .merged "$RUNNER_TEMP/merge.json")" = true
          MERGE_SHA=$(jq -r .sha "$RUNNER_TEMP/merge.json")
          test -n "$MERGE_SHA" && test "$MERGE_SHA" != null

          gh api "repos/$REPO/pulls/$PR" > "$RUNNER_TEMP/pr-merged.json"
          test "$(jq -r .merged "$RUNNER_TEMP/pr-merged.json")" = true
          test "$(jq -r .head.sha "$RUNNER_TEMP/pr-merged.json")" = "$EXPECTED_HEAD"
          test "$(jq -r .merge_commit_sha "$RUNNER_TEMP/pr-merged.json")" = "$MERGE_SHA"
          MERGED_AT=$(jq -r .merged_at "$RUNNER_TEMP/pr-merged.json")
          test -n "$MERGED_AT" && test "$MERGED_AT" != null

          git fetch origin main spec-279
          test "$(git rev-parse origin/main)" = "$MERGE_SHA"
          git merge-base --is-ancestor "$EXPECTED_HEAD" origin/main
          test "$(git rev-parse "$MERGE_SHA^1")" = "$GITHUB_SHA"
          test "$(git rev-parse "$MERGE_SHA^2")" = "$EXPECTED_HEAD"

          gh api "repos/$REPO/issues/279" > "$RUNNER_TEMP/spec-after-merge.json"
          test "$(jq -r .state "$RUNNER_TEMP/spec-after-merge.json")" = closed

          jq -n --arg merge_sha "$MERGE_SHA" --arg merged_at "$MERGED_AT" \
            '{merge_sha:$merge_sha,merged_at:$merged_at}' > "$GITHUB_WORKSPACE/spec-279-merge.json"

      - name: Safely remove reviewed Spec branch and close Spec Review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: sponge-b0b/Polaris
          EXPECTED_HEAD: e2d59797ebcaf4b87b3c2c941fb08bffc2213dd7
          REVIEW: '310'
          PR: '320'
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SPEC_HEAD=$(git ls-remote --heads origin refs/heads/spec-279 | awk '{print $1}')
          if [ -n "$REMOTE_SPEC_HEAD" ]; then
            test "$REMOTE_SPEC_HEAD" = "$EXPECTED_HEAD"
            git push origin --delete spec-279
          fi
          test -z "$(git ls-remote --heads origin refs/heads/spec-279 | awk '{print $1}')"

          COMMENT_BODY="Spec merged (PR #$PR) and branch cleaned up. Zero blocking findings on final review."
          jq -n --arg body "$COMMENT_BODY" '{body:$body}' > "$RUNNER_TEMP/review-close-comment.json"
          gh api --method POST "repos/$REPO/issues/$REVIEW/comments" \
            --input "$RUNNER_TEMP/review-close-comment.json" > "$RUNNER_TEMP/review-close-comment-response.json"
          REVIEW_COMPLETED_AT=$(jq -r .created_at "$RUNNER_TEMP/review-close-comment-response.json")
          test -n "$REVIEW_COMPLETED_AT" && test "$REVIEW_COMPLETED_AT" != null
          gh api --method PATCH "repos/$REPO/issues/$REVIEW" -f state=closed -f state_reason=completed > "$RUNNER_TEMP/review-closed.json"
          test "$(jq -r .state "$RUNNER_TEMP/review-closed.json")" = closed
          jq -n --arg completed_at "$REVIEW_COMPLETED_AT" '{completed_at:$completed_at}' > "$GITHUB_WORKSPACE/spec-review-310-close.json"

      - name: Reconstruct completed Spec lineage and dependency frontier
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: sponge-b0b/Polaris
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$REPO/issues/279/sub_issues?per_page=100" > "$RUNNER_TEMP/spec-children.json"
          gh api --paginate --slurp "repos/$REPO/issues/310/sub_issues?per_page=100" > "$RUNNER_TEMP/review-children.json"

          python - <<'PY'
          import json, os
          from pathlib import Path
          def flatten(name):
              pages=json.loads(Path(os.environ['RUNNER_TEMP'],name).read_text())
              return [x for p in pages for x in p]
          spec=flatten('spec-children.json')
          review=flatten('review-children.json')
          assert {x['number'] for x in spec} == {301,302,303,304,305,306}, {x['number'] for x in spec}
          assert all(x['state']=='closed' for x in spec)
          assert {x['number'] for x in review} == {311,314,315,316,317}, {x['number'] for x in review}
          assert all(x['state']=='closed' for x in review)
          PY

          # Read the dependent Spec's full native blocker set after #279 completion.
          if gh api --paginate --slurp "repos/$REPO/issues/280/dependencies/blocked_by?per_page=100" > "$RUNNER_TEMP/280-blockers.json" 2>"$RUNNER_TEMP/280-blockers.err"; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          pages=json.loads(Path(os.environ['RUNNER_TEMP'],'280-blockers.json').read_text())
          blockers=[x for p in pages for x in p]
          assert any(x['number']==279 for x in blockers), blockers
          assert all(x['state']=='closed' for x in blockers), blockers
          Path(os.environ['GITHUB_WORKSPACE'],'dependency-reconstruction.txt').write_text('DEPENDENCY RECONSTRUCTION: COMPLETE\nDependent Spec: #280\nOpen blockers: 0\n')
          PY
          else
            printf '%s\n' 'DEPENDENCY RECONSTRUCTION: DRIFT' 'Dependent Spec: #280' 'Cause: native blocked-by set unreadable after authoritative #279 completion' > "$GITHUB_WORKSPACE/dependency-reconstruction.txt"
          fi

          cat > "$GITHUB_WORKSPACE/project-reconstruction.txt" <<'EOF'
          Project reconstruction source: Spec #279
          Spec: 1
          Implementation Tickets: 6/6
          Spec Review: 1
          Review Remediation Tickets: 5/5
          Governing Wayfinders: 0/0
          Wayfinder Decisions: 0/0
          Direct dependent Specs considered: 1
          Other required formal artifacts: 0
          Unresolved lifecycle projections: 0
          PROJECT DELIVERY: OUTSIDE OWNER
          Governance: Independent Spec lineage
          EOF

      - name: Attempt mandatory Project reconstruction sync once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: sponge-b0b/Polaris
          OWNER: sponge-b0b
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/project_sync.py" <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path

          REPO=os.environ['REPO']; OWNER=os.environ['OWNER']; RT=Path(os.environ['RUNNER_TEMP']); WS=Path(os.environ['GITHUB_WORKSPACE'])
          STATUS=WS/'project-tracking-status.txt'

          def run(args, check=True):
              p=subprocess.run(args, text=True, capture_output=True)
              if check and p.returncode:
                  raise RuntimeError((p.stderr or p.stdout).strip() or f'command failed: {args}')
              return p

          def drift(reason):
              STATUS.write_text('PROJECT TRACKING: DRIFT\n'+reason.strip()+'\n')
              print(STATUS.read_text(), end='')
              return 0

          def gh_json(args):
              p=run(['gh',*args])
              return json.loads(p.stdout)

          # Completion dates must come from durable lifecycle comments, not closed_at.
          def issue_comments(n):
              data=gh_json(['api','--paginate','--slurp',f'repos/{REPO}/issues/{n}/comments?per_page=100'])
              return [x for page in data for x in page]

          def completion_date(n):
              comments=issue_comments(n)
              pats=('implement-ticket-closure-checkpoint:v2','TICKET CLOSURE: PASS','Root Closure Evidence','closure evidence')
              candidates=[c for c in comments if any(p.lower() in (c.get('body') or '').lower() for p in pats)]
              if not candidates:
                  raise RuntimeError(f'#{n} lacks durable ticket closure evidence')
              candidates.sort(key=lambda c: (c.get('updated_at') or c.get('created_at') or '', c['id']))
              stamp=candidates[-1].get('updated_at') or candidates[-1].get('created_at')
              if not stamp:
                  raise RuntimeError(f'#{n} closure evidence lacks timestamp')
              return stamp[:10]

          try:
              merge=json.loads((WS/'spec-279-merge.json').read_text())
              review_close=json.loads((WS/'spec-review-310-close.json').read_text())
              projections=[]
              projections.append(dict(number=279, artifact='Spec', workflow='Complete', next='None', work='Done', root='None', completed=merge['merged_at'][:10], delivery=None))
              for n in range(301,307):
                  projections.append(dict(number=n, artifact='Implementation Ticket', workflow='Complete', next='None', work='Done', root='None', completed=completion_date(n), delivery=None))
              projections.append(dict(number=310, artifact='Spec Review', workflow='Complete', next='None', work='Done', root='None', completed=review_close['completed_at'][:10], delivery=None))
              roots={311:'RB-1',314:'RB-2',315:'RB-3',316:'None',317:'None'}
              for n,root in roots.items():
                  projections.append(dict(number=n, artifact='Review Remediation Ticket', workflow='Complete', next='None', work='Done', root=root, completed=completion_date(n), delivery=None))
              dep=(WS/'dependency-reconstruction.txt').read_text()
              if 'COMPLETE' not in dep:
                  return_code=drift('Artifact: #280\nCause: dependent blocker reconstruction is unresolved; authoritative #279 completion remains valid')
                  sys.exit(return_code)
              projections.append(dict(number=280, artifact='Spec', workflow='Ready to Ticket', next='$to-tickets', work='Ready', root='None', completed=None, delivery='independent'))

              # Resolve the existing Project exactly once.
              p=run(['gh','project','list','--owner',OWNER,'--format','json'],check=False)
              if p.returncode:
                  sys.exit(drift('Cause: prescribed `gh project list` is unavailable with lifecycle credentials: '+(p.stderr or p.stdout).strip()))
              data=json.loads(p.stdout)
              projects=data.get('projects', data if isinstance(data,list) else [])
              matches=[x for x in projects if x.get('title')=='Polaris' and not x.get('closed',False)]
              if len(matches)!=1:
                  sys.exit(drift(f'Cause: expected exactly one open Polaris Project, found {len(matches)}'))
              project=matches[0]; pnum=str(project['number']); pid=project['id']

              # Read schema once.
              p=run(['gh','project','field-list',pnum,'--owner',OWNER,'--limit','100','--format','json'],check=False)
              if p.returncode:
                  sys.exit(drift('Cause: Project field schema unreadable: '+(p.stderr or p.stdout).strip()))
              fdata=json.loads(p.stdout); fields=fdata.get('fields', fdata if isinstance(fdata,list) else [])
              byname={f['name']:f for f in fields}
              required=['Artifact Type','Workflow State','Next Skill','Work Status','Intake State','Priority','Area','Root Blocker','Completed On','Delivery State']
              missing=[x for x in required if x not in byname]
              if missing:
                  sys.exit(drift('Cause: missing Project schema fields: '+', '.join(missing)))
              options={name:{o['name']:o['id'] for o in byname[name].get('options',[])} for name in ('Artifact Type','Workflow State','Next Skill','Work Status','Intake State','Priority','Area','Delivery State')}

              requested_fields=['Artifact Type','Workflow State','Delivery State','Next Skill','Work Status','Intake State','Priority','Area','Root Blocker','Completed On']
              def read_rows():
                  cmd=['gh','project','item-list',pnum,'--owner',OWNER,'--limit','1000']
                  for f in requested_fields: cmd += ['--field',f]
                  q=run(cmd,check=False)
                  if q.returncode: raise RuntimeError('Project affected-row read failed: '+(q.stderr or q.stdout).strip())
                  rows={}
                  for line in q.stdout.splitlines():
                      parts=line.split('\t')
                      idx=next((i for i,v in enumerate(parts) if v.startswith('PVTI_')),None)
                      if idx is None: continue
                      repo_idx=next((i for i,v in enumerate(parts) if v==REPO),None)
                      num_idx=next((i for i,v in enumerate(parts) if re.fullmatch(r'#?\d+',v or '')),None)
                      if repo_idx is None or num_idx is None: continue
                      n=int(parts[num_idx].lstrip('#'))
                      tail=parts[idx+1:]
                      if len(tail)!=len(requested_fields):
                          raise RuntimeError(f'unreadable Project row shape for #{n}: expected {len(requested_fields)} custom fields after item id, got {len(tail)}')
                      rows[n]={'id':parts[idx],'values':dict(zip(requested_fields,tail))}
                  return rows

              try:
                  rows=read_rows()
              except RuntimeError as e:
                  sys.exit(drift('Cause: '+str(e)))

              targets={p['number'] for p in projections}
              missing_members=[p for p in projections if p['number'] not in rows]
              for proj in missing_members:
                  url=f'https://github.com/{REPO}/issues/{proj["number"]}'
                  a=run(['gh','project','item-add',pnum,'--owner',OWNER,'--url',url,'--format','json'],check=False)
                  if a.returncode:
                      sys.exit(drift(f'Artifact: #{proj["number"]}\nCause: Project membership add failed: '+(a.stderr or a.stdout).strip()))
              if missing_members:
                  try: rows=read_rows()
                  except RuntimeError as e: sys.exit(drift('Cause: '+str(e)))
              if any(n not in rows for n in targets):
                  sys.exit(drift('Cause: one or more reconstructed artifacts remain absent from Project after membership reconciliation'))

              # Validate requested single-select options before mutation.
              for proj in projections:
                  needed={'Artifact Type':proj['artifact'],'Workflow State':proj['workflow'],'Next Skill':proj['next'],'Work Status':proj['work']}
                  if proj['workflow']=='Complete': needed['Delivery State']='Released'
                  else: needed['Delivery State']='Independent'
                  for field,val in needed.items():
                      if val not in options[field]:
                          sys.exit(drift(f'Artifact: #{proj["number"]}\nCause: missing option {field}={val}'))

              deltas=[]
              def set_select(proj, field, value):
                  if rows[proj['number']]['values'].get(field,'') != value:
                      deltas.append(('select',proj['number'],field,options[field][value]))
              def set_text(proj, field, value):
                  cur=rows[proj['number']]['values'].get(field,'')
                  if value=='None':
                      if cur: deltas.append(('clear',proj['number'],field,None))
                  elif cur!=value: deltas.append(('text',proj['number'],field,value))
              def set_date(proj, field, value):
                  cur=rows[proj['number']]['values'].get(field,'')
                  if value is None:
                      if cur: deltas.append(('clear',proj['number'],field,None))
                  elif cur!=value: deltas.append(('date',proj['number'],field,value))

              for proj in projections:
                  set_select(proj,'Artifact Type',proj['artifact'])
                  set_select(proj,'Workflow State',proj['workflow'])
                  set_select(proj,'Next Skill',proj['next'])
                  set_select(proj,'Work Status',proj['work'])
                  set_select(proj,'Delivery State','Released' if proj['workflow']=='Complete' else 'Independent')
                  set_text(proj,'Root Blocker',proj['root'])
                  set_date(proj,'Completed On',proj['completed'])
                  if rows[proj['number']]['values'].get('Intake State',''):
                      deltas.append(('clear',proj['number'],'Intake State',None))

              if deltas:
                  fields_by_name={n:byname[n]['id'] for n in required}
                  aliases=[]
                  for i,(kind,n,field,val) in enumerate(deltas,1):
                      item=rows[n]['id']; fid=fields_by_name[field]; alias=f'u{i}'
                      if kind=='clear':
                          aliases.append(f'{alias}: clearProjectV2ItemFieldValue(input:{{projectId:{json.dumps(pid)},itemId:{json.dumps(item)},fieldId:{json.dumps(fid)}}}){{projectV2Item{{id}}}}')
                      else:
                          key={'select':'singleSelectOptionId','text':'text','date':'date'}[kind]
                          aliases.append(f'{alias}: updateProjectV2ItemFieldValue(input:{{projectId:{json.dumps(pid)},itemId:{json.dumps(item)},fieldId:{json.dumps(fid)},value:{{{key}:{json.dumps(val)}}}}}){{projectV2Item{{id}}}}')
                  mutation='mutation {\n'+'\n'.join(aliases)+'\n}'
                  m=run(['gh','api','graphql','-f','query='+mutation],check=False)
                  if m.returncode:
                      sys.exit(drift('Cause: batched Project field mutation failed: '+(m.stderr or m.stdout).strip()))
                  response=json.loads(m.stdout)
                  if response.get('errors'):
                      sys.exit(drift('Cause: GraphQL errors: '+json.dumps(response['errors'])))
                  for i in range(1,len(deltas)+1):
                      if not (((response.get('data') or {}).get(f'u{i}') or {}).get('projectV2Item') or {}).get('id'):
                          sys.exit(drift(f'Cause: Project mutation alias u{i} returned no item id'))

              try: final=read_rows()
              except RuntimeError as e: sys.exit(drift('Cause: final Project verification read failed: '+str(e)))
              problems=[]
              for proj in projections:
                  v=final.get(proj['number'],{}).get('values',{})
                  expected={'Artifact Type':proj['artifact'],'Workflow State':proj['workflow'],'Next Skill':proj['next'],'Work Status':proj['work'],'Delivery State':'Released' if proj['workflow']=='Complete' else 'Independent','Root Blocker':'' if proj['root']=='None' else proj['root'],'Completed On':proj['completed'] or '','Intake State':''}
                  for f,e in expected.items():
                      if v.get(f,'')!=e: problems.append(f'#{proj["number"]} {f}: {v.get(f,"")!r} != {e!r}')
              if problems:
                  sys.exit(drift('Unreconciled:\n'+'\n'.join(problems)))
              STATUS.write_text('PROJECT TRACKING: SYNCED\nArtifacts: #279, #301-#306, #310, #311, #314-#317, #280\n')
              print(STATUS.read_text(),end='')
          except Exception as exc:
              sys.exit(drift('Cause: '+str(exc)))
          PY
          python "$RUNNER_TEMP/project_sync.py"

      - name: Remove transport and prove clean product merge tree
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PRE_MAIN: ae5f3a2d7f5c2f2cdeb6c8df0d6299d92dbf72eb
          EXPECTED_HEAD: e2d59797ebcaf4b87b3c2c941fb08bffc2213dd7
        shell: bash
        run: |
          set -euo pipefail
          MERGE_SHA=$(jq -r .merge_sha "$GITHUB_WORKSPACE/spec-279-merge.json")
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$MERGE_SHA"
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-chatgpt-spec-merge-279.yml
          git commit -m "chore(workflow): clean Spec 279 merge transport"

          SYNTH_TREE=$(git merge-tree --write-tree "$EXPECTED_PRE_MAIN" "$EXPECTED_HEAD" | head -n1)
          FINAL_TREE=$(git rev-parse HEAD^{tree})
          test "$FINAL_TREE" = "$SYNTH_TREE"
          git push origin main
          printf '%s\n' "$(git rev-parse HEAD)" > "$GITHUB_WORKSPACE/final-main-head.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: spec-279-merge-cleanup
          path: |
            spec-279-merge.json
            spec-review-310-close.json
            project-reconstruction.txt
            dependency-reconstruction.txt
            project-tracking-status.txt
            final-main-head.txt
