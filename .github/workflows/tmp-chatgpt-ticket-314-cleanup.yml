name: Temporary ChatGPT ticket 314 cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-chatgpt-ticket-314-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary ticket 314 transport files
        run: |
          set -euo pipefail
          git config user.name "Bob Taylor"
          git config user.email "bobltaylorjr@gmail.com"
          git rm \
            .github/tmp/implement_314_candidate.py \
            .github/tmp/implement_314_refactor.py \
            .github/tmp/ticket_314_close.py \
            .github/tmp/ticket_314_closure_certifier.py \
            .github/tmp/ticket_314_frontier.py \
            .github/tmp/verify_314_final.py \
            .github/workflows/tmp-chatgpt-implement-314-final-v2.yml \
            .github/workflows/tmp-chatgpt-implement-314.yml \
            .github/workflows/tmp-chatgpt-ticket-314-close.yml \
            .github/workflows/tmp-chatgpt-ticket-314-closure-certifier.yml \
            .github/workflows/tmp-chatgpt-ticket-314-frontier.yml \
            .github/workflows/tmp-chatgpt-ticket-314-persist.yml \
            .github/workflows/tmp-chatgpt-ticket-314-cleanup.yml
          git commit -m "chore(workflow): remove ticket 314 temporary transports"
          git push origin HEAD:main
