name: Temporary ChatGPT ticket 314 certified persistence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-chatgpt-ticket-314-persist.yml

permissions:
  contents: write
  issues: read

jobs:
  persist:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout transport authority
        uses: actions/checkout@v4
        with:
          path: transport
          fetch-depth: 1

      - name: Checkout exact ticket branch
        uses: actions/checkout@v4
        with:
          ref: spec-279
          path: candidate
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Re-verify hierarchy, branch, baseline, and certified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          TICKET_BASELINE: 9081386b8fcbf65e117fdac6c7b8c776edaef8f0
          EXPECTED_STATE: 3f086c624e0164e7a25ea1201bdf858b7ccbcac8a36208dd62410cde3230fc44
        run: |
          set -euo pipefail
          test "$(git -C candidate branch --show-current)" = "spec-279"
          test "$(git -C candidate rev-parse HEAD)" = "$TICKET_BASELINE"
          test -z "$(git -C candidate status --porcelain)"
          test "$(gh api repos/sponge-b0b/Polaris/issues/314/parent --jq .number)" = "310"
          test "$(gh issue view 314 --repo sponge-b0b/Polaris --json body --jq .body | sed -n '/## Ticket branch/{n;p;}' | tr -d '`\r')" = "spec-279"
          test "$(gh issue view 314 --repo sponge-b0b/Polaris --json body --jq .body | sed -n '/## Ticket baseline/{n;p;}' | tr -d '`\r')" = "$TICKET_BASELINE"

          python transport/.github/tmp/implement_314_candidate.py
          python transport/.github/tmp/implement_314_refactor.py
          cd candidate
          uv run --locked ruff format \
            src/polaris/application/decisions/__init__.py \
            src/polaris/application/decisions/contracts.py \
            src/polaris/application/decisions/initiation.py \
            src/polaris/application/decisions/ordinary_work.py \
            src/polaris/application/decisions/relationships.py \
            tests/application/decisions/test_initiation.py \
            tests/application/decisions/test_ordinary_work.py \
            tests/application/decisions/test_relationships.py

          expected_files=$(cat <<'EOF'
src/polaris/application/decisions/__init__.py
src/polaris/application/decisions/contracts.py
src/polaris/application/decisions/initiation.py
src/polaris/application/decisions/ordinary_work.py
src/polaris/application/decisions/relationships.py
tests/application/decisions/test_initiation.py
tests/application/decisions/test_ordinary_work.py
tests/application/decisions/test_relationships.py
EOF
          )
          actual_files="$(git diff --name-only "$TICKET_BASELINE" -- | sort)"
          test "$actual_files" = "$(printf '%s\n' "$expected_files" | sort)"
          git diff --check "$TICKET_BASELINE" --

          python - <<'PY'
          import hashlib, os, stat, subprocess
          baseline = os.environ['TICKET_BASELINE']
          expected = os.environ['EXPECTED_STATE']
          def zpaths(*args):
              out = subprocess.run(['git', *args], check=True, stdout=subprocess.PIPE).stdout
              return [p for p in out.split(b'\0') if p]
          paths = set(zpaths('diff','--no-renames','--name-only','-z',baseline,'--'))
          paths.update(zpaths('ls-files','--others','--exclude-standard','-z'))
          digest = hashlib.sha256()
          for raw in sorted(paths):
              path = os.fsdecode(raw)
              digest.update(b'path\0' + raw + b'\0')
              try:
                  meta = os.lstat(path)
              except FileNotFoundError:
                  digest.update(b'state\0DELETED\0'); continue
              if stat.S_ISLNK(meta.st_mode):
                  mode = b'120000'; content = hashlib.sha256(os.fsencode(os.readlink(path))).hexdigest()
              elif stat.S_ISREG(meta.st_mode):
                  mode = b'100755' if meta.st_mode & stat.S_IXUSR else b'100644'
                  h = hashlib.sha256()
                  with open(path,'rb') as f:
                      for chunk in iter(lambda: f.read(1024*1024), b''): h.update(chunk)
                  content = h.hexdigest()
              else:
                  raise SystemExit(f'unsupported path type: {path}')
              digest.update(b'mode\0' + mode + b'\0sha256\0' + content.encode() + b'\0')
          actual = digest.hexdigest()
          print(f'PRE_COMMIT_CANDIDATE_STATE={actual}')
          if actual != expected:
              raise SystemExit(f'certified candidate mismatch: {actual}')
          PY

      - name: Commit and push exact certified candidate
        env:
          TICKET_BASELINE: 9081386b8fcbf65e117fdac6c7b8c776edaef8f0
          EXPECTED_STATE: 3f086c624e0164e7a25ea1201bdf858b7ccbcac8a36208dd62410cde3230fc44
        run: |
          set -euo pipefail
          cd candidate
          git config user.name "Bob Taylor"
          git config user.email "bobltaylorjr@gmail.com"
          git add \
            src/polaris/application/decisions/__init__.py \
            src/polaris/application/decisions/contracts.py \
            src/polaris/application/decisions/initiation.py \
            src/polaris/application/decisions/ordinary_work.py \
            src/polaris/application/decisions/relationships.py \
            tests/application/decisions/test_initiation.py \
            tests/application/decisions/test_ordinary_work.py \
            tests/application/decisions/test_relationships.py
          git commit -m "fix(application): own command-side read failures"
          commit_sha="$(git rev-parse HEAD)"

          python - <<'PY'
          import hashlib, os, stat, subprocess
          baseline = os.environ['TICKET_BASELINE']
          expected = os.environ['EXPECTED_STATE']
          def zpaths(*args):
              out = subprocess.run(['git', *args], check=True, stdout=subprocess.PIPE).stdout
              return [p for p in out.split(b'\0') if p]
          paths = set(zpaths('diff','--no-renames','--name-only','-z',baseline,'--'))
          paths.update(zpaths('ls-files','--others','--exclude-standard','-z'))
          digest = hashlib.sha256()
          for raw in sorted(paths):
              path = os.fsdecode(raw)
              digest.update(b'path\0' + raw + b'\0')
              try:
                  meta = os.lstat(path)
              except FileNotFoundError:
                  digest.update(b'state\0DELETED\0'); continue
              if stat.S_ISLNK(meta.st_mode):
                  mode = b'120000'; content = hashlib.sha256(os.fsencode(os.readlink(path))).hexdigest()
              elif stat.S_ISREG(meta.st_mode):
                  mode = b'100755' if meta.st_mode & stat.S_IXUSR else b'100644'
                  h = hashlib.sha256()
                  with open(path,'rb') as f:
                      for chunk in iter(lambda: f.read(1024*1024), b''): h.update(chunk)
                  content = h.hexdigest()
              else:
                  raise SystemExit(f'unsupported path type: {path}')
              digest.update(b'mode\0' + mode + b'\0sha256\0' + content.encode() + b'\0')
          actual = digest.hexdigest()
          print(f'POST_COMMIT_CANDIDATE_STATE={actual}')
          if actual != expected:
              raise SystemExit(f'post-commit candidate mismatch: {actual}')
          PY

          git push origin HEAD:spec-279
          echo "PERSISTED_COMMIT=$commit_sha"
