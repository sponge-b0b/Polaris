name: Temporary ChatGPT ticket 315 certified persistence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-chatgpt-ticket-315-persist.yml'

permissions:
  contents: write
  issues: write

jobs:
  persist:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout transport authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: transport
          fetch-depth: 1

      - name: Checkout ticket branch
        uses: actions/checkout@v4
        with:
          ref: spec-279
          path: candidate
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Re-verify hierarchy, baseline, checkpoint, and exact certified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          TICKET_BASELINE: 41bab9971d380b861cb7bbacd59ad2bdf5d9370f
          EXPECTED_STATE: 64ac0a239d7f472205063a45ae1d59b3815321f753afe67e8deb31658657b341
        run: |
          set -euo pipefail
          test "$(git -C candidate branch --show-current)" = "spec-279"
          test "$(git -C candidate rev-parse HEAD)" = "$TICKET_BASELINE"
          test -z "$(git -C candidate status --porcelain)"
          test "$(gh api repos/sponge-b0b/Polaris/issues/315/parent --jq .number)" = "310"
          gh issue view 315 --repo sponge-b0b/Polaris --json body > "$RUNNER_TEMP/ticket-315.json"
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          body = json.loads(Path(os.environ['RUNNER_TEMP'], 'ticket-315.json').read_text())['body']
          branch = re.search(r'## Ticket branch\s+`([^`]+)`', body)
          baseline = re.search(r'## Ticket baseline\s+`([^`]+)`', body)
          if branch is None or branch.group(1) != 'spec-279':
              raise SystemExit('ticket branch mismatch')
          expected = os.environ['TICKET_BASELINE']
          if baseline is None or baseline.group(1) != expected:
              raise SystemExit('ticket baseline mismatch')
          PY
          python transport/.github/tmp/ticket_315_persist.py
          python transport/.github/tmp/implement_315_candidate.py
          cd candidate
          uv run --locked ruff check --fix \
            src/polaris/application/decisions/relationships.py \
            tests/application/decisions/test_relationships.py
          uv run --locked ruff format \
            src/polaris/application/decisions/relationships.py \
            tests/application/decisions/test_relationships.py
          python - <<'PY'
          import hashlib, os, stat, subprocess
          baseline = os.environ['TICKET_BASELINE']
          expected = os.environ['EXPECTED_STATE']
          expected_files = sorted([
              'src/polaris/application/decisions/relationships.py',
              'tests/application/decisions/test_relationships.py',
          ])
          changed = subprocess.run(['git','diff','--name-only',baseline,'--'], check=True, text=True, capture_output=True).stdout.splitlines()
          if sorted(changed) != expected_files:
              raise SystemExit(f'unexpected changed files: {changed}')
          subprocess.run(['git','diff','--check',baseline,'--'], check=True)
          def zpaths(*args):
              out = subprocess.run(['git', *args], check=True, stdout=subprocess.PIPE).stdout
              return [p for p in out.split(b'\0') if p]
          paths = set(zpaths('diff','--no-renames','--name-only','-z',baseline,'--'))
          paths.update(zpaths('ls-files','--others','--exclude-standard','-z'))
          digest = hashlib.sha256()
          for raw in sorted(paths):
              path = os.fsdecode(raw)
              digest.update(b'path\0' + raw + b'\0')
              try:
                  meta = os.lstat(path)
              except FileNotFoundError:
                  digest.update(b'state\0DELETED\0'); continue
              if stat.S_ISLNK(meta.st_mode):
                  mode=b'120000'; content=hashlib.sha256(os.fsencode(os.readlink(path))).hexdigest()
              elif stat.S_ISREG(meta.st_mode):
                  mode=b'100755' if meta.st_mode & stat.S_IXUSR else b'100644'
                  h=hashlib.sha256()
                  with open(path,'rb') as f:
                      for chunk in iter(lambda: f.read(1024*1024), b''): h.update(chunk)
                  content=h.hexdigest()
              else:
                  raise SystemExit(f'unsupported path type: {path}')
              digest.update(b'mode\0'+mode+b'\0sha256\0'+content.encode()+b'\0')
          actual=digest.hexdigest()
          print(f'PRE_COMMIT_CANDIDATE_STATE={actual}')
          if actual != expected:
              raise SystemExit(f'certified candidate mismatch: {actual}')
          PY

      - name: Commit and push exact certified candidate
        working-directory: candidate
        env:
          TICKET_BASELINE: 41bab9971d380b861cb7bbacd59ad2bdf5d9370f
          EXPECTED_STATE: 64ac0a239d7f472205063a45ae1d59b3815321f753afe67e8deb31658657b341
        run: |
          set -euo pipefail
          git config user.name "Bob Taylor"
          git config user.email "bobltaylorjr@gmail.com"
          git add \
            src/polaris/application/decisions/relationships.py \
            tests/application/decisions/test_relationships.py
          git commit -m "fix(application): translate relationship construction failures"
          commit_sha="$(git rev-parse HEAD)"
          python - <<'PY'
          import hashlib, os, stat, subprocess
          baseline=os.environ['TICKET_BASELINE']; expected=os.environ['EXPECTED_STATE']
          def zpaths(*args):
              out=subprocess.run(['git',*args],check=True,stdout=subprocess.PIPE).stdout
              return [p for p in out.split(b'\0') if p]
          paths=set(zpaths('diff','--no-renames','--name-only','-z',baseline,'--'))
          paths.update(zpaths('ls-files','--others','--exclude-standard','-z'))
          digest=hashlib.sha256()
          for raw in sorted(paths):
              path=os.fsdecode(raw); digest.update(b'path\0'+raw+b'\0')
              try: meta=os.lstat(path)
              except FileNotFoundError: digest.update(b'state\0DELETED\0'); continue
              if stat.S_ISLNK(meta.st_mode): mode=b'120000'; content=hashlib.sha256(os.fsencode(os.readlink(path))).hexdigest()
              elif stat.S_ISREG(meta.st_mode):
                  mode=b'100755' if meta.st_mode & stat.S_IXUSR else b'100644'; h=hashlib.sha256()
                  with open(path,'rb') as f:
                      for chunk in iter(lambda: f.read(1024*1024),b''): h.update(chunk)
                  content=h.hexdigest()
              else: raise SystemExit(f'unsupported path type: {path}')
              digest.update(b'mode\0'+mode+b'\0sha256\0'+content.encode()+b'\0')
          actual=digest.hexdigest(); print(f'POST_COMMIT_CANDIDATE_STATE={actual}')
          if actual != expected: raise SystemExit(f'post-commit candidate mismatch: {actual}')
          PY
          git push origin HEAD:spec-279
          echo "PERSISTED_COMMIT=$commit_sha"
