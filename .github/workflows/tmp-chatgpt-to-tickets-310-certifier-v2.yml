name: Temporary ChatGPT to-tickets 310 proposal certifier v2

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: read
  copilot-requests: write

jobs:
  certify:
    if: "${{ github.event.head_commit.message == 'chore(workflow): arm to-tickets 310 proposal certifier v2' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: transport
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          ref: 386c47e694fe45134d482262af7851a4ea7686c0
          path: helper
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          ref: spec-279
          path: candidate
          fetch-depth: 0

      - name: Pin execution identities
        run: |
          set -euo pipefail
          test "$(git -C transport rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C helper rev-parse HEAD)" = "386c47e694fe45134d482262af7851a4ea7686c0"
          test "$(git -C candidate branch --show-current)" = "spec-279"
          test "$(git -C candidate rev-parse HEAD)" = "9081386b8fcbf65e117fdac6c7b8c776edaef8f0"
          test -z "$(git -C candidate status --porcelain)"
          test "$(git -C transport show HEAD:AGENTS.md | git hash-object --stdin)" = "66a1be7f0498f92ac9574d258443ec4cb8a15059"
          test "$(sha256sum transport/.github/tmp/to_tickets_310_proposal.md | awk '{print $1}')" = "4c1e32a2dc6c39fbd5e5bb0d5da0a53bd44b4cf10720af0a612c11b07cbc2b0c"
          test -f helper/.github/tmp/to_tickets_310_proposal_certifier.py

      - name: Prepare proposal-bound certifier wrapper
        run: |
          set -euo pipefail
          sed 's/6ea20c4a3e858acd10520f80e05b268c8b32cfcd4565e25783a3546f3510b446/4c1e32a2dc6c39fbd5e5bb0d5da0a53bd44b4cf10720af0a612c11b07cbc2b0c/g' \
            helper/.github/tmp/to_tickets_310_proposal_certifier.py \
            > "$RUNNER_TEMP/to_tickets_310_proposal_certifier_v2.py"
          test "$(grep -c '4c1e32a2dc6c39fbd5e5bb0d5da0a53bd44b4cf10720af0a612c11b07cbc2b0c' "$RUNNER_TEMP/to_tickets_310_proposal_certifier_v2.py")" -ge 1

      - name: Install current Copilot CLI
        run: npm install --global @github/copilot

      - name: Run fresh proposal certifier v2
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AUTO_UPDATE: "false"
          COPILOT_MCP_TOOL_CACHE: "false"
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/to_tickets_310_proposal_certifier_v2.py"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: to-tickets-310-proposal-certifier-v2
          path: ${{ env.CERT_ROOT }}/verdict.txt
          if-no-files-found: warn
          retention-days: 1
