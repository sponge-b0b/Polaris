name: Temporary ChatGPT to-tickets 310 drafting helper

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: read
  copilot-requests: write

jobs:
  draft:
    if: "${{ github.event.head_commit.message == 'chore(workflow): arm to-tickets 310 drafting helper' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: transport
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          ref: spec-279
          path: candidate
          fetch-depth: 0

      - name: Pin execution identities
        run: |
          set -euo pipefail
          test "$(git -C transport rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate branch --show-current)" = "spec-279"
          test "$(git -C candidate rev-parse HEAD)" = "9081386b8fcbf65e117fdac6c7b8c776edaef8f0"
          test -z "$(git -C candidate status --porcelain)"
          test "$(git -C transport show HEAD:AGENTS.md | git hash-object --stdin)" = "66a1be7f0498f92ac9574d258443ec4cb8a15059"
          test -f transport/.github/tmp/to_tickets_310_draft_helper.py

      - name: Install current Copilot CLI
        run: npm install --global @github/copilot

      - name: Run fresh non-certifying drafting helper
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AUTO_UPDATE: "false"
          COPILOT_MCP_TOOL_CACHE: "false"
        run: |
          set -euo pipefail
          python transport/.github/tmp/to_tickets_310_draft_helper.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: to-tickets-310-draft-helper
          path: ${{ env.DRAFT_ROOT }}/draft.json
          if-no-files-found: warn
          retention-days: 1
