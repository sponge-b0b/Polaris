name: Temporary ChatGPT to-tickets 310 publisher

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tmp-chatgpt-to-tickets-310-publish.yml"

permissions:
  contents: read
  issues: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Confirm prescribed gh relationship support
        shell: bash
        run: |
          set -euo pipefail
          gh --version
          version="$(gh --version | awk 'NR==1 {print $3}')"
          python - "$version" <<'PY'
          import sys
          from packaging.version import Version
          version = Version(sys.argv[1])
          minimum = Version("2.94.0")
          if version < minimum:
              raise SystemExit(f"gh {version} is below required {minimum}")
          print(f"gh relationship flags version gate: PASS ({version})")
          PY

      - name: Publish certified remediation tickets and manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/tmp/to_tickets_310_publish.py

      - name: Upload publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: to-tickets-310-publication
          path: ${{ env.PUBLISH_ROOT }}/publication.json
          if-no-files-found: warn
          retention-days: 7
