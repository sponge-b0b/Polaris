name: Temporary ChatGPT verify ticket 316 attempt 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-chatgpt-verify-316-v2.yml'

permissions:
  contents: read
  actions: read
  copilot-requests: write
  issues: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: transport
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          ref: e243c2c50b0d2a2ed4ee539f040fed53597a402f
          path: candidate
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v6

      - run: npm install --global @github/copilot

      - name: Restore exact Attempt-2 candidate
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/sponge-b0b/Polaris/actions/artifacts/10385655150/zip > "$RUNNER_TEMP/candidate.zip"
          unzip -q "$RUNNER_TEMP/candidate.zip" -d "$RUNNER_TEMP/ticket316"
          git apply "$RUNNER_TEMP/ticket316/candidate.patch"
          test "$(cat "$RUNNER_TEMP/ticket316/candidate-state.txt")" = 9e7248f3a868957fb660e4ade4367b9b7c0649ac75ff22e5e264728b85b9ffa9

      - name: Fresh independent ticket closure verification
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AUTO_UPDATE: 'false'
          COPILOT_MCP_TOOL_CACHE: 'false'
        run: |
          cat > "$RUNNER_TEMP/prompt.txt" <<'PROMPT'
          You are the genuinely fresh, non-mutating `$verify-ticket-closure` verifier leaf for Polaris ticket #316, Attempt 2. You did not implement either candidate and must not mutate files, Git, GitHub, issues, tracker state, or delegate semantic verification.

          Execute the current verifier procedure from `../transport/.agents/skills/verify-ticket-closure/SKILL.md` exactly. Read `AGENTS.md` and current main verification/hardening authority first. Recover durable ticket/lineage/checkpoint state independently rather than trusting this prompt as semantic authority.

          Immutable dispatch binding:
          - ticket #316 `Add atomic multi-relationship correction coordination`
          - mode remediation; Parent Spec #279; remediation parent Spec Review #310; DD-1/RF-3; Root None
          - Spec obligations None; Architecture obligations `ARCHSRC-1`
          - ticket branch `spec-279`
          - baseline `e243c2c50b0d2a2ed4ee539f040fed53597a402f`
          - Attempt-2 candidate state `9e7248f3a868957fb660e4ade4367b9b7c0649ac75ff22e5e264728b85b9ffa9`
          - checkpoint comment ID `5676233718`, marker `implement-ticket-closure-checkpoint:v2`, Stage `awaiting-closure-verification`, Attempt 2
          - exact candidate patch is already applied from Actions run 34940725105 artifact 10385655150.

          Attempt 1 independently failed because the candidate rejected two semantically identical sibling correction acts, violating the frozen rule that every distinct valid attributable correction appends even when equivalent and failing correction-multiset cardinality preservation. Attempt 2 claims to fix that with cardinality-preserving canonicalization. Re-prove the whole ticket; do not merely regression-test the prior finding.

          Independently recover and inspect:
          - full #316 ticket and native lineage;
          - #279 Ticket Coverage Manifest / Architecture Design Obligation mapping for ARCHSRC-1;
          - #310 DD-1/RF-3 decomposition record;
          - exact current closure checkpoint including Attempt-1 FAIL;
          - bounded governing architecture: Application Use Cases §§12–14,17; Relationship Model §5.4 and §§6.1–6.11 as required for correction semantics; Durable Persistence §§5,8; broaden only where bounded authority depends on another source.

          Freeze authority-source and acceptance universes before inspecting implementation/test evidence, per verifier skill. Challenge all ticket criteria and preservation obligations, especially:
          1. one-or-more correction MULTISET, including two or more equivalent distinct attributable sibling acts;
          2. request-local handles/order/generated IDs remain non-semantic, while graph/content/cardinality remain semantic;
          3. symmetric equivalent-parent / same-command ancestry canonicalization does not leak caller order or local names and does not collapse multiplicity;
          4. same semantic duplicate multiset reordered/renamed replays; 1-vs-2 or 2-vs-3 cardinality under same OperationId conflicts;
          5. complete final-history temporal mixed-lineage graph validation once across historical/future topology intervals; recursive restoration, sibling independence, contest, definite/possible cycle safety;
          6. exact endpoint expected versions plus complete non-endpoint/path/future/history/absence revalidation;
          7. atomic all-or-nothing commit with no visible tentative prefix; once-only support/basis-sensitive DecisionVersion and unchanged lifecycle sequence;
          8. singular `CorrectDecisionRelationshipCommand` historical `RelationshipCorrectionPayload` identity/replay compatibility;
          9. privileged/internal boundary, immutable append-only history, renewal and Supersession preservation;
          10. deterministic tests actually cover all architecture-required set boundaries, not just the implementation’s chosen happy paths.

          Run any needed read-only checks. Do not use formatters or `--fix`. A PASS must include complete authority/acceptance accounting and any required Certified Closure Domain records/counts. A FAIL must include all findings and classification/owner. End with exactly one line:
          `TICKET CLOSURE: PASS`
          or
          `TICKET CLOSURE: FAIL`
          PROMPT
          copilot -s --allow-all-tools --no-custom-instructions --disable-builtin-mcps --no-ask-user --no-remote --no-remote-export < "$RUNNER_TEMP/prompt.txt" | tee "$RUNNER_TEMP/verifier-output.txt"
          test "$(grep -c '^TICKET CLOSURE: PASS$\|^TICKET CLOSURE: FAIL$' "$RUNNER_TEMP/verifier-output.txt")" -eq 1

      - name: Verify immutable candidate after verifier
        working-directory: candidate
        env:
          TICKET_BASELINE: e243c2c50b0d2a2ed4ee539f040fed53597a402f
        run: |
          set -euo pipefail
          state=$(python - <<'PY'
          import hashlib, os, stat, subprocess
          baseline=os.environ['TICKET_BASELINE']
          def zpaths(*args):
              out=subprocess.run(['git',*args],check=True,stdout=subprocess.PIPE).stdout
              return [p for p in out.split(b'\0') if p]
          paths=set(zpaths('diff','--no-renames','--name-only','-z',baseline,'--')); paths.update(zpaths('ls-files','--others','--exclude-standard','-z'))
          d=hashlib.sha256()
          for raw in sorted(paths):
              path=os.fsdecode(raw); d.update(b'path\0'+raw+b'\0')
              try: meta=os.lstat(path)
              except FileNotFoundError: d.update(b'state\0DELETED\0'); continue
              if stat.S_ISLNK(meta.st_mode): mode=b'120000'; content=hashlib.sha256(os.fsencode(os.readlink(path))).hexdigest()
              elif stat.S_ISREG(meta.st_mode):
                  mode=b'100755' if meta.st_mode & stat.S_IXUSR else b'100644'; h=hashlib.sha256()
                  with open(path,'rb') as f:
                      for chunk in iter(lambda: f.read(1024*1024),b''): h.update(chunk)
                  content=h.hexdigest()
              else: raise SystemExit(path)
              d.update(b'mode\0'+mode+b'\0sha256\0'+content.encode()+b'\0')
          print(d.hexdigest())
          PY
          )
          test "$state" = 9e7248f3a868957fb660e4ade4367b9b7c0649ac75ff22e5e264728b85b9ffa9
          mkdir -p "$RUNNER_TEMP/ticket-316-verifier-attempt-2"
          cp "$RUNNER_TEMP/verifier-output.txt" "$RUNNER_TEMP/ticket-316-verifier-attempt-2/verifier-output.txt"
          printf '%s\n' "$state" > "$RUNNER_TEMP/ticket-316-verifier-attempt-2/candidate-state.txt"
          grep '^TICKET CLOSURE: PASS$\|^TICKET CLOSURE: FAIL$' "$RUNNER_TEMP/verifier-output.txt" > "$RUNNER_TEMP/ticket-316-verifier-attempt-2/verdict.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ticket-316-verifier-attempt-2
          path: ${{ runner.temp }}/ticket-316-verifier-attempt-2
          retention-days: 7
