name: Temporary ChatGPT verify ticket 317

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-chatgpt-verify-317.yml'

permissions:
  contents: read
  actions: read
  issues: read
  copilot-requests: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      TICKET_BASELINE: 36f06cf396e50409e432b99fa00941053fe83f02
      CANDIDATE_STATE: f75e44aa00a611bccd836ccb83041446a29aa1483d1424dc4cd4d651253955a2
      IMPLEMENT_ARTIFACT_ID: '10386915438'
      CHECKPOINT_COMMENT_ID: '5676814349'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: transport
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          ref: 36f06cf396e50409e432b99fa00941053fe83f02
          path: candidate
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v6

      - run: npm install --global @github/copilot

      - name: Restore and bind immutable candidate
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/sponge-b0b/Polaris/actions/artifacts/$IMPLEMENT_ARTIFACT_ID/zip > "$RUNNER_TEMP/candidate.zip"
          unzip -q "$RUNNER_TEMP/candidate.zip" -d "$RUNNER_TEMP/ticket317"
          test "$(cat "$RUNNER_TEMP/ticket317/candidate-state.txt")" = "$CANDIDATE_STATE"
          git apply "$RUNNER_TEMP/ticket317/candidate.patch"
          python - <<'PY' > "$RUNNER_TEMP/recomputed-state.txt"
          import hashlib, os, stat, subprocess
          baseline=os.environ['TICKET_BASELINE']
          def zpaths(*args):
              out=subprocess.run(['git',*args],check=True,stdout=subprocess.PIPE).stdout
              return [p for p in out.split(b'\0') if p]
          paths=set(zpaths('diff','--no-renames','--name-only','-z',baseline,'--'))
          paths.update(zpaths('ls-files','--others','--exclude-standard','-z'))
          d=hashlib.sha256()
          for raw in sorted(paths):
              path=os.fsdecode(raw); d.update(b'path\0'+raw+b'\0')
              try: meta=os.lstat(path)
              except FileNotFoundError:
                  d.update(b'state\0DELETED\0'); continue
              if stat.S_ISLNK(meta.st_mode):
                  mode=b'120000'; content=hashlib.sha256(os.fsencode(os.readlink(path))).hexdigest()
              elif stat.S_ISREG(meta.st_mode):
                  mode=b'100755' if meta.st_mode & stat.S_IXUSR else b'100644'; h=hashlib.sha256()
                  with open(path,'rb') as f:
                      for chunk in iter(lambda: f.read(1024*1024),b''): h.update(chunk)
                  content=h.hexdigest()
              else: raise SystemExit(path)
              d.update(b'mode\0'+mode+b'\0sha256\0'+content.encode()+b'\0')
          print(d.hexdigest())
          PY
          test "$(cat "$RUNNER_TEMP/recomputed-state.txt")" = "$CANDIDATE_STATE"
          test "$(gh api repos/sponge-b0b/Polaris/issues/comments/$CHECKPOINT_COMMENT_ID --jq .body | grep -c '<!-- implement-ticket-closure-checkpoint:v2 -->')" = "1"
          gh api repos/sponge-b0b/Polaris/issues/comments/$CHECKPOINT_COMMENT_ID --jq .body | grep -Fq '**Stage:** awaiting-closure-verification'
          gh api repos/sponge-b0b/Polaris/issues/comments/$CHECKPOINT_COMMENT_ID --jq .body | grep -Fq "$CANDIDATE_STATE"
          test "$(gh api repos/sponge-b0b/Polaris/git/ref/heads/spec-279 --jq .object.sha)" = "$TICKET_BASELINE"

      - name: Fresh independent closure verification
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AUTO_UPDATE: 'false'
          COPILOT_MCP_TOOL_CACHE: 'false'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/verifier-prompt.txt" <<'PROMPT'
          You are the genuinely fresh, non-mutating verifier leaf for Polaris `$verify-ticket-closure` on ticket #317, `Attach omitted renewal lineage to existing Decisions`. You did NOT implement this candidate and must not repair it.

          Candidate binding:
          - Repository: sponge-b0b/Polaris
          - Ticket: #317
          - Mode: Spec Review remediation
          - Native remediation parent: Spec Review #310
          - Parent Spec: #279
          - Ticket branch: `spec-279`
          - Ticket baseline: `36f06cf396e50409e432b99fa00941053fe83f02`
          - Architecture obligations: `ARCHSRC-2`
          - Spec obligations: None
          - Root lineage: DD-2 / RF-4, no ordinary RB
          - Exact candidate state: `f75e44aa00a611bccd836ccb83041446a29aa1483d1424dc4cd4d651253955a2`
          - Durable v2 checkpoint: issue #317 comment `5676814349`, Stage `awaiting-closure-verification`, Attempt 1
          - Candidate changes are already applied to this checkout. Do not edit them.

          Execute `.agents/skills/verify-ticket-closure/SKILL.md` completely as the single semantic closure authority. Read exact current `AGENTS.md` and the verifier skill first. Treat the checkpoint Proposed Closure Evidence as a retrieval map and claims to challenge, never as authority or proof. Independently recover ticket #317, native parent, parent Spec #279 Ticket Coverage Manifest (comment 5630203405), Spec Review #310 Finding Continuity Ledger (comment 5662220111) and Decomposition Defects record (comment 5663250943) as needed, and all bounded architecture/design source sections materially governing `ARCHSRC-2`.

          Core cited authority starts at:
          - `docs/proposed/application-use-cases-investment-decision-lifecycle.md` §11, §§13-14, §17;
          - `docs/proposed/investment-decisions-decision-relationship-model.md` §2.1, §5, §§6.8-6.11;
          - `docs/proposed/durable-persistence-investment-decision-history.md` §§8-10;
          but YOU must close the bounded authority-source universe yourself and broaden only when those clauses depend on another current authority.

          Mandatory verifier behavior:
          1. Validate checkpoint/ticket/native-parent/branch/baseline/candidate binding before semantic proof.
          2. Independently re-derive Architecture/Design Decomposition Integrity for `ARCHSRC-2`; distinguish implementation defect from decomposition defect.
          3. Produce an Authority Source Coverage Manifest with zero unmapped/ambiguous current-ticket units before PASS.
          4. Construct the complete authoritative AC universe independently before inspecting candidate behavior as proof. Include every ticket build, acceptance, verification, preservation, root-complete, and DD-2/RF-4 obligation that materially determines closure.
          5. Freeze authority-first proof plans before using candidate implementation/tests as evidence.
          6. Close every finite/discoverable nested domain required by the authority and return explicit Certified Closure Domain records for every material domain that contributes to PASS.
          7. Adversarially inspect the whole relevant candidate surface and all intersecting current production/domain/store behavior, not only added lines or tests.
          8. Inspect all relevant tests but do not infer completeness from green existing tests. Generate independent falsifier cases from authority. You may run existing tests and read-only one-off Python/pytest invocations, but MUST NOT edit repository files, Git state, issues/comments, labels, branches, commits, or workflows. Any candidate mutation invalidates verification.
          9. Before every pytest command, independently perform the exact-scope service preflight required by `AGENTS.md`. Use `uv run --locked` for declared Python tooling. If broad verification is materially required, scope `POLARIS_BROAD_VERIFY_AUTHORIZED` only to that command.
          10. Recompute/confirm the candidate remains semantically and byte-state unchanged at the end.

          Pay special attention to, but do not limit discovery to, these authority-derived falsifier families:
          - existing source identity/Need and all source/predecessor lifecycle history must remain immutable; no reopening or replacement identity;
          - predecessor historical admission at BOTH source-episode start and claim-effective time, including every authoritative resolution family and contested/ineligible boundaries;
          - relation effective time before/equal/after source episode and predecessor resolution boundaries;
          - one-or-more predecessor cardinality with independent validation of each and no partial commit;
          - exact source + all predecessor expected-version guard set, plus stale endpoint and store-side non-endpoint/path/future/history/absence revalidation;
          - definite and possible mixed-lineage cycles across complete historical/known-future timeline;
          - support/basis-sensitive both-endpoint DecisionVersion effects with no lifecycle fact/sequence mutation;
          - persistence/read/revalidation failures and no partial receipt/history/version result;
          - exact replay versus changed semantic request dimensions (source, predecessor membership/cardinality/order semantics if applicable, bases, effective time, expected versions, attribution/provenance when semantically owned);
          - later endpoint lifecycle correction must not retroactively rewrite the admitted relationship;
          - ordinary new-identity `renew()` must stay distinct and unchanged;
          - privileged/purpose-specific application exposure must match the governing authority. Specifically decide from durable authority whether exporting the new command in the ordinary `polaris.application.decisions` public `__all__` is consistent with the required privileged/internal boundary or is an implementation defect; do not assume either answer from this prompt;
          - no `PRIOR_DECISION_CONTEXT`, generic graph framework, persistence schema, or unrelated contract broadening.

          Candidate implementation may reuse existing domain admission and transaction predicates. Reuse is valid only if you independently prove the composition really carries the full late-attachment semantics into this path and no application-level precondition, request identity, export, or commit field weakens them.

          If PASS, return exactly one complete verdict containing:
          - `TICKET CLOSURE: PASS`
          - exact candidate state
          - authority/decomposition accounting counts
          - authoritative-obligation/AC accounting counts and all AC dispositions
          - authority-first proof-plan accounting
          - nested-domain accounting
          - every required `Certified Closure Domain` record with membership predicate/source sets/closure counts/finality
          - preservation/root/DD-2/RF-4 conclusion
          - checks actually run and their results
          - verifier-integrity statement confirming no mutation/delegation and unchanged candidate.

          If any material obligation is violated/unproven/unchecked, return:
          - `TICKET CLOSURE: FAIL`
          - exact candidate state
          - complete actionable findings, each with classification (`implementation-defect` or `decomposition-defect` where applicable), exact authority, invariant, falsifier/evidence, invalidation boundary, and owner
          - complete accounting showing why PASS is prohibited.

          Do not soften a finding because implementation tests are green. Do not repair anything. Do not post to GitHub. Do not delegate certification.
          PROMPT
          copilot -s --allow-all-tools --no-custom-instructions --disable-builtin-mcps --no-ask-user --no-remote --no-remote-export < "$RUNNER_TEMP/verifier-prompt.txt" | tee "$RUNNER_TEMP/verifier-output.txt"
          grep -Eq '^TICKET CLOSURE: (PASS|FAIL)$' "$RUNNER_TEMP/verifier-output.txt"

      - name: Verify immutable state after verifier
        working-directory: candidate
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/post-verifier-state.txt"
          import hashlib, os, stat, subprocess
          baseline=os.environ['TICKET_BASELINE']
          def zpaths(*args):
              out=subprocess.run(['git',*args],check=True,stdout=subprocess.PIPE).stdout
              return [p for p in out.split(b'\0') if p]
          paths=set(zpaths('diff','--no-renames','--name-only','-z',baseline,'--'))
          paths.update(zpaths('ls-files','--others','--exclude-standard','-z'))
          d=hashlib.sha256()
          for raw in sorted(paths):
              path=os.fsdecode(raw); d.update(b'path\0'+raw+b'\0')
              try: meta=os.lstat(path)
              except FileNotFoundError:
                  d.update(b'state\0DELETED\0'); continue
              if stat.S_ISLNK(meta.st_mode): mode=b'120000'; content=hashlib.sha256(os.fsencode(os.readlink(path))).hexdigest()
              elif stat.S_ISREG(meta.st_mode):
                  mode=b'100755' if meta.st_mode & stat.S_IXUSR else b'100644'; h=hashlib.sha256()
                  with open(path,'rb') as f:
                      for chunk in iter(lambda: f.read(1024*1024),b''): h.update(chunk)
                  content=h.hexdigest()
              else: raise SystemExit(path)
              d.update(b'mode\0'+mode+b'\0sha256\0'+content.encode()+b'\0')
          print(d.hexdigest())
          PY
          test "$(cat "$RUNNER_TEMP/post-verifier-state.txt")" = "$CANDIDATE_STATE"
          git diff --check "$TICKET_BASELINE"
          echo "VERDICT=$(grep -E '^TICKET CLOSURE: (PASS|FAIL)$' "$RUNNER_TEMP/verifier-output.txt" | tail -1)"
          echo "CANDIDATE_STATE=$(cat "$RUNNER_TEMP/post-verifier-state.txt")"
          mkdir -p "$RUNNER_TEMP/ticket-317-verifier"
          cp "$RUNNER_TEMP/verifier-output.txt" "$RUNNER_TEMP/ticket-317-verifier/verifier-output.txt"
          cp "$RUNNER_TEMP/post-verifier-state.txt" "$RUNNER_TEMP/ticket-317-verifier/candidate-state.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ticket-317-verifier-attempt-1
          path: ${{ runner.temp }}/ticket-317-verifier
          retention-days: 7
