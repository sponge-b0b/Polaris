name: Temporary ChatGPT verify-spec wiki repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-chatgpt-verify-spec-data.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: spec-279
          fetch-depth: 0

      - name: Apply bounded wiki realization repair
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "22825af0fce1a39d1037a3c07abba6a5ed6304dc"
          python - <<'PY'
          from pathlib import Path

          index = Path('wiki/index.md')
          text = index.read_text()
          old = '| [Application Use Cases](entities/application-use-cases.md) | Application | pending | — | Commands, queries, use-case coordination, transaction/idempotency semantics, and inward-owned capability ports. |'
          new = '| [Application Use Cases](entities/application-use-cases.md) | Application | present | `src/polaris/application/decisions/` | Commands, queries, use-case coordination, transaction/idempotency semantics, and inward-owned capability ports. |'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Application Use Cases pending row, found {text.count(old)}')
          index.write_text(text.replace(old, new, 1))

          log = Path('wiki/log.md')
          original = log.read_text()
          header = '# wiki/log.md\n\n'
          if not original.startswith(header):
              raise SystemExit('wiki/log.md header mismatch')
          entry = '''## [2026-09-13] R2 application use cases | #279 implementation realized\n\nSpec #279 established the first greenfield Application Use Cases implementation under `src/polaris/application/decisions/`, including Decision commands, Decision Memory queries, transaction/idempotency and concurrency contracts, and inward-owned ports. Updated the active entity registry from `pending` to `present` with the coarse application routing anchor. R2-specific entity-page entries remain Planned because their governing architectural documents remain proposed; implementation realization does not promote proposed authority into Strict Invariants.\n\n'''
          log.write_text(header + entry + original[len(header):])
          PY
          git diff --check -- wiki/index.md wiki/log.md
          test "$(git diff --name-only | sort)" = $'wiki/index.md\nwiki/log.md'
          git config user.name "Bob Taylor"
          git config user.email "bobltaylorjr@gmail.com"
          git add wiki/index.md wiki/log.md
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'wiki/index.md\nwiki/log.md'
          git commit -m "fix(wiki): record application realization"
          git push origin HEAD:spec-279
