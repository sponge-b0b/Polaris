name: Temporary ChatGPT verify-spec contract dump

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-chatgpt-verify-spec-data.yml

permissions:
  contents: read
  issues: read

jobs:
  contract-dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump exact Spec source units
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/279" > /tmp/issue.json
          python - <<'PY'
          import hashlib, json, re
          issue = json.load(open('/tmp/issue.json', encoding='utf-8'))
          body = issue['body']
          section = None
          units = []
          paragraph = []
          paragraph_section = None
          def flush():
              global paragraph, paragraph_section
              if paragraph:
                  units.append((paragraph_section, ' '.join(x.rstrip() for x in paragraph)))
                  paragraph = []
                  paragraph_section = None
          for line in body.splitlines():
              s = line.rstrip()
              hm = re.match(r'^##\s+(.*)$', s)
              if hm:
                  flush(); section = hm.group(1).strip(); continue
              if re.match(r'^#{1,6}\s+', s):
                  flush(); continue
              if not s or s.strip() == '---':
                  flush(); continue
              m = re.match(r'^\s*(?:[-*+]\s+|\d+\.\s+)(.*)$', s)
              if m:
                  flush(); units.append((section, m.group(1).rstrip())); continue
              if not paragraph:
                  paragraph_section = section
              paragraph.append(s)
          flush()
          print('BODY_HASH=' + hashlib.sha256((body + '\n').encode()).hexdigest())
          print('UNIT_COUNT=' + str(len(units)))
          for i,(sec,text) in enumerate(units,1):
              print(f'UNIT|{i:04d}|{sec}|{text}')
          PY
