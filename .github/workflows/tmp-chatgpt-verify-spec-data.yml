name: Temporary ChatGPT verify-spec receipt export

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-chatgpt-verify-spec-data.yml

permissions:
  actions: read
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export canonical Spec 279 receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/103717234946/logs" > /tmp/job.log
          python - <<'PY'
          import re
          from pathlib import Path

          lines = Path('/tmp/job.log').read_text(encoding='utf-8-sig').splitlines()
          payload = []
          collecting = False
          for line in lines:
              match = re.match(r'^\d{4}-\d{2}-\d{2}T[^ ]+Z (.*)$', line)
              text = match.group(1) if match else line
              if text == '---RECEIPT-BEGIN---':
                  collecting = True
                  continue
              if text == '---RECEIPT-END---':
                  collecting = False
                  break
              if collecting:
                  payload.append(text)
          if not payload or payload[0] != '## Spec Verification Receipt':
              raise SystemExit('canonical receipt markers were not recovered')
          receipt = '\n'.join(payload) + '\n'
          if '**Verification Hash:** 7a496efb24f13aa79c04c9f57d7981e45c0d396a950116b99010c0ed6955f274' not in receipt:
              raise SystemExit('verification hash mismatch')
          if '**Verified HEAD:** 4c566154257df5439345cbe299c1e75ce87c2ded' not in receipt:
              raise SystemExit('verified HEAD mismatch')
          Path('/tmp/spec-279-verification-receipt.md').write_text(receipt, encoding='utf-8')
          PY
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: spec-279-verification-receipt
          path: /tmp/spec-279-verification-receipt.md
          if-no-files-found: error
          retention-days: 1
