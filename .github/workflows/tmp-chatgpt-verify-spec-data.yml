name: Temporary ChatGPT verify-spec receipt persistence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-chatgpt-verify-spec-data.yml

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - name: Persist exact Spec 279 receipt once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences "repos/${GITHUB_REPOSITORY}/actions/jobs/103717234946/logs" > /tmp/job.log
          python - <<'PY'
          import re
          from pathlib import Path

          lines = Path('/tmp/job.log').read_text(encoding='utf-8-sig').splitlines()
          payload = []
          collecting = False
          for line in lines:
              match = re.match(r'^\d{4}-\d{2}-\d{2}T[^ ]+Z (.*)$', line)
              text = match.group(1) if match else line
              if text == '---RECEIPT-BEGIN---':
                  collecting = True
                  continue
              if text == '---RECEIPT-END---':
                  break
              if collecting:
                  payload.append(text)
          if not payload or payload[0] != '## Spec Verification Receipt':
              raise SystemExit('canonical receipt markers were not recovered')
          receipt = '\n'.join(payload) + '\n'
          required = (
              '**Verification Hash:** 7a496efb24f13aa79c04c9f57d7981e45c0d396a950116b99010c0ed6955f274',
              '**Verified HEAD:** 4c566154257df5439345cbe299c1e75ce87c2ded',
              '**Spec Contract Hash:** b5362e04efd559e0a96a47ba0c1c55813aad8bdb0d1b2dbfc3d4a357036a7dc8',
          )
          if any(value not in receipt for value in required):
              raise SystemExit('canonical receipt identity mismatch')
          Path('/tmp/receipt.md').write_text(receipt, encoding='utf-8')
          PY

          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/279/comments?per_page=100" > /tmp/comments.json
          EXISTING=$(python - <<'PY'
          import json
          comments=json.load(open('/tmp/comments.json'))
          needle='**Verification Hash:** 7a496efb24f13aa79c04c9f57d7981e45c0d396a950116b99010c0ed6955f274'
          matches=[str(c['id']) for c in comments if needle in (c.get('body') or '')]
          if len(matches) > 1:
              raise SystemExit('duplicate canonical verification receipts already exist')
          print(matches[0] if matches else '')
          PY
          )

          if [ -n "$EXISTING" ]; then
            COMMENT_ID="$EXISTING"
          else
            jq -n --rawfile body /tmp/receipt.md '{body:$body}' > /tmp/payload.json
            COMMENT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/279/comments" --method POST --input /tmp/payload.json --jq .id)
          fi

          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" > /tmp/readback.json
          COMMENT_ID="$COMMENT_ID" python - <<'PY'
          import json, os
          from pathlib import Path
          expected=Path('/tmp/receipt.md').read_text(encoding='utf-8')
          actual=json.load(open('/tmp/readback.json', encoding='utf-8'))['body']
          if actual != expected:
              raise SystemExit('persisted receipt failed exact body readback')
          print('RECEIPT_COMMENT_ID=' + os.environ['COMMENT_ID'])
          print('RECEIPT_READBACK=EXACT')
          PY
