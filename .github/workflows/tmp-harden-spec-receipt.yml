name: tmp-harden-spec-receipt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-harden-spec-receipt.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Harden Spec receipt boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          verify = '.agents/skills/verify-spec/scripts/verify_spec_artifacts.py'
          review = '.agents/skills/review-spec/scripts/review_spec_artifacts.py'
          verify_skill = '.agents/skills/verify-spec/SKILL.md'
          closure_skill = '.agents/skills/verify-spec-closure/SKILL.md'
          contract_skill = '.agents/skills/spec-contract/SKILL.md'

          # verify-spec artifact utility: v2 human-readable table encoding + downstream round-trip validation.
          replace_once(
              verify,
              'import argparse\nimport hashlib\nimport json\nimport re\nimport sys\n',
              'import argparse\nimport hashlib\nimport html\nimport importlib.util\nimport json\nimport re\nimport sys\n',
          )
          replace_once(
              verify,
              'RECEIPT_HEADER = "## Spec Verification Receipt"\n',
              'RECEIPT_HEADER = "## Spec Verification Receipt"\nRECEIPT_FORMAT = "manifest-table-v2"\n',
          )
          replace_once(
              verify,
              '''def _table(value: Any) -> str:\n    if not isinstance(value, str):\n        value = json.dumps(value, sort_keys=True, ensure_ascii=False)\n    return value.replace("|", "\\\\|").replace("\\n", "<br>")\n\n\n''',
              '''def _table(value: Any) -> str:\n    if not isinstance(value, str):\n        value = json.dumps(value, sort_keys=True, ensure_ascii=False)\n    # V2 uses HTML entities for literal Markdown-sensitive characters.  GitHub\n    # renders these as the original human-readable text while table delimiters\n    # remain unambiguous.  Newlines are the only raw HTML we intentionally add.\n    return (\n        html.escape(value, quote=False)\n        .replace("|", "&#124;")\n        .replace("\\n", "<br>")\n    )\n\n\ndef _review_manifest_parser(receipt: str) -> list[dict[str, str]]:\n    review_path = (\n        Path(__file__).resolve().parents[2]\n        / "review-spec"\n        / "scripts"\n        / "review_spec_artifacts.py"\n    )\n    _require(review_path.is_file(), "review-spec artifact parser is missing")\n    module_spec = importlib.util.spec_from_file_location(\n        "_polaris_review_spec_artifacts",\n        review_path,\n    )\n    _require(\n        module_spec is not None and module_spec.loader is not None,\n        "review-spec artifact parser could not be loaded",\n    )\n    module = importlib.util.module_from_spec(module_spec)\n    module_spec.loader.exec_module(module)\n    try:\n        parsed = module.parse_verification_manifest(receipt)\n    except Exception as exc:  # downstream compatibility boundary\n        raise ValidationError(\n            f"rendered receipt is not consumable by $review-spec: {exc}"\n        ) from exc\n    _require(isinstance(parsed, list), "review-spec manifest parser returned invalid data")\n    return parsed\n\n\ndef _validate_receipt_round_trip(receipt: str, state: dict[str, Any]) -> None:\n    parsed = _review_manifest_parser(receipt)\n    _require(\n        parsed == state["manifest"],\n        "rendered receipt manifest does not round-trip exactly through $review-spec",\n    )\n\n\ndef _require_contract_digest(path: str, expected: str) -> None:\n    expected_digest = _digest_text(expected, "contract handoff digest")\n    actual_digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()\n    _require(\n        actual_digest == expected_digest,\n        "contract handoff digest mismatch; rebuild via $spec-contract and recertify",\n    )\n\n\n''',
          )
          replace_once(
              verify,
              '        "**Status:** passed",\n        f"**Spec:** #{state[\'spec_issue\']}",\n',
              '        "**Status:** passed",\n        f"**Receipt format:** {RECEIPT_FORMAT}",\n        f"**Spec:** #{state[\'spec_issue\']}",\n',
          )
          replace_once(
              verify,
              '''def _emit_finalization(state: dict[str, Any], receipt_output: str) -> None:\n    Path(receipt_output).write_text(\n        render_receipt(state),\n        encoding="utf-8",\n    )\n''',
              '''def _emit_finalization(state: dict[str, Any], receipt_output: str) -> None:\n    receipt = render_receipt(state)\n    _validate_receipt_round_trip(receipt, state)\n    Path(receipt_output).write_text(receipt, encoding="utf-8")\n''',
          )
          replace_once(
              verify,
              '''            {"cell": "US-1", "source": "User Stories 1", "requirement": "one"},\n            {"cell": "US-2", "source": "User Stories 2", "requirement": "two"},\n            {"cell": "OOS-1", "source": "Out of Scope 1", "requirement": "no"},\n''',
              '''            {\n                "cell": "US-1",\n                "source": "User Stories | 1",\n                "requirement": r"NO_CANDIDATES | EXPLICIT_CREATE_NEW \\ literal",\n            },\n            {\n                "cell": "US-2",\n                "source": "User Stories 2",\n                "requirement": "line one\\nline two <br> & markup",\n            },\n            {\n                "cell": "OOS-1",\n                "source": "Out of Scope 1",\n                "requirement": r"literal \\| stays literal",\n            },\n''',
          )
          replace_once(
              verify,
              '''    receipt = render_receipt(state)\n    assert "### Spec Contract Manifest" in receipt\n    assert "### Spec Proof Objects" not in receipt\n    assert "- proven: US-1, US-2" in receipt\n''',
              '''    receipt = render_receipt(state)\n    assert f"**Receipt format:** {RECEIPT_FORMAT}" in receipt\n    assert "### Spec Contract Manifest" in receipt\n    assert "### Spec Proof Objects" not in receipt\n    assert "- proven: US-1, US-2" in receipt\n    assert "&#124;" in receipt\n    assert "&lt;br&gt;" in receipt\n    _validate_receipt_round_trip(receipt, state)\n''',
          )
          replace_once(
              verify,
              '    parts.add_argument("--contract-input", required=True)\n',
              '    parts.add_argument("--contract-input", required=True)\n    parts.add_argument("--contract-digest", required=True)\n',
          )
          replace_once(
              verify,
              '''        elif args.command == "finalize-parts":\n            _emit_finalization(\n                finalize_parts(\n                    _read_json(args.contract_input),\n''',
              '''        elif args.command == "finalize-parts":\n            _require_contract_digest(args.contract_input, args.contract_digest)\n            _emit_finalization(\n                finalize_parts(\n                    _read_json(args.contract_input),\n''',
          )

          # review-spec artifact utility: backward-compatible legacy parser plus exact V2 decoder.
          replace_once(
              review,
              'import argparse\nimport hashlib\nimport json\n',
              'import argparse\nimport hashlib\nimport html\nimport json\n',
          )
          replace_once(
              review,
              'VERIFY_HEADER = "## Spec Verification Receipt"\n',
              'VERIFY_HEADER = "## Spec Verification Receipt"\nRECEIPT_FORMAT_V2 = "manifest-table-v2"\n',
          )
          replace_once(
              review,
              '''def _field(lines: list[str], label: str) -> str:\n    prefix = f"**{label}:** "\n    matches = [line[len(prefix) :] for line in lines if line.startswith(prefix)]\n    _require(len(matches) == 1, f"receipt must contain exactly one {label} field")\n    return matches[0].strip()\n\n\n''',
              '''def _field(lines: list[str], label: str) -> str:\n    prefix = f"**{label}:** "\n    matches = [line[len(prefix) :] for line in lines if line.startswith(prefix)]\n    _require(len(matches) == 1, f"receipt must contain exactly one {label} field")\n    return matches[0].strip()\n\n\ndef _optional_field(lines: list[str], label: str) -> str | None:\n    prefix = f"**{label}:** "\n    matches = [line[len(prefix) :] for line in lines if line.startswith(prefix)]\n    _require(len(matches) <= 1, f"receipt contains duplicate {label} fields")\n    return matches[0].strip() if matches else None\n\n\n''',
          )
          replace_once(
              review,
              '''def _section(lines: list[str], header: str) -> list[str]:\n''',
              '''def _split_table_row_v2(line: str) -> list[str]:\n    text = line.strip()\n    _require(text.startswith("|") and text.endswith("|"), "invalid manifest table row")\n    # V2 encodes every literal pipe as an HTML entity, so raw pipes are only\n    # structural table delimiters.  Literal <br> text is HTML-escaped by the\n    # producer; only producer-inserted <br> represents a newline.\n    return [\n        html.unescape(cell.strip().replace("<br>", "\\n"))\n        for cell in text[1:-1].split("|")\n    ]\n\n\ndef _section(lines: list[str], header: str) -> list[str]:\n''',
          )
          replace_once(
              review,
              '''def _manifest(lines: list[str]) -> list[dict[str, str]]:\n    section = _section(lines, "### Spec Contract Manifest")\n    rows = [line for line in section if line.startswith("|")]\n    _require(len(rows) >= 3, "verification receipt manifest is empty")\n    _require(\n        _split_table_row(rows[0]) == ["Cell", "Source", "Requirement"],\n        "invalid manifest header",\n    )\n''',
              '''def _manifest(lines: list[str]) -> list[dict[str, str]]:\n    format_version = _optional_field(lines, "Receipt format")\n    if format_version is None:\n        splitter = _split_table_row  # historical manifest-table-v1 receipts\n    else:\n        _require(\n            format_version == RECEIPT_FORMAT_V2,\n            f"unsupported receipt format: {format_version}",\n        )\n        splitter = _split_table_row_v2\n\n    section = _section(lines, "### Spec Contract Manifest")\n    rows = [line for line in section if line.startswith("|")]\n    _require(len(rows) >= 3, "verification receipt manifest is empty")\n    _require(\n        splitter(rows[0]) == ["Cell", "Source", "Requirement"],\n        "invalid manifest header",\n    )\n''',
          )
          replace_once(
              review,
              '        cells = _split_table_row(row)\n',
              '        cells = splitter(row)\n',
          )
          replace_once(
              review,
              '''    _require(bool(result), "verification receipt manifest is empty")\n    return result\n\n\ndef _coverage(\n''',
              '''    _require(bool(result), "verification receipt manifest is empty")\n    return result\n\n\ndef parse_verification_manifest(receipt_body: str) -> list[dict[str, str]]:\n    lines = receipt_body.splitlines()\n    _require(VERIFY_HEADER in lines, "receipt is not a Spec Verification Receipt")\n    return _manifest(lines)\n\n\ndef _coverage(\n''',
          )
          replace_once(
              review,
              '    manifest = _manifest(lines)\n',
              '    manifest = parse_verification_manifest(receipt_body)\n',
          )
          replace_once(
              review,
              '''def _args() -> argparse.Namespace:\n''',
              '''def self_test() -> None:\n    legacy = "\\n".join(\n        [\n            VERIFY_HEADER,\n            "",\n            "### Spec Contract Manifest",\n            "| Cell | Source | Requirement |",\n            "| --- | --- | --- |",\n            r"| ID-7 | Implementation Decisions 7 | NO_CANDIDATES \\| EXPLICIT_CREATE_NEW |",\n        ]\n    )\n    assert parse_verification_manifest(legacy)[0]["requirement"] == (\n        "NO_CANDIDATES | EXPLICIT_CREATE_NEW"\n    )\n\n    v2 = "\\n".join(\n        [\n            VERIFY_HEADER,\n            f"**Receipt format:** {RECEIPT_FORMAT_V2}",\n            "",\n            "### Spec Contract Manifest",\n            "| Cell | Source | Requirement |",\n            "| --- | --- | --- |",\n            (\n                "| ID-7 | Implementation Decisions &#124; 7 | "\n                "NO_CANDIDATES &#124; EXPLICIT_CREATE_NEW \\ literal"\n                "<br>line two &lt;br&gt; &amp; markup |"\n            ),\n        ]\n    )\n    parsed = parse_verification_manifest(v2)[0]\n    assert parsed["source"] == "Implementation Decisions | 7"\n    assert parsed["requirement"] == (\n        "NO_CANDIDATES | EXPLICIT_CREATE_NEW \\ literal\\n"\n        "line two <br> & markup"\n    )\n\n    malformed = legacy.replace(r"\\|", r"\\\\|")\n    try:\n        parse_verification_manifest(malformed)\n    except ArtifactError:\n        pass\n    else:\n        raise AssertionError("double-escaped legacy manifest row was accepted")\n\n\ndef _args() -> argparse.Namespace:\n''',
          )
          replace_once(
              review,
              '    exit_parser.add_argument("--output", required=True)\n    return parser.parse_args()\n',
              '    exit_parser.add_argument("--output", required=True)\n    sub.add_parser("self-test")\n    return parser.parse_args()\n',
          )
          replace_once(
              review,
              '''        elif args.command == "render-exit":\n            Path(args.output).write_text(\n                render_exit(_read_json(args.input)),\n                encoding="utf-8",\n            )\n        else:  # pragma: no cover\n''',
              '''        elif args.command == "render-exit":\n            Path(args.output).write_text(\n                render_exit(_read_json(args.input)),\n                encoding="utf-8",\n            )\n        elif args.command == "self-test":\n            self_test()\n            print("REVIEW-SPEC ARTIFACT SELF-TEST: PASS")\n        else:  # pragma: no cover\n''',
          )

          # spec-contract: return an invocation-local exact-handoff digest.  It is not contract identity.
          replace_once(
              contract_skill,
              '''The handoff is ephemeral execution state. Do not commit it, post it to GitHub, include it in the human-readable return, or create a second handoff representation. When `build` is rerun at a new candidate `HEAD`, overwrite the same caller-supplied path with the newly validated contract state.\n''',
              '''The handoff is ephemeral execution state. Do not commit it, post it to GitHub, or create a second handoff representation. When `build` is rerun at a new candidate `HEAD`, overwrite the same caller-supplied path with the newly validated contract state.\n\nAfter the atomic replace, compute SHA-256 over the exact `handoff-output` bytes and return it as `CONTRACT_HANDOFF_DIGEST` alongside `SPEC CONTRACT: VALID`. This digest is **invocation-local transport binding only**. It is not `SPEC_CONTRACT_HASH`, is not durable contract identity, is not persisted to the tracker, and must never be compared across independent builds. Human-readable `Source`/`Requirement` display text may legitimately differ between structurally equivalent builds; therefore a later build may legitimately produce a different `CONTRACT_HANDOFF_DIGEST` while reproducing the same V2 `SPEC_CONTRACT_HASH`.\n\nThe caller must retain the exact handoff file and its returned digest as one pair. If either is lost, rebuild through `$spec-contract`; do not reconstruct either value from a prior receipt, Spec body parsing, conversational state, or another representation.\n''',
          )

          # verify-spec: bind certifier and finalizer to the same exact handoff bytes.
          replace_once(
              verify_skill,
              '''* once a fresh V2 handoff is valid, use that exact handoff for the current invocation's certifier dispatch and finalizer; do not merge display rows from an older handoff or receipt into it.\n''',
              '''* once a fresh V2 handoff is valid, use that exact handoff for the current invocation's certifier dispatch and finalizer; do not merge display rows from an older handoff or receipt into it;\n* retain the `CONTRACT_HANDOFF_DIGEST` returned by that exact `$spec-contract` build and treat it only as an invocation-local byte binding. Never compare it across independent builds and never treat it as semantic contract identity.\n''',
          )
          replace_once(
              verify_skill,
              '''The parent does not need byte-identical historical `Requirement` prose to continue verification. It does need the same structural acceptance universe.\n''',
              '''The parent does not need byte-identical historical `Requirement` prose to continue verification. It does need the same structural acceptance universe. `SPEC_CONTRACT_HASH` is the only durable cross-run contract identity here; `CONTRACT_HANDOFF_DIGEST` exists only to prove that certification and finalization consumed the same current handoff bytes.\n''',
          )
          replace_once(
              verify_skill,
              '''Invoke `$spec-contract` in `build` mode with the Spec, baseline, branch, current `HEAD`, and `handoff-output = CONTRACT_HANDOFF`. Require `SPEC CONTRACT: VALID`, a non-empty `CONTRACT_HANDOFF`, and retain exactly the returned:\n\n- `SPEC_BODY_HASH` and `SPEC_CONTRACT_HASH`;\n''',
              '''Invoke `$spec-contract` in `build` mode with the Spec, baseline, branch, current `HEAD`, and `handoff-output = CONTRACT_HANDOFF`. Require `SPEC CONTRACT: VALID`, a non-empty `CONTRACT_HANDOFF`, and retain exactly the returned:\n\n- `SPEC_BODY_HASH` and `SPEC_CONTRACT_HASH`;\n- `CONTRACT_HANDOFF_DIGEST` for the exact handoff bytes produced by this build;\n''',
          )
          replace_once(
              verify_skill,
              '''   * deterministic `$spec-contract` handoff/manifest and hashes;\n''',
              '''   * deterministic `$spec-contract` handoff/manifest and hashes;\n   * the invocation-local `CONTRACT_HANDOFF_DIGEST` for those exact handoff bytes;\n''',
          )
          replace_once(
              verify_skill,
              '''5. receive one complete `SPEC CLOSURE: PASS | FAIL` or one explicit invalid/incomplete certification result;\n''',
              '''5. receive one complete `SPEC CLOSURE: PASS | FAIL` or one explicit invalid/incomplete certification result, and require it to echo the exact `CONTRACT_HANDOFF_DIGEST`;\n''',
          )
          replace_once(
              verify_skill,
              '''At stable candidate `HEAD`, after valid `SPEC CLOSURE: PASS`:\n\n1. rerun `$spec-contract` in `build` mode with the same `handoff-output = CONTRACT_HANDOFF`, replacing the handoff only after the refreshed contract is valid;\n2. require valid body/contract and reconciled ownership;\n''',
              '''At stable candidate `HEAD`, after valid `SPEC CLOSURE: PASS`:\n\n1. retain the **same exact** `CONTRACT_HANDOFF` and `CONTRACT_HANDOFF_DIGEST` that were supplied to and echoed by the certifier. Do not rerun `$spec-contract` merely for finalization; a new build may legitimately change human-readable display prose and therefore produces a different invocation-local digest. If the handoff/digest pair is lost or changed, rebuild through `$spec-contract` and obtain fresh semantic certification before finalization;\n2. require valid body/contract and reconciled ownership from that certified handoff;\n''',
          )
          replace_once(
              verify_skill,
              '''python "$ARTIFACT_TOOL" finalize-parts \\\n  --contract-input "$CONTRACT_HANDOFF" \\\n  --proofs-input "$PROOFS_INPUT" \\\n''',
              '''python "$ARTIFACT_TOOL" finalize-parts \\\n  --contract-input "$CONTRACT_HANDOFF" \\\n  --contract-digest "$CONTRACT_HANDOFF_DIGEST" \\\n  --proofs-input "$PROOFS_INPUT" \\\n''',
          )
          replace_once(
              verify_skill,
              '''`finalize-parts` assembles the already-owned contract/proof/gate pieces, validates bindings/coverage/gates through the same canonical finalizer, rejects unresolved cells, computes one Verification Hash, and renders the receipt. There is no model-authored wrapper, separate packet admission, final-state validation, receipt rendering, or pre-persistence receipt-validation phase.\n''',
              '''`finalize-parts` first requires the exact contract-input bytes to match the certifier-bound `CONTRACT_HANDOFF_DIGEST`, then assembles the already-owned contract/proof/gate pieces, validates bindings/coverage/gates through the same canonical finalizer, rejects unresolved cells, computes one Verification Hash, renders the receipt, and requires the rendered manifest to round-trip exactly through the current `$review-spec` parser before writing the receipt file. There is no model-authored wrapper, reconstructed manifest, separate packet admission, or second receipt renderer.\n\n`Verification Hash` is a checksum of this one finalized verification record, which includes human-readable evidence and may therefore differ across independent valid verification runs. It is **not** cross-run contract identity and must never be compared as though it were `SPEC_CONTRACT_HASH`.\n''',
          )
          replace_once(
              verify_skill,
              '''The receipt is a checkpoint/binding record, not a transcript of semantic reasoning. It retains the manifest/source counts needed by `$review-spec`, compact derived coverage, gate outcomes, repairs, inherited findings, and one Verification Hash. It omits proof prose, proof hashes, duplicate coverage structures, and commands already visible in the transcript.\n''',
              '''The receipt is a checkpoint/binding record, not a transcript of semantic reasoning. It remains intentionally human-readable. It retains the manifest/source counts needed by `$review-spec`, compact derived coverage, gate outcomes, repairs, inherited findings, and one per-receipt Verification Hash. It omits proof prose, proof hashes, duplicate coverage structures, and commands already visible in the transcript. The renderer owns Markdown-safe display encoding; callers must never pre-escape or reconstruct receipt display rows.\n''',
          )

          # verify-spec-closure: echo the exact handoff digest as part of immutable candidate binding.
          replace_once(
              closure_skill,
              '''* receives the immutable Spec contract handoff, exact baseline/branch/HEAD, ownership, and already-executed gate/test evidence;\n''',
              '''* receives the immutable Spec contract handoff, its invocation-local `CONTRACT_HANDOFF_DIGEST`, exact baseline/branch/HEAD, ownership, and already-executed gate/test evidence;\n''',
          )
          replace_once(
              closure_skill,
              '''* deterministic `$spec-contract` manifest and contract hash;\n''',
              '''* deterministic `$spec-contract` manifest and contract hash;\n* invocation-local `CONTRACT_HANDOFF_DIGEST` binding these exact handoff bytes;\n''',
          )
          replace_once(
              closure_skill,
              '''Spec contract hash: <hash>\nManifest: <n>; proven <n>; not-applicable <n>; violated 0; unproven 0; unchecked 0\n''',
              '''Spec contract hash: <hash>\nContract handoff digest: <sha256>\nManifest: <n>; proven <n>; not-applicable <n>; violated 0; unproven 0; unchecked 0\n''',
          )
          replace_once(
              closure_skill,
              '''Spec contract hash: <hash>\nManifest: <n>; proven <n>; not-applicable <n>; violated <n>; unproven <n>; unchecked 0\n''',
              '''Spec contract hash: <hash>\nContract handoff digest: <sha256>\nManifest: <n>; proven <n>; not-applicable <n>; violated <n>; unproven <n>; unchecked 0\n''',
          )
          replace_once(
              closure_skill,
              '''Certification applies only to the exact baseline, Spec body/contract hashes, branch, HEAD, and authoritative mutable inputs certified.\n''',
              '''Certification applies only to the exact baseline, Spec body/contract hashes, branch, HEAD, authoritative mutable inputs, and exact contract handoff bytes certified. Echo `CONTRACT_HANDOFF_DIGEST` unchanged in the verdict. The digest is invocation-local transport binding only: it is not semantic identity, is not persisted as contract authority, and must never be compared across independent `$spec-contract` builds.\n''',
          )
          PY

          uv run --locked ruff format \
            .agents/skills/verify-spec/scripts/verify_spec_artifacts.py \
            .agents/skills/review-spec/scripts/review_spec_artifacts.py
          uv run --locked ruff check \
            .agents/skills/verify-spec/scripts/verify_spec_artifacts.py \
            .agents/skills/review-spec/scripts/review_spec_artifacts.py
          python .agents/skills/review-spec/scripts/review_spec_artifacts.py self-test
          python .agents/skills/verify-spec/scripts/verify_spec_artifacts.py self-test
          python -m py_compile \
            .agents/skills/verify-spec/scripts/verify_spec_artifacts.py \
            .agents/skills/review-spec/scripts/review_spec_artifacts.py

          # Exercise the new exact-handoff digest gate through the real CLI.
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          contract = {
              'spec_issue': 1,
              'head': 'a'*40,
              'baseline': 'b'*40,
              'branch': 'spec-1',
              'spec_body_hash': 'c'*64,
              'spec_contract_hash': 'd'*64,
              'default_branch': 'main',
              'default_head': 'e'*40,
              'source_counts': {'user_stories': 1},
              'manifest': [{'cell':'US-1','source':'User Stories | 1','requirement':r'A | B \\ C'}],
          }
          p=Path('/tmp/contract.json')
          p.write_text(json.dumps(contract,separators=(',',':')),encoding='utf-8')
          print(hashlib.sha256(p.read_bytes()).hexdigest())
          Path('/tmp/proofs.json').write_text(json.dumps([{'cells':['US-1'],'state':'proven','evidence':['x']}]),encoding='utf-8')
          Path('/tmp/gates.json').write_text(json.dumps([{'name':'x','status':'PASS','evidence':'x'}]),encoding='utf-8')
          PY
          DIGEST=$(sha256sum /tmp/contract.json | awk '{print $1}')
          python .agents/skills/verify-spec/scripts/verify_spec_artifacts.py finalize-parts \
            --contract-input /tmp/contract.json \
            --contract-digest "$DIGEST" \
            --proofs-input /tmp/proofs.json \
            --gates-input /tmp/gates.json \
            --mode full \
            --receipt-output /tmp/receipt.md
          grep -F '**Receipt format:** manifest-table-v2' /tmp/receipt.md
          grep -F '&#124;' /tmp/receipt.md
          if python .agents/skills/verify-spec/scripts/verify_spec_artifacts.py finalize-parts \
            --contract-input /tmp/contract.json \
            --contract-digest "$(printf '0%.0s' {1..64})" \
            --proofs-input /tmp/proofs.json \
            --gates-input /tmp/gates.json \
            --mode full \
            --receipt-output /tmp/receipt-bad.md; then
            echo 'bad contract digest was accepted' >&2
            exit 1
          fi

          git diff --check
          git status --short
          git config user.name 'Bob Taylor'
          git config user.email 'bobltaylorjr@gmail.com'
          git add \
            .agents/skills/spec-contract/SKILL.md \
            .agents/skills/verify-spec/SKILL.md \
            .agents/skills/verify-spec-closure/SKILL.md \
            .agents/skills/verify-spec/scripts/verify_spec_artifacts.py \
            .agents/skills/review-spec/scripts/review_spec_artifacts.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m 'fix(workflow): harden spec receipt contract boundary'
          git push origin HEAD:main
