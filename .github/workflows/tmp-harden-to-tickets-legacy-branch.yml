name: tmp-harden-to-tickets-legacy-branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-harden-to-tickets-legacy-branch.yml'
      - '.tmp_harden_to_tickets_legacy_branch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply legacy Spec-branch reconciliation hardening
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain)"
          python .tmp_harden_to_tickets_legacy_branch.py
          git diff --check
          git diff --exit-code -- .github/workflows/tmp-harden-to-tickets-legacy-branch.yml .tmp_harden_to_tickets_legacy_branch.py
          test -n "$(git diff -- .agents/skills/to-tickets/SKILL.md)"
          git config user.name "Bob Taylor"
          git config user.email "bobltaylorjr@gmail.com"
          git add .agents/skills/to-tickets/SKILL.md
          git commit -m "fix(workflow): reconcile legacy spec branches"
          git push origin HEAD:main
