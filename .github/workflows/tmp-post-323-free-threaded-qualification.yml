name: Temporary post-323 runtime-boundary verification

on:
  push:
    branches:
      - chatgpt/post-323-runtime-qualification
    paths:
      - '.github/workflows/tmp-post-323-free-threaded-qualification.yml'

permissions:
  contents: read

jobs:
  standard-runtime:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: polaris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d polaris_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      POLARIS_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/polaris_test
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fde6d6e1830d2f824dc9bf348c63e0e268d1e716
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Prepare standard CPython
        run: |
          set -euo pipefail
          uv python install 3.14
          uv sync --locked --python 3.14
          uv run --python 3.14 python - <<'PY'
          import sys
          import sysconfig
          print(f"PY_GIL_DISABLED={sysconfig.get_config_var('Py_GIL_DISABLED')}")
          print(f"GIL_ENABLED={sys._is_gil_enabled()}")
          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 0
          assert sys._is_gil_enabled()
          PY

      - name: Static checks
        run: |
          set -euo pipefail
          uv run --python 3.14 ruff format --check             src/polaris/infrastructure/persistence/postgresql/decisions.py             tests/runtime/test_postgresql_runtime_qualification.py
          uv run --python 3.14 ruff check             src/polaris/infrastructure/persistence/postgresql/decisions.py             tests/runtime/test_postgresql_runtime_qualification.py
          uv run --python 3.14 mypy             src/polaris/infrastructure/persistence/postgresql/decisions.py

      - name: Runtime-boundary test
        run: |
          set -euo pipefail
          uv run --python 3.14 python -m pytest -q             tests/runtime/test_postgresql_runtime_qualification.py

      - name: PostgreSQL adapter contract suite
        run: |
          set -euo pipefail
          uv run --python 3.14 python -m pytest -q             tests/integration/persistence/postgresql

      - name: Architecture suite
        run: |
          set -euo pipefail
          uv run --python 3.14 python -m pytest -q tests/architecture

  free-threaded-runtime:
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fde6d6e1830d2f824dc9bf348c63e0e268d1e716
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Prepare free-threaded CPython
        run: |
          set -euo pipefail
          uv python install 3.14t
          uv sync --locked --python 3.14t
          uv run --python 3.14t python -X gil=0 scripts/verify_free_threaded_runtime.py
          uv run --python 3.14t python -X gil=0 - <<'PY'
          import sys
          import sysconfig
          print(f"PY_GIL_DISABLED={sysconfig.get_config_var('Py_GIL_DISABLED')}")
          print(f"GIL_ENABLED={sys._is_gil_enabled()}")
          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1
          assert not sys._is_gil_enabled()
          PY

      - name: Runtime-boundary test rejects PostgreSQL adapter
        run: |
          set -euo pipefail
          uv run --python 3.14t python -X gil=0 -m pytest -q             tests/runtime/test_postgresql_runtime_qualification.py

      - name: Explicit engine-construction fail-fast
        run: |
          set -euo pipefail
          uv run --python 3.14t python -X gil=0 - <<'PY'
          from polaris.infrastructure.persistence.postgresql import create_postgres_engine

          try:
              create_postgres_engine(
                  "postgresql+asyncpg://user:pass@localhost/polaris"
              )
          except RuntimeError as exc:
              message = str(exc)
              print(message)
              assert "not qualified for GIL-disabled CPython" in message
          else:
              raise SystemExit("PostgreSQL engine construction did not fail closed")
          PY
