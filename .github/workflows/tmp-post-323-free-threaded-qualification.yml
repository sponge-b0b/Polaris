name: Temporary post-323 standard-CPython persistence stress

on:
  push:
    branches:
      - chatgpt/post-323-runtime-qualification
    paths:
      - '.github/workflows/tmp-post-323-free-threaded-qualification.yml'

permissions:
  contents: read

jobs:
  standard-stress:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ticket-baseline
            target_ref: d7c7010b6db7ed3ee96888e2a983e48e06415153
          - label: ticket-final
            target_ref: 79e9a2a825977b1689bf336ec2c272deb969d2f1

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: polaris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d polaris_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      POLARIS_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/polaris_test
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target_ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Prepare standard CPython environment
        run: |
          set -euo pipefail
          uv python install 3.14
          uv sync --locked --python 3.14
          uv run --python 3.14 python - <<'PY'
          import sys
          import sysconfig
          import sqlalchemy
          import greenlet

          print(f"PYTHON={sys.version}")
          print(f"PY_GIL_DISABLED={sysconfig.get_config_var('Py_GIL_DISABLED')}")
          is_gil_enabled = getattr(sys, "_is_gil_enabled", None)
          print(f"GIL_ENABLED={None if is_gil_enabled is None else is_gil_enabled()}")
          print(f"SQLALCHEMY_VERSION={sqlalchemy.__version__}")
          print(f"GREENLET_VERSION={greenlet.__version__}")
          if sysconfig.get_config_var("Py_GIL_DISABLED") == 1:
              raise SystemExit("expected standard GIL-enabled CPython build")
          PY

      - name: Repeated standard-runtime persistence trials
        id: standard
        shell: bash
        run: |
          set +e
          set -u
          failures=0
          for i in 1 2 3 4 5; do
            echo "STANDARD_TRIAL_${i}_BEGIN"
            PYTHONFAULTHANDLER=1               uv run --python 3.14 python -m pytest -q                 tests/integration/persistence/postgresql
            rc=$?
            echo "STANDARD_TRIAL_${i}_EXIT=$rc"
            if [ "$rc" -ne 0 ]; then
              failures=$((failures + 1))
            fi
          done
          echo "STANDARD_FAILURES=$failures"
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Standard runtime summary
        env:
          LABEL: ${{ matrix.label }}
          TARGET_REF: ${{ matrix.target_ref }}
          STANDARD_FAILURES: ${{ steps.standard.outputs.failures }}
        run: |
          set -euo pipefail
          echo "STANDARD_STRESS_LABEL=$LABEL"
          echo "STANDARD_STRESS_REF=$TARGET_REF"
          echo "STANDARD_STRESS_FAILURES=$STANDARD_FAILURES"
          test "$STANDARD_FAILURES" = "0"
