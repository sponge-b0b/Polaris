name: Temporary post-323 crash isolation

on:
  push:
    branches:
      - chatgpt/post-323-runtime-qualification
    paths:
      - '.github/workflows/tmp-post-323-free-threaded-qualification.yml'

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: polaris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d polaris_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      POLARIS_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/polaris_test
      UV_PYTHON_PREFERENCE: only-managed
      DISABLE_SQLALCHEMY_CEXT_RUNTIME: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 79e9a2a825977b1689bf336ec2c272deb969d2f1
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Prepare
        run: |
          set -euo pipefail
          uv python install 3.14t
          uv sync --locked --python 3.14t
          uv run --python 3.14t python -X gil=0 scripts/verify_free_threaded_runtime.py
          uv run --python 3.14t python -X gil=0 -m pytest --collect-only -q             tests/integration/persistence/postgresql | tee "$RUNNER_TEMP/collected.txt"

      - name: Verbose full-suite trials
        shell: bash
        run: |
          set +e
          for i in 1 2 3; do
            echo "=== VERBOSE_TRIAL_${i}_BEGIN ==="
            PYTHONFAULTHANDLER=1               uv run --python 3.14t python -X gil=0 -m pytest -vv                 tests/integration/persistence/postgresql
            rc=$?
            echo "=== VERBOSE_TRIAL_${i}_EXIT=$rc ==="
          done
          exit 0

      - name: New-or-changed test node trials
        shell: bash
        run: |
          set +e
          nodes=(
            "tests/integration/persistence/postgresql/test_decision_store.py::test_explicit_create_new_persists_complete_candidate_basis"
            "tests/integration/persistence/postgresql/test_decision_store.py::test_continuation_persists_only_a_restart_safe_receipt"
            "tests/integration/persistence/postgresql/test_decision_store.py::test_initiation_with_expected_version_commits_nothing"
            "tests/integration/persistence/postgresql/test_decision_store.py::test_initiation_rejects_mutation_operation_id_after_restart"
            "tests/integration/persistence/postgresql/test_decision_store.py::test_concurrent_different_operations_create_at_most_one_decision_and_need"
            "tests/integration/persistence/postgresql/test_relationship_store.py::test_initiation_rejects_relationship_operation_id_after_restart"
            "tests/integration/persistence/postgresql/test_relationship_store.py::test_ordinary_and_renewal_initiation_share_one_continuity_guard"
            "tests/integration/persistence/postgresql/test_relationship_store.py::test_renewal_initial_lineage_failure_rolls_back_entire_creation"
          )
          for node in "${nodes[@]}"; do
            failures=0
            echo "=== NODE_BEGIN=$node ==="
            for i in 1 2 3 4 5; do
              PYTHONFAULTHANDLER=1                 uv run --python 3.14t python -X gil=0 -m pytest -q "$node"
              rc=$?
              echo "NODE_TRIAL=$node|$i|EXIT=$rc"
              if [ "$rc" -ne 0 ]; then
                failures=$((failures + 1))
              fi
            done
            echo "NODE_FAILURES=$node|$failures"
          done
          exit 0
