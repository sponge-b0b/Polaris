name: Temporary post-323 free-threaded greenlet stress

on:
  push:
    branches:
      - chatgpt/post-323-runtime-qualification
    paths:
      - '.github/workflows/tmp-post-323-free-threaded-qualification.yml'

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ticket-baseline
            target_ref: d7c7010b6db7ed3ee96888e2a983e48e06415153
          - label: ticket-final
            target_ref: 79e9a2a825977b1689bf336ec2c272deb969d2f1

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: polaris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d polaris_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      POLARIS_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/polaris_test
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - name: Checkout exact qualification ref
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target_ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Prepare exact free-threaded environment
        run: |
          set -euo pipefail
          uv python install 3.14t
          test "$(cat .python-version)" = "3.14t"
          uv sync --locked --python 3.14t
          uv run --python 3.14t python -X gil=0 scripts/verify_free_threaded_runtime.py
          uv run --python 3.14t python -X gil=0 - <<'PY'
          import sys
          import sqlalchemy
          import greenlet

          print(f"SQLALCHEMY_VERSION={sqlalchemy.__version__}")
          print(f"GREENLET_VERSION={greenlet.__version__}")
          print(f"GIL_AFTER_IMPORT={sys._is_gil_enabled()}")
          if sys._is_gil_enabled():
              raise SystemExit("GIL enabled after SQLAlchemy/greenlet import")
          PY

      - name: Repeated native trials
        id: native
        shell: bash
        run: |
          set -u
          failures=0
          for i in 1 2 3 4 5; do
            echo "NATIVE_TRIAL_${i}_BEGIN"
            PYTHONFAULTHANDLER=1               uv run --python 3.14t python -X gil=0 -m pytest -q                 tests/integration/persistence/postgresql
            rc=$?
            echo "NATIVE_TRIAL_${i}_EXIT=$rc"
            if [ "$rc" -ne 0 ]; then
              failures=$((failures + 1))
            fi
          done
          echo "NATIVE_FAILURES=$failures"
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Repeated TLBC-disabled trials
        id: tlbc
        shell: bash
        run: |
          set -u
          failures=0
          for i in 1 2 3 4 5; do
            echo "TLBC0_TRIAL_${i}_BEGIN"
            PYTHONFAULTHANDLER=1               uv run --python 3.14t python -X gil=0 -X tlbc=0 -m pytest -q                 tests/integration/persistence/postgresql
            rc=$?
            echo "TLBC0_TRIAL_${i}_EXIT=$rc"
            if [ "$rc" -ne 0 ]; then
              failures=$((failures + 1))
            fi
          done
          echo "TLBC0_FAILURES=$failures"
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Stress summary
        env:
          LABEL: ${{ matrix.label }}
          TARGET_REF: ${{ matrix.target_ref }}
          NATIVE_FAILURES: ${{ steps.native.outputs.failures }}
          TLBC0_FAILURES: ${{ steps.tlbc.outputs.failures }}
        run: |
          set -euo pipefail
          echo "STRESS_LABEL=$LABEL"
          echo "STRESS_REF=$TARGET_REF"
          echo "STRESS_NATIVE_FAILURES=$NATIVE_FAILURES"
          echo "STRESS_TLBC0_FAILURES=$TLBC0_FAILURES"
          test "$TLBC0_FAILURES" = "0"
