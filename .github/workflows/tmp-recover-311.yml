name: tmp-recover-311

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-recover-311.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Recreate exact uncommitted candidate and await certification
        env:
          GH_TOKEN: ${{ github.token }}
          TICKET_BASELINE: cbc7e9e43bc74daf6f45dcf6866eb125ce285017
          RECOVERY_HEAD: c7c6bc078b4822d122022c00392a05ae15b45887
          SOURCE_CANDIDATE: a32dd01e56fe452911fbb7c6fb7a3e768a5033c7
          EXPECTED_STATE: 11d5bce73d2507ae6ccbbac6c98d069234394ccbd352f29a121541ae957f0686
          CHECKPOINT_MARKER: '<!-- implement-ticket-closure-checkpoint:v2 -->'
        run: |
          set -euo pipefail
          git fetch origin spec-279
          git checkout -B spec-279 origin/spec-279
          test "$(git rev-parse HEAD)" = "$RECOVERY_HEAD"
          git diff --quiet "$TICKET_BASELINE" HEAD
          test -z "$(git status --porcelain)"

          git show --format= --binary "$SOURCE_CANDIDATE" -- \
            src/polaris/application/decisions/ordinary_work.py \
            tests/application/decisions/test_resolution.py \
            | git apply -

          changed="$(git diff --name-only "$TICKET_BASELINE")"
          expected=$'src/polaris/application/decisions/ordinary_work.py\ntests/application/decisions/test_resolution.py'
          test "$changed" = "$expected"
          git diff --check "$TICKET_BASELINE"

          compute_state() {
            TICKET_BASELINE="$TICKET_BASELINE" python - <<'PY'
          import hashlib
          import os
          import stat
          import subprocess

          baseline = os.environ["TICKET_BASELINE"]

          def git_paths(*args: str) -> list[bytes]:
              result = subprocess.run(
                  ["git", *args],
                  check=True,
                  stdout=subprocess.PIPE,
              )
              return [path for path in result.stdout.split(b"\0") if path]

          paths = set(
              git_paths("diff", "--no-renames", "--name-only", "-z", baseline, "--")
          )
          paths.update(git_paths("ls-files", "--others", "--exclude-standard", "-z"))

          candidate = hashlib.sha256()
          for raw_path in sorted(paths):
              path = os.fsdecode(raw_path)
              candidate.update(b"path\0")
              candidate.update(raw_path)
              candidate.update(b"\0")
              try:
                  metadata = os.lstat(path)
              except FileNotFoundError:
                  candidate.update(b"state\0DELETED\0")
                  continue
              if stat.S_ISLNK(metadata.st_mode):
                  mode = b"120000"
                  content_hash = hashlib.sha256(
                      os.fsencode(os.readlink(path))
                  ).hexdigest()
              elif stat.S_ISREG(metadata.st_mode):
                  mode = b"100755" if metadata.st_mode & stat.S_IXUSR else b"100644"
                  digest = hashlib.sha256()
                  with open(path, "rb") as handle:
                      for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                          digest.update(chunk)
                  content_hash = digest.hexdigest()
              else:
                  raise SystemExit(f"unsupported candidate path type: {path}")
              candidate.update(b"mode\0")
              candidate.update(mode)
              candidate.update(b"\0sha256\0")
              candidate.update(content_hash.encode("ascii"))
              candidate.update(b"\0")

          print(candidate.hexdigest())
          PY
          }

          state="$(compute_state)"
          test "$state" = "$EXPECTED_STATE"

          uv run --locked ruff format --check \
            src/polaris/application/decisions/ordinary_work.py \
            tests/application/decisions/test_resolution.py
          uv run --locked ruff check \
            src/polaris/application/decisions/ordinary_work.py \
            tests/application/decisions/test_resolution.py
          uv run --locked mypy --explicit-package-bases \
            src/polaris/application/decisions/ordinary_work.py \
            tests/application/decisions/test_resolution.py
          UV_CACHE_DIR=/tmp/uv-cache uv run --locked pytest -q \
            tests/application/decisions/test_resolution.py
          POLARIS_BROAD_VERIFY_AUTHORIZED=verify-architecture \
            uv run --locked pytest -q \
            tests/test_architecture_guard.py \
            tests/test_architecture_guard_identity_aliases.py \
            tests/test_architecture_guard_legacy_loaders.py

          echo "CANDIDATE_READY=$state"

          checkpoint_id=""
          for _ in $(seq 1 120); do
            matches="$(gh api --paginate --slurp \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              'repos/sponge-b0b/Polaris/issues/311/comments?per_page=100' \
              | jq -c --arg marker "$CHECKPOINT_MARKER" \
                '[.[][] | select(.body | contains($marker)) | {id, body}]')"
            count="$(jq 'length' <<<"$matches")"
            if [ "$count" -gt 1 ]; then
              echo 'ambiguous v2 closure checkpoint' >&2
              exit 1
            fi
            if [ "$count" -eq 1 ]; then
              body="$(jq -r '.[0].body' <<<"$matches")"
              checkpoint_id="$(jq -r '.[0].id' <<<"$matches")"
              if grep -Fq '**Stage:** awaiting-closure-verification' <<<"$body" \
                && grep -Fq "**Candidate state:** $EXPECTED_STATE" <<<"$body" \
                && grep -Fq '**Attempt:** 1' <<<"$body"; then
                echo "CHECKPOINT_AWAITING=$checkpoint_id"
                break
              fi
            fi
            sleep 5
          done
          test -n "$checkpoint_id"

          passed=0
          for _ in $(seq 1 120); do
            body="$(gh api \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/sponge-b0b/Polaris/issues/comments/$checkpoint_id" \
              --jq '.body')"
            if grep -Fq '**Stage:** verifier-passed' <<<"$body" \
              && grep -Fq "**Candidate state:** $EXPECTED_STATE" <<<"$body" \
              && grep -Fq 'TICKET CLOSURE: PASS' <<<"$body"; then
              passed=1
              echo "CHECKPOINT_PASSED=$checkpoint_id"
              break
            fi
            sleep 5
          done
          test "$passed" -eq 1

          state="$(compute_state)"
          test "$state" = "$EXPECTED_STATE"
          git diff --check "$TICKET_BASELINE"
          test "$(git diff --name-only "$TICKET_BASELINE")" = "$expected"
          test "$(git ls-remote origin refs/heads/spec-279 | awk '{print $1}')" = "$RECOVERY_HEAD"

          git config user.name 'Bob Taylor'
          git config user.email 'bobltaylorjr@gmail.com'
          git add \
            src/polaris/application/decisions/ordinary_work.py \
            tests/application/decisions/test_resolution.py
          git commit -m 'fix(application): allow contested external resolution'
          git push origin HEAD:spec-279
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
