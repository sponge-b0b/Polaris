name: Temporary session reconstitution update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'chore(process): arm session reconstitution update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply bounded reconstitution update
        run: |
          set -euo pipefail
          python .github/tmp/update_session_reconstitution.py
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "docs/process/session-reconstitution.md"
          git config user.name "Bob Taylor"
          git config user.email "bobltaylorjr@gmail.com"
          git add docs/process/session-reconstitution.md
          git commit -m "docs(process): record ChatGPT execution playbook"
          git push origin HEAD:main
