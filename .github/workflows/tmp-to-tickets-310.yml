name: tmp-to-tickets-310

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-to-tickets-310.yml'
      - '.tmp_to_tickets_310_publish.sh'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect issue develop mechanics
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue develop --help
