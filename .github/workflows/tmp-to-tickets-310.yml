name: tmp-to-tickets-310

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-to-tickets-310.yml'
      - '.tmp_to_tickets_310_publish.sh'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare development branch visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "GH_VERSION=$(gh --version | awk 'NR==1 {print $3}')"
          for issue in 277 278 279; do
            echo "--- issue develop --list $issue ---"
            gh issue develop --list "$issue" || true
          done
