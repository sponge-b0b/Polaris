name: tmp-verify-spec-279-readback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-verify-spec-279-readback.yml'

permissions:
  actions: read
  issues: read

jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - name: Prove persisted receipt equals canonical local receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO='sponge-b0b/Polaris'
          SOURCE_JOB=103630677428
          COMMENT_ID=5649065911
          EXPECTED_HEAD='3bbc9ec745e4b451a56404d492290a41160353d8'
          EXPECTED_VERIFICATION_HASH='4f235b3ee8975cece1edc9912bdf425a44060ac8437df0f87c4e7ca15a8372b3'

          gh api --allow-escape-sequences "repos/$REPO/actions/jobs/$SOURCE_JOB/logs" > /tmp/source-job.log

          python - <<'PY'
          from pathlib import Path
          import re

          raw = Path('/tmp/source-job.log').read_text(encoding='utf-8-sig', errors='strict')
          lines = raw.splitlines()
          start = None
          end = None
          for index, line in enumerate(lines):
              if re.match(r'^\d{4}-\d{2}-\d{2}T\S+Z ## Spec Verification Receipt$', line):
                  start = index
                  break
          if start is None:
              raise SystemExit('canonical receipt start not found in source job log')
          for index in range(start + 1, len(lines)):
              if '##[error]Process completed with exit code 1.' in lines[index]:
                  end = index
                  break
          if end is None:
              raise SystemExit('canonical receipt end boundary not found in source job log')

          out = []
          timestamp = re.compile(r'^\d{4}-\d{2}-\d{2}T\S+Z ?')
          for line in lines[start:end]:
              out.append(timestamp.sub('', line, count=1))
          receipt = '\n'.join(out) + '\n'
          Path('/tmp/expected-receipt.md').write_text(receipt, encoding='utf-8')
          PY

          gh api "repos/$REPO/issues/comments/$COMMENT_ID" | jq -j '.body' > /tmp/readback-receipt.md

          grep -F "**Verified HEAD:** $EXPECTED_HEAD" /tmp/expected-receipt.md
          grep -F "**Verification Hash:** $EXPECTED_VERIFICATION_HASH" /tmp/expected-receipt.md
          grep -F "**Verified HEAD:** $EXPECTED_HEAD" /tmp/readback-receipt.md
          grep -F "**Verification Hash:** $EXPECTED_VERIFICATION_HASH" /tmp/readback-receipt.md

          cmp -s /tmp/expected-receipt.md /tmp/readback-receipt.md
          EXPECTED_SHA=$(sha256sum /tmp/expected-receipt.md | awk '{print $1}')
          READBACK_SHA=$(sha256sum /tmp/readback-receipt.md | awk '{print $1}')
          test "$EXPECTED_SHA" = "$READBACK_SHA"
          printf 'RECEIPT_READBACK=PASS\nCOMMENT_ID=%s\nBODY_SHA256=%s\n' "$COMMENT_ID" "$EXPECTED_SHA"
