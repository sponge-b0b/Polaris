name: tmp-verify-spec-279

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-verify-spec-279.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3bbc9ec745e4b451a56404d492290a41160353d8
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Run exact candidate verification gates
        env:
          POLARIS_BROAD_VERIFY_AUTHORIZED: verify-spec-279
        run: |
          set -euo pipefail
          HEAD='3bbc9ec745e4b451a56404d492290a41160353d8'
          BASE='4daed9034891600597a47c01b6c39d5ebd9914ca'
          test "$(git rev-parse HEAD)" = "$HEAD"
          git diff --check "$BASE"...HEAD

          set +e
          uv run --locked ruff format --check . > /tmp/ruff-format-root.txt 2>&1
          RUFF_FORMAT=$?
          uv run --locked ruff check . > /tmp/ruff-check-root.txt 2>&1
          RUFF_CHECK=$?
          uv run --locked mypy . --explicit-package-bases > /tmp/mypy-root.txt 2>&1
          MYPY=$?
          POLARIS_BROAD_VERIFY_AUTHORIZED=verify-spec-279 uv run --locked pytest -q \
            tests/application/decisions/test_initiation.py \
            tests/application/decisions/test_lifecycle_correction.py \
            tests/application/decisions/test_memory.py \
            tests/application/decisions/test_ordinary_work.py \
            tests/application/decisions/test_relationships.py \
            tests/application/decisions/test_resolution.py > /tmp/acceptance.txt 2>&1
          ACCEPTANCE=$?
          POLARIS_BROAD_VERIFY_AUTHORIZED=verify-architecture uv run --locked pytest -q \
            tests/test_architecture_guard.py \
            tests/test_architecture_guard_identity_aliases.py \
            tests/test_architecture_guard_legacy_loaders.py > /tmp/architecture.txt 2>&1
          ARCHITECTURE=$?
          uv run --locked arid . --fail-on-stale --suppression-summary > /tmp/arid.txt 2>&1
          ARID=$?
          python .agents/skills/verify-spec/scripts/verify_spec_artifacts.py self-test > /tmp/selftest.txt 2>&1
          SELFTEST=$?
          npm install --global jscpd@4.0.5 >/tmp/npm-jscpd.txt 2>&1
          jscpd . > /tmp/jscpd.txt 2>&1
          JSCPD=$?
          set -e

          cat /tmp/ruff-format-root.txt
          cat /tmp/ruff-check-root.txt
          cat /tmp/mypy-root.txt
          cat /tmp/acceptance.txt
          cat /tmp/architecture.txt
          cat /tmp/arid.txt
          cat /tmp/selftest.txt
          cat /tmp/jscpd.txt

          test "$RUFF_FORMAT" -eq 1
          grep -F 'tests/architecture_guard.py' /tmp/ruff-format-root.txt
          grep -F '1 file would be reformatted, 41 files already formatted' /tmp/ruff-format-root.txt
          test "$RUFF_CHECK" -eq 0
          test "$MYPY" -eq 0
          test "$ACCEPTANCE" -eq 0
          grep -F '123 passed' /tmp/acceptance.txt
          test "$ARCHITECTURE" -eq 0
          grep -F '305 passed' /tmp/architecture.txt
          test "$ARID" -eq 0
          grep -F 'No duplicate code found.' /tmp/arid.txt
          test "$SELFTEST" -eq 0
          grep -F 'VERIFY-SPEC ARTIFACT SELF-TEST: PASS' /tmp/selftest.txt
          test "$JSCPD" -eq 0
          grep -F 'Found 0 clones.' /tmp/jscpd.txt

          rm -rf .jscpd_report
          test -z "$(git status --porcelain)"

          python - <<'PY'
          from pathlib import Path
          import json
          summary = {
              'head': '3bbc9ec745e4b451a56404d492290a41160353d8',
              'baseline': '4daed9034891600597a47c01b6c39d5ebd9914ca',
              'ruff_format': {'status': 1, 'disposition': 'baseline-identical inherited failure in tests/architecture_guard.py'},
              'ruff_check': 0,
              'mypy': 0,
              'acceptance': '123 passed',
              'architecture': '305 passed',
              'arid': '0 groups / 0 stale suppressions',
              'jscpd': '0 clones',
              'artifact_selftest': 'PASS',
          }
          Path('/tmp/spec-279-gates.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spec-279-gates
          path: /tmp/spec-279-gates.json
          if-no-files-found: error
