name: tmp-verify-spec-279

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-verify-spec-279.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 68fac80b87984bff890570770f4c48cdcf033e13
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Run exact verify-spec root quality gates
        env:
          POLARIS_BROAD_VERIFY_AUTHORIZED: verify-spec-279
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '68fac80b87984bff890570770f4c48cdcf033e13'
          uv run --locked ruff format --check . | tee /tmp/ruff-format-root.txt
          uv run --locked ruff check . | tee /tmp/ruff-check-root.txt
          uv run --locked mypy . --explicit-package-bases | tee /tmp/mypy-root.txt
          test -z "$(git status --porcelain)"
          python - <<'PY'
          from pathlib import Path
          import json
          summary={
              'head':'68fac80b87984bff890570770f4c48cdcf033e13',
              'ruff_format':Path('/tmp/ruff-format-root.txt').read_text(encoding='utf-8', errors='replace').strip(),
              'ruff_check':Path('/tmp/ruff-check-root.txt').read_text(encoding='utf-8', errors='replace').strip(),
              'mypy':Path('/tmp/mypy-root.txt').read_text(encoding='utf-8', errors='replace').strip(),
          }
          Path('/tmp/spec-279-root-quality.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spec-279-root-quality
          path: /tmp/spec-279-root-quality.json
          if-no-files-found: error
