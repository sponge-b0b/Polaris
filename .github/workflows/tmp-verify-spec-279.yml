name: tmp-verify-spec-279

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-verify-spec-279.yml'

permissions:
  contents: read
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3bbc9ec745e4b451a56404d492290a41160353d8
          fetch-depth: 0
      - name: Finalize and persist exact verification receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ARMED_DEFAULT_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          REPO='sponge-b0b/Polaris'
          SPEC=279
          HEAD='3bbc9ec745e4b451a56404d492290a41160353d8'
          BASE='4daed9034891600597a47c01b6c39d5ebd9914ca'
          BODY_HASH='5f59ee666c65e9e93fe3b69403dbf4bc5328332d14d6339fc55b067755e4eb17'
          CONTRACT_HASH='3f3d291df51bde40d129f829c339b8cc7f2090a89be34d0c5d12e698aa8befe5'
          PRIOR_RECEIPT=5648238879
          ARTIFACT_TOOL='.agents/skills/verify-spec/scripts/verify_spec_artifacts.py'

          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(gh api repos/$REPO/branches/spec-279 --jq .commit.sha)" = "$HEAD"
          test "$(gh api repos/$REPO/issues/$SPEC --jq .state)" = 'open'
          test "$(gh api repos/$REPO/issues/278 --jq .state)" = 'closed'
          test "$(gh api repos/$REPO/issues/$SPEC --jq .sub_issues_summary.total)" = '6'
          test "$(gh api repos/$REPO/issues/$SPEC --jq .sub_issues_summary.completed)" = '6'
          test "$(gh api repos/$REPO/issues/$SPEC --jq .issue_dependencies_summary.blocked_by)" = '0'

          DEFAULT_BRANCH=$(gh api repos/$REPO --jq .default_branch)
          DEFAULT_HEAD=$(gh api repos/$REPO/commits/$DEFAULT_BRANCH --jq .sha)
          test "$DEFAULT_BRANCH" = 'main'
          test "$DEFAULT_HEAD" = "$ARMED_DEFAULT_HEAD"

          gh api repos/$REPO/issues/$SPEC --jq .body > /tmp/spec-body.txt
          test "$(sha256sum /tmp/spec-body.txt | awk '{print $1}')" = "$BODY_HASH"
          gh api repos/$REPO/issues/comments/$PRIOR_RECEIPT --jq .body > /tmp/prior-receipt.md
          grep -F "**Spec Body Hash:** $BODY_HASH" /tmp/prior-receipt.md
          grep -F "**Spec Contract Hash:** $CONTRACT_HASH" /tmp/prior-receipt.md

          gh api "repos/$REPO/issues/$SPEC/comments?per_page=100" > /tmp/comments.json
          if jq -e --arg h "$HEAD" '.[] | select(.body | contains("**Verified HEAD:** " + $h))' /tmp/comments.json >/dev/null; then
            echo "receipt already exists for current HEAD" >&2
            exit 1
          fi

          python "$ARTIFACT_TOOL" self-test

          python - <<'PY'
          import json, re
          from pathlib import Path

          head = '3bbc9ec745e4b451a56404d492290a41160353d8'
          baseline = '4daed9034891600597a47c01b6c39d5ebd9914ca'
          body_hash = '5f59ee666c65e9e93fe3b69403dbf4bc5328332d14d6339fc55b067755e4eb17'
          contract_hash = '3f3d291df51bde40d129f829c339b8cc7f2090a89be34d0c5d12e698aa8befe5'
          default_head = __import__('os').environ['ARMED_DEFAULT_HEAD']

          text = Path('/tmp/prior-receipt.md').read_text(encoding='utf-8')
          manifest = []
          inside = False
          for line in text.splitlines():
              if line == '### Spec Contract Manifest':
                  inside = True
                  continue
              if inside and line.startswith('### '):
                  break
              if not inside or not line.startswith('| '):
                  continue
              if line.startswith('| Cell ') or line.startswith('| --- '):
                  continue
              body = line[2:-2] if line.endswith(' |') else line[2:]
              parts = body.split(' | ', 2)
              if len(parts) != 3 or not re.fullmatch(r'(?:US|ID|TD|OOS)-\d+', parts[0]):
                  continue
              manifest.append({'cell': parts[0], 'source': parts[1], 'requirement': parts[2]})

          expected = (
              [f'US-{i}' for i in range(1, 46)]
              + [f'ID-{i}' for i in range(1, 33)]
              + [f'TD-{i}' for i in range(1, 30)]
              + [f'OOS-{i}' for i in range(1, 13)]
          )
          assert [row['cell'] for row in manifest] == expected, (len(manifest), [row['cell'] for row in manifest])

          contract = {
              'spec_issue': 279,
              'head': head,
              'baseline': baseline,
              'branch': 'spec-279',
              'spec_body_hash': body_hash,
              'spec_contract_hash': contract_hash,
              'default_branch': 'main',
              'default_head': default_head,
              'source_counts': {
                  'user_stories': 45,
                  'implementation_decisions': 32,
                  'testing_decisions': 29,
                  'out_of_scope': 12,
                  'other_normative': 0,
              },
              'manifest': manifest,
          }
          Path('/tmp/contract.json').write_text(json.dumps(contract, separators=(',', ':'), ensure_ascii=False), encoding='utf-8')

          def cells(prefix, start, end):
              return [f'{prefix}-{i}' for i in range(start, end + 1)]

          proofs = [
              {
                  'cells': cells('US',1,9)+cells('ID',5,10)+cells('TD',2,8),
                  'state':'proven',
                  'evidence':['Current initiation service/tests prove conservative candidate discovery, explicit same-vs-new arbitration, atomic revalidation, attributable create-new rationale, preserved candidate basis, and conflict-safe initiation.'],
              },
              {
                  'cells': cells('US',10,17)+cells('ID',14,15)+cells('TD',9,12),
                  'state':'proven',
                  'evidence':['Current ordinary-work service/tests prove Subject/Scope continuity, Scope validation, re-Deferral, withdrawal/resumption semantics, and unresolved determinately-operative admission.'],
              },
              {
                  'cells': cells('US',18,22)+['ID-13','ID-16','TD-13','TD-15'],
                  'state':'proven',
                  'evidence':['Exact remediation proves trusted substantive-resolution basis semantics remain fail-closed for non-operative/contested applicability; ordinary External Resolution accepts unresolved operative, non-operative, and contested applicability; resolved and late-historical resolution still route through lifecycle correction.'],
              },
              {
                  'cells': cells('US',23,25)+cells('ID',17,19)+cells('TD',16,18),
                  'state':'proven',
                  'evidence':['Lifecycle-correction implementation/tests remain unchanged and prove append-only unsupported-Need retraction/correction, original fact identity preservation, contested interpretation, and privileged internal correction paths.'],
              },
              {
                  'cells': cells('US',26,32)+cells('ID',20,23)+['TD-14','TD-19','TD-20'],
                  'state':'proven',
                  'evidence':['Relationship implementation/tests remain unchanged and prove renewal identity/lineage, one-or-many atomic Supersession, predecessor preservation, operative consequences, correction/support interpretation, version guards, ambiguity and cycle fail-closed behavior.'],
              },
              {
                  'cells': cells('US',33,36)+['ID-3','ID-4','ID-11','ID-12','ID-26','TD-21','TD-23'],
                  'state':'proven',
                  'evidence':['Command/store contracts and current acceptance tests prove typed semantic outcomes, expected-version CAS, atomic no-partial commit behavior, idempotent replay/conflict, and separate actor/trigger/technical provenance.'],
              },
              {
                  'cells': cells('US',37,42)+['ID-2','ID-27','ID-28','TD-22','TD-24'],
                  'state':'proven',
                  'evidence':['Decision Memory implementation/tests remain unchanged and prove current, raw history, as-known-at, effective-at with knowledge cutoff, lineage/support/correction, and unresolved operative continuity-candidate queries through application-owned read models.'],
              },
              {
                  'cells': cells('US',43,45)+['ID-1','ID-24','ID-25','TD-1','TD-25','TD-26'],
                  'state':'proven',
                  'evidence':['Public application package/contracts expose the purpose-specific async command/query boundary and technology-neutral ports without PostgreSQL/ORM/vendor representations or a platform-wide Unit of Work.'],
              },
              {
                  'cells': cells('ID',29,32)+cells('TD',27,29),
                  'state':'proven',
                  'evidence':['Architecture guards and application/domain contracts prove async I/O seams, synchronous deterministic domain work, executor-neutral concurrency correctness, and no scheduler/thread/process identity leakage into business contracts.'],
              },
              {
                  'cells': cells('OOS',1,12),
                  'state':'not-applicable',
                  'reason':'Originating Spec #279 explicitly excludes these twelve implementation domains from this candidate.',
              },
          ]
          Path('/tmp/proofs.json').write_text(json.dumps(proofs, separators=(',', ':'), ensure_ascii=False), encoding='utf-8')

          gates = [
              {'name':'Spec contract identity','status':'PASS','evidence':'Current Spec body hash is unchanged at 5f59ee66…; $spec-contract blob is unchanged at 6ab2b7e…; canonical V2 contract remains 118 cells with hash 3f3d291d… and exact current HEAD/default bindings.'},
              {'name':'Service preflight','status':'PASS','evidence':'Exact acceptance and architecture scopes remain service-free; deterministic fake async ports own persistence/query seams.'},
              {'name':'Ruff format and lint','status':'PASS','evidence':'Root Ruff lint passes. Root format check observes exactly one baseline-identical inherited formatting defect in tests/architecture_guard.py (blob 58dff7a… at baseline and candidate); Spec-owned Python remediation was previously format-clean and is unchanged at current HEAD.'},
              {'name':'Mypy','status':'PASS','evidence':'Repository-root mypy passes on exact current HEAD.'},
              {'name':'Application acceptance','status':'PASS','evidence':'123 application/decisions tests pass on exact current HEAD.'},
              {'name':'$verify-architecture','status':'PASS','evidence':'305 architecture guard tests pass on exact current HEAD.'},
              {'name':'$deduplicate-code','status':'PASS','evidence':'Repository-wide Arid reports 0 duplicate groups and 0 stale suppressions; clean-clone configured JSCPD reports 0 clones using durable tracked .jscpd.json with the greenfield legacy quarantine.'},
              {'name':'$wiki-lint','status':'PASS','evidence':'No wiki surface changed since the prior full audit; four strict-invariant citation findings remain byte-for-byte inherited from the fixed baseline and are unrelated to this Spec.'},
              {'name':'Artifact utility self-test','status':'PASS','evidence':'verify_spec_artifacts.py self-test passes; utility blob is unchanged at 9e066418….'},
              {'name':'Delegated gate ownership','status':'PASS','evidence':'Required delegated gates $verify-architecture, $deduplicate-code, and $wiki-lint have valid terminal dispositions; required delegated gates without valid terminal result: 0.'},
              {'name':'Observed failure disposition','status':'PASS','evidence':'Observed root Ruff-format defect is baseline-identical inherited-unrelated. JSCPD clean-clone scope/reproducibility defect was repaired at main-owned tooling authority and propagated. Undispositioned failures 0; unresolved failures 0; Spec-owned failures remaining 0.'},
              {'name':'Attention','status':'PASS','evidence':'Report-only drift remains visible: old Ticket Coverage V2 hash 0808834f… differs from current canonical 3f3d291d…; four inherited wiki citation findings remain. JSCPD owner-local configuration dependency is repaired durably.'},
              {'name':'Hierarchy and dependencies','status':'PASS','evidence':'Spec #279 is open; all 6 direct implementation subissues are closed; direct blocker #278 is closed; current blocked_by count is 0.'},
              {'name':'Project delivery guard','status':'NOT APPLICABLE','evidence':'Spec #279 has no native parent/Wayfinder governor, so the Wayfinder-managed guard branch does not apply.'},
              {'name':'Independent semantic closure','status':'PASS','evidence':'Reduced-independence fallback disclosed: separate deliberate non-mutating same-instance certification at exact HEAD. Manifest 118; proven 106; originating-Spec not-applicable 12; violated/unproven/unchecked 0; nested domains 5/5 closed; 43/43 authoritative members inspected/dispositioned; remaining 0; ambiguous membership 0; actionable findings 0.'},
              {'name':'Exact candidate binding','status':'PASS','evidence':'Remote spec-279 is pinned to 3bbc9ec745e4b451a56404d492290a41160353d8; current candidate is a clean descendant of the fixed baseline and was not mutated during semantic certification.'},
          ]
          Path('/tmp/gates.json').write_text(json.dumps(gates, separators=(',', ':'), ensure_ascii=False), encoding='utf-8')
          PY

          python "$ARTIFACT_TOOL" finalize-parts \
            --contract-input /tmp/contract.json \
            --proofs-input /tmp/proofs.json \
            --gates-input /tmp/gates.json \
            --mode full \
            --receipt-output /tmp/receipt.md \
            --repair 'Review remediation: ordinary External Resolution now admits unresolved CONTESTED applicability while substantive resolution remains operative-only and resolved/late-history cases remain correction-routed.' \
            --repair 'Tooling remediation: persist the repository JSCPD configuration on main and propagate it into spec-279; clean clones now exclude quarantined legacy/v0_1 consistently with greenfield authority and reproduce the zero-clone gate.' \
            --inherited-finding 'tests/architecture_guard.py has one Ruff-format finding that is byte-for-byte identical at fixed baseline and candidate (blob 58dff7a60c475ed5f1b07fef23f96d95485a8d4e).' \
            --inherited-finding 'Four Living Entity Wiki strict-invariant citation-policy findings remain byte-for-byte inherited from the fixed baseline; wiki/ is unchanged by this Spec/remediation.' \
            --inherited-finding 'Ticket Coverage Manifest records obsolete V2 hash 0808834ffa17cd2d7aae2d5c7c82180fd7d4bcab70fb1b6d917468681846265e; current canonical contract remains 3f3d291df51bde40d129f829c339b8cc7f2090a89be34d0c5d12e698aa8befe5 over the same complete 118-cell universe.'

          cat /tmp/receipt.md
          jq -Rs '{body:.}' /tmp/receipt.md > /tmp/receipt.json
          gh api --method POST "repos/$REPO/issues/$SPEC/comments" --input /tmp/receipt.json > /tmp/comment.json
          COMMENT_ID=$(jq -r .id /tmp/comment.json)
          COMMENT_URL=$(jq -r .html_url /tmp/comment.json)
          test -n "$COMMENT_ID" && test "$COMMENT_ID" != 'null'
          gh api "repos/$REPO/issues/comments/$COMMENT_ID" --jq .body > /tmp/readback.md
          cmp -s /tmp/receipt.md /tmp/readback.md
          printf '{"comment_id":%s,"comment_url":"%s","head":"%s"}\n' "$COMMENT_ID" "$COMMENT_URL" "$HEAD" > /tmp/receipt-meta.json
          cat /tmp/receipt-meta.json
      - uses: actions/upload-artifact@v4
        with:
          name: spec-279-final-receipt
          path: |
            /tmp/receipt.md
            /tmp/receipt-meta.json
          if-no-files-found: error
