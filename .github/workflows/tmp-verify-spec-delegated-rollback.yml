name: Temporary verify-spec delegated rollback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-verify-spec-delegated-rollback.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply exact delegated rollback
        run: python .github/tmp-verify-spec-delegated-rollback.py
