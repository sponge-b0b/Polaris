name: tmp-verify-spec-hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-verify-spec-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'stage verify-spec hardening')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded skill hardening
        run: |
          set -euo pipefail
          python .github/tmp-verify-spec-hardening.py
          git diff --check
          expected=$(printf '%s\n' \
            '.agents/skills/spec-contract/SKILL.md' \
            '.agents/skills/verify-spec/SKILL.md' | sort)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"
          test "$(git status --porcelain | wc -l)" -eq 2
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/skills/spec-contract/SKILL.md .agents/skills/verify-spec/SKILL.md
          git commit -m 'fix(skills): isolate spec contract reconstruction'
          git push origin HEAD:main
