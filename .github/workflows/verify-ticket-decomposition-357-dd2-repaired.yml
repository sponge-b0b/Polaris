name: Fresh authorized DD2 repaired decomposition verifier

on:
  push:
    branches:
      - chatgpt/verify-ticket-decomposition-357-dd2-repaired

permissions:
  contents: read
  issues: read
  pull-requests: read
  copilot-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERIFIER_SESSION_ID: 357dd2b3-8c7e-4f5a-a1d2-9b0c3e4f5a67
      CANDIDATE_HEAD: 5ad1886205a33a73a058d98104f0f299b368b086
      VERIFIER_SKILL_BLOB: 5e8e389ef9509a7da628f37870ea6adab725737a
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify transport binding
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          PROPOSAL_SHA="$(sha256sum .verification/proposal-357-dd2-repaired.txt | awk '{print $1}')"
          echo "proposal_sha=$PROPOSAL_SHA" >> "$GITHUB_OUTPUT"
          git cat-file -e "${CANDIDATE_HEAD}^{commit}"
          test "$(git show "${CANDIDATE_HEAD}:.agents/skills/verify-ticket-decomposition/SKILL.md" | git hash-object --stdin)" = "$VERIFIER_SKILL_BLOB"
          test "$(git rev-parse "${CANDIDATE_HEAD}^{commit}")" = "$CANDIDATE_HEAD"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run fresh independent verifier
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          COPILOT_HOME: ${{ runner.temp }}/copilot-home
          PROPOSAL_SHA: ${{ steps.binding.outputs.proposal_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$COPILOT_HOME"
          PROMPT=$(cat <<EOF
          You are the owner-authorized additional genuinely fresh, independent, non-mutating verifier for Polaris \$to-tickets after the previous verifier context was lost.
          Execute .agents/skills/verify-ticket-decomposition/SKILL.md exactly.
          First read AGENTS.md, .agents/skills/verify-ticket-decomposition/SKILL.md, .verification/dispatch-357-dd2-repaired.txt, and .verification/proposal-357-dd2-repaired.txt.
          Independently recover and challenge the authoritative Spec #357, current tracker state, accepted ADRs, parent Ticket Coverage Manifest, DD-2 record, native dependencies, active ticket universe, and semantic consumers using read-only git/gh commands.
          The exact reviewed Spec branch candidate is ${CANDIDATE_HEAD}. The exact proposal identity is ${PROPOSAL_SHA}.
          Treat the transport branch and all .verification files as transport/retrieval state only, not semantic authority. Treat parent matrices/readiness claims as falsifiable retrieval evidence only.
          Perform the full verifier procedure independently, including source closure, exact semantic carry, changed-invariant consumer propagation, dependency fidelity, live-WIP reslice safety, context fit, design delegation, and the exact proposed TCM/DD publication actions.
          The earlier verifier findings and the parent's repairs are not authoritative conclusions. Re-derive whether the repaired candidate closes them and search for additional bounded defects.
          Do not write to the repository, do not change GitHub tracker state, do not spawn another semantic verifier, and do not redesign the proposal.
          Return exactly one complete terminal verdict in the skill's required format, beginning with exactly either:
          TICKET DECOMPOSITION: PASS
          or
          TICKET DECOMPOSITION: FAIL
          Bind the verdict to proposal identity ${PROPOSAL_SHA}.
          EOF
          )
          copilot --session-id="$VERIFIER_SESSION_ID" --name="Polaris Spec357 DD2 repaired verifier" -s -p "$PROMPT" --no-ask-user \
            --allow-tool=read \
            --allow-tool='shell(git:*)' \
            --allow-tool='shell(gh:*)' \
            --allow-tool='shell(cat:*)' \
            --allow-tool='shell(sed:*)' \
            --allow-tool='shell(grep:*)' \
            --allow-tool='shell(pwd:*)' \
            --allow-tool='shell(find:*)' \
            --allow-tool='shell(jq:*)' \
            | tee /tmp/verdict.txt
          test "$(grep -Ec '^TICKET DECOMPOSITION: (PASS|FAIL)$' /tmp/verdict.txt)" -eq 1
          grep -Fq "$PROPOSAL_SHA" /tmp/verdict.txt

      - name: Persist verifier session state
        shell: bash
        env:
          COPILOT_HOME: ${{ runner.temp }}/copilot-home
          PROPOSAL_SHA: ${{ steps.binding.outputs.proposal_sha }}
        run: |
          set -euo pipefail
          test -d "$COPILOT_HOME/session-state/$VERIFIER_SESSION_ID"
          tar -C "$COPILOT_HOME" -czf /tmp/copilot-home.tgz .
          SESSION_ARCHIVE_SHA="$(sha256sum /tmp/copilot-home.tgz | awk '{print $1}')"
          cat > /tmp/session-manifest.txt <<EOF
          verifier_session_id=$VERIFIER_SESSION_ID
          proposal_sha256=$PROPOSAL_SHA
          candidate_head=$CANDIDATE_HEAD
          verifier_skill_blob=$VERIFIER_SKILL_BLOB
          actions_run_id=$GITHUB_RUN_ID
          copilot_home_archive_sha256=$SESSION_ARCHIVE_SHA
          EOF
          cat /tmp/session-manifest.txt

      - name: Upload verifier verdict
        uses: actions/upload-artifact@v4
        with:
          name: ticket-decomposition-357-dd2-repaired-verdict
          path: /tmp/verdict.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload resumable verifier session
        uses: actions/upload-artifact@v4
        with:
          name: ticket-decomposition-357-dd2-repaired-session
          path: /tmp/copilot-home.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Upload verifier session manifest
        uses: actions/upload-artifact@v4
        with:
          name: ticket-decomposition-357-dd2-repaired-session-manifest
          path: /tmp/session-manifest.txt
          if-no-files-found: error
          retention-days: 14
