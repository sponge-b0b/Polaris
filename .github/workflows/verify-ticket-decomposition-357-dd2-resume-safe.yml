name: Publish certified Spec357 DD2 proposal

on:
  push:
    branches:
      - chatgpt/publish-spec357-dd2-certified

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish exact certified proposal
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: python .verification/publish-certified-dd2.py

      - name: Upload publication readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec357-dd2-publication-result
          path: /tmp/publication-result.json
          if-no-files-found: warn
          retention-days: 30
