services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POLARIS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${POLARIS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${POLARIS_POSTGRES_DB}
    ports:
      - "${POLARIS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POLARIS_POSTGRES_USER} -d ${POLARIS_POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
