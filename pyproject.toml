[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polaris"
version = "0.2.0"
description = "Decision-centered AI intelligence for trustworthy portfolio and investment decisions."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/polaris"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
extend-exclude = [
    "*.md",
    "legacy/**",
]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "C90",
    "B",
    "UP",
    "N801",
    "N802",
    "N999",
    "PGH003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.arid]
min-lines = 4
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true
same-file = true
hidden = false
exclude = [
    "legacy/**",
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true

# Preserve Polaris's intentionally permissive/basic type-checking policy.
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
disallow_subclassing_any = false
strict_optional = false

exclude = [
    '^legacy/',
    '^venv/',
    '^\.venv/',
    '^\.repowise/',
    '^\.git/',
    '__pycache__/',
    '\.jscpd_report/',
    '\.mypy_cache/',
    '\.pytest_cache/',
    '\.ruff_cache/',
    '^graphify-out/',
    '^build/',
    '\.md$',
]

[tool.coverage.run]
source = ["polaris"]

omit = [
    "*/__pycache__/*",
    "*/migrations/*",
    "*/examples/*",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
